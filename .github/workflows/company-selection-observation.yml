name: Company selection observation

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: company-selection-observation
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      vars.COMPANY_REFERENCE_OBSERVATION_START != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'viktor-shcherb' && github.triggering_actor == 'viktor-shcherb'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Verify collector contracts and warm the pinned readonly CLI
        run: |
          node --test scripts/collect-company-selection-telemetry.test.mjs
          pnpm dlx vercel@62.1.0 --version >/dev/null
      - name: Collect aggregate checkpoints across production deployments
        env:
          COMPANY_REFERENCE_OBSERVATION_START: ${{ vars.COMPANY_REFERENCE_OBSERVATION_START }}
          COMPANY_SELECTION_OBSERVATION_OUTPUT: ${{ runner.temp }}/company-selection-observation/checkpoint.json
          GH_TOKEN: ${{ github.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/collect-company-selection-telemetry.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: company-selection-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/company-selection-observation/checkpoint.json
          if-no-files-found: error
          retention-days: 14
      - name: Show bounded hourly, daily, and seven-day coverage
        if: always()
        run: |
          summary="$RUNNER_TEMP/company-selection-observation/summary.json"
          if test -f "$summary"; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
