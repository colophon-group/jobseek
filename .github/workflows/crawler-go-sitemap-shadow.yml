name: Crawler Go sitemap production shadow
run-name: "Go sitemap shadow @ ${{ github.sha }}"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_REPOSITORY: ghcr.io/colophon-group/jobseek-go-sitemap-shadow

concurrency:
  group: deploy-murmur-shim
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Refuse non-main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/heads/main ]] || {
            echo "Production shadow runs must be dispatched from main" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Attest current main source
        id: source
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$remote_main" == "$source_commit" ]] || {
            echo "Checked-out revision is no longer current main" >&2
            exit 1
          }
          image_identity="${IMAGE_REPOSITORY}:sha-${source_commit}"
          printf 'source_commit=%s\n' "$source_commit" >>"$GITHUB_OUTPUT"
          printf 'image_identity=%s\n' "$image_identity" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact shadow image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: pilots/go-http-sitemap/Dockerfile.shadow
          platforms: linux/arm64
          push: true
          tags: ${{ steps.source.outputs.image_identity }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.source_commit }}
            IMAGE_IDENTITY=${{ steps.source.outputs.image_identity }}
          cache-from: type=gha,scope=go-sitemap-shadow
          cache-to: type=gha,mode=max,scope=go-sitemap-shadow,ignore-error=true

      - name: Run bounded one-shot on idle Murmur host
        id: shadow
        env:
          TARGET_HOST: ${{ secrets.HETZNER_MURMUR_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_MURMUR_KNOWN_HOSTS }}
          GHCR_PULL_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          IMAGE_IDENTITY: ${{ steps.source.outputs.image_identity }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          : "${TARGET_HOST:?Murmur host is required}"
          : "${SSH_PRIVATE_KEY:?SSH private key is required}"
          : "${SSH_KNOWN_HOSTS:?pinned Murmur host keys are required}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          ssh_root="$(mktemp -d)"
          cleanup_local() {
            status=$?
            trap - EXIT HUP INT TERM
            rm -rf -- "$ssh_root"
            exit "$status"
          }
          trap cleanup_local EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chmod 0700 "$ssh_root"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$ssh_root/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$ssh_root/known_hosts"
          chmod 0600 "$ssh_root/id" "$ssh_root/known_hosts"
          ssh_options=(
            -i "$ssh_root/id"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_root/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )

          image_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          report_path="$RUNNER_TEMP/go-sitemap-shadow-report.json"
          raw_report_path="$RUNNER_TEMP/go-sitemap-shadow-report.raw.json"
          wire_path="$RUNNER_TEMP/go-sitemap-shadow-report.wire"
          write_fallback_report() {
            jq -n \
              --arg commit "$EXPECTED_SOURCE_COMMIT" \
              --arg identity "$IMAGE_IDENTITY" \
              --arg digest "$IMAGE_DIGEST" \
              '{
                schema_version: 1,
                source_commit: $commit,
                image_identity: $identity,
                image_digest: $digest,
                status: "failed",
                error_kind: "report_transport_invalid",
                run_duration_ms: 0,
                jobs: [],
                worker: {},
                connections: {},
                container_lifecycle: {
                  name: "jobseek-go-sitemap-shadow",
                  status: "unknown",
                  exit_code: -1,
                  oom_killed: true,
                  valid: false
                },
                protected_services_unchanged: false
              }' >"$report_path"
            cp "$report_path" go-sitemap-shadow-report.json
          }
          # Create evidence before the first network operation. Validated
          # container output may replace it, but every failure retains an
          # uploadable sanitized artifact.
          write_fallback_report

          remote_docker_config="$(ssh "${ssh_options[@]}" "deploy@$TARGET_HOST" \
            'mktemp -d /tmp/jobseek-go-sitemap-shadow-auth.XXXXXX')"
          [[ "$remote_docker_config" =~ ^/tmp/jobseek-go-sitemap-shadow-auth\.[A-Za-z0-9]+$ ]]
          cleanup_all() {
            status=$?
            trap - EXIT HUP INT TERM
            # shellcheck disable=SC2029 # The validated path intentionally expands locally.
            ssh "${ssh_options[@]}" "deploy@$TARGET_HOST" \
              "rm -rf -- '$remote_docker_config'" >/dev/null 2>&1 || true
            rm -rf -- "$ssh_root"
            exit "$status"
          }
          trap cleanup_all EXIT

          [[ "$GHCR_PULL_USERNAME" =~ ^[A-Za-z0-9_-]+$ ]]
          # shellcheck disable=SC2029 # Both validated non-secret arguments intentionally expand locally.
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_options[@]}" "deploy@$TARGET_HOST" \
            "DOCKER_CONFIG='$remote_docker_config' docker login ghcr.io --username '$GHCR_PULL_USERNAME' --password-stdin" \
            >/dev/null

          set +e
          ssh "${ssh_options[@]}" "deploy@$TARGET_HOST" \
            timeout --signal=TERM --kill-after=15s 180s \
            bash -s -- "$image_ref" "$IMAGE_IDENTITY" "$EXPECTED_SOURCE_COMMIT" "$remote_docker_config" \
            >"$wire_path" <<'REMOTE'
          set -euo pipefail
          image_ref="$1"
          image_identity="$2"
          expected_commit="$3"
          docker_config="$4"
          name=jobseek-go-sitemap-shadow
          cleanup_label_key=org.colophon.jobseek.shadow.owner
          cleanup_label_value="${docker_config##*.}"
          cid_file="$docker_config/canary.cid"
          cleanup_armed=0
          report_file=""

          cleanup_remote() {
            status=$?
            trap - EXIT HUP INT TERM
            if (( cleanup_armed )); then
              owned_ids=()
              if [[ -s "$cid_file" ]]; then
                candidate_id="$(<"$cid_file")"
                if [[ "$candidate_id" =~ ^[0-9a-f]{64}$ ]]; then
                  owned_ids+=("$candidate_id")
                fi
              fi
              mapfile -t label_ids < <(docker ps -aq \
                --filter "label=${cleanup_label_key}=${cleanup_label_value}")
              owned_ids+=("${label_ids[@]}")
              if (( ${#owned_ids[@]} )); then
                docker rm -f "${owned_ids[@]}" >/dev/null 2>&1 || true
              fi
            fi
            if [[ -n "$report_file" ]]; then
              rm -f -- "$report_file"
            fi
            rm -rf -- "$docker_config"
            exit "$status"
          }
          trap cleanup_remote EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$image_ref" =~ ^ghcr\.io/colophon-group/jobseek-go-sitemap-shadow@sha256:[0-9a-f]{64}$ ]]
          [[ "$image_identity" =~ ^ghcr\.io/colophon-group/jobseek-go-sitemap-shadow:sha-[0-9a-f]{40}$ ]]
          [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$image_identity" == "ghcr.io/colophon-group/jobseek-go-sitemap-shadow:sha-$expected_commit" ]]
          [[ "$docker_config" =~ ^/tmp/jobseek-go-sitemap-shadow-auth\.[A-Za-z0-9]+$ ]]
          if docker ps -a --format '{{.Names}}' | grep -Fxq "$name"; then
            echo "A sitemap shadow container already exists; refusing overlap" >&2
            exit 1
          fi
          if docker ps -aq \
               --filter "label=${cleanup_label_key}=${cleanup_label_value}" | grep -q .; then
            echo "A sitemap shadow ownership label already exists; refusing overlap" >&2
            exit 1
          fi
          cleanup_armed=1

          snapshot_protected_services() {
            for service in murmur cloudflared; do
              mapfile -t ids < <(docker ps -aq \
                --filter label=com.docker.compose.project=deploy \
                --filter "label=com.docker.compose.service=$service")
              [[ ${#ids[@]} -eq 1 ]] || {
                echo "Expected exactly one protected $service container" >&2
                return 1
              }
              docker inspect --format \
                "${service}|{{.Id}}|{{.State.Status}}|{{.RestartCount}}" \
                "${ids[0]}"
            done
          }
          protected_before="$(snapshot_protected_services)"
          while IFS='|' read -r service _ status _; do
            [[ -n "$service" && "$status" == running ]] || {
              echo "A protected Murmur service is not running" >&2
              exit 1
            }
          done <<<"$protected_before"

          DOCKER_CONFIG="$docker_config" docker pull "$image_ref" >&2
          report_file="$(mktemp /tmp/jobseek-go-sitemap-shadow-report.XXXXXX)"
          docker create \
            --name "$name" \
            --cidfile "$cid_file" \
            --label "$cleanup_label_key=$cleanup_label_value" \
            --read-only \
            --network bridge \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 64 \
            --cpus 0.5 \
            --memory 256m \
            --memory-swap 256m \
            "$image_ref" >/dev/null
          [[ -s "$cid_file" ]]

          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            docker start --attach "$name" >"$report_file"
          canary_status=$?
          set -e

          lifecycle="$(docker inspect --format \
            '{{.State.Status}}|{{.State.ExitCode}}|{{.State.OOMKilled}}|{{.Config.Image}}' \
            "$name")"
          IFS='|' read -r container_status container_exit oom_killed configured_image <<<"$lifecycle"
          lifecycle_ok=true
          [[ "$container_status" == exited ]] || lifecycle_ok=false
          [[ "$oom_killed" == false ]] || lifecycle_ok=false
          [[ "$configured_image" == "$image_ref" ]] || lifecycle_ok=false
          if (( canary_status < 125 )); then
            [[ "$container_exit" == "$canary_status" ]] || lifecycle_ok=false
          else
            lifecycle_ok=false
          fi

          protected_after="$(snapshot_protected_services)"
          protected_unchanged=false
          [[ "$protected_after" == "$protected_before" ]] && protected_unchanged=true

          # Keep the target dependency-free: send one validated lifecycle line
          # followed by the canary's already-sanitized, single-line JSON. The
          # GitHub runner owns JSON validation and artifact construction.
          printf 'SHADOW_LIFECYCLE\t%s\t%s\t%s\t%s\t%s\n' \
            "$container_status" "$container_exit" "$oom_killed" \
            "$lifecycle_ok" "$protected_unchanged"
          if [[ -s "$report_file" ]] && (( $(wc -c <"$report_file") <= 65536 )); then
            cat "$report_file"
          fi

          [[ "$lifecycle_ok" == true && "$protected_unchanged" == true ]] || exit 1
          exit "$canary_status"
          REMOTE
          remote_status=$?
          set -e

          protocol=""
          container_status="unknown"
          container_exit=-1
          oom_killed=true
          lifecycle_ok=false
          protected_unchanged=false
          extra=""
          lifecycle_metadata_valid=false
          if [[ -s "$wire_path" ]]; then
            IFS=$'\t' read -r protocol container_status container_exit oom_killed \
              lifecycle_ok protected_unchanged extra <"$wire_path" || true
            tail -n +2 "$wire_path" >"$raw_report_path"
            if [[ "$protocol" == SHADOW_LIFECYCLE && -z "$extra" && \
                  "$container_status" =~ ^[a-z]+$ && \
                  "$container_exit" =~ ^[0-9]+$ && \
                  "$oom_killed" =~ ^(true|false)$ && \
                  "$lifecycle_ok" =~ ^(true|false)$ && \
                  "$protected_unchanged" =~ ^(true|false)$ ]] && \
               (( container_exit <= 255 )); then
              lifecycle_metadata_valid=true
            fi
          else
            : >"$raw_report_path"
          fi

          if [[ "$lifecycle_metadata_valid" == true && \
                -s "$raw_report_path" && \
                $(wc -c <"$raw_report_path") -le 65536 && \
                $(wc -l <"$raw_report_path") -eq 1 ]] && \
             jq -e -s 'length == 1 and (.[0] | type == "object")' \
               "$raw_report_path" >/dev/null 2>&1; then
            jq -s \
              --arg image_digest "$IMAGE_DIGEST" \
              --arg container_name jobseek-go-sitemap-shadow \
              --arg container_status "$container_status" \
              --argjson container_exit "$container_exit" \
              --argjson oom_killed "$oom_killed" \
              --argjson lifecycle_ok "$lifecycle_ok" \
              --argjson protected_services_unchanged "$protected_unchanged" \
              '.[0] + {
                image_digest: $image_digest,
                container_lifecycle: {
                  name: $container_name,
                  status: $container_status,
                  exit_code: $container_exit,
                  oom_killed: $oom_killed,
                  valid: $lifecycle_ok
                },
                protected_services_unchanged: $protected_services_unchanged
              }' "$raw_report_path" >"$report_path"
            cp "$report_path" go-sitemap-shadow-report.json
          fi

          if ! ssh "${ssh_options[@]}" "deploy@$TARGET_HOST" \
            "! docker ps -a --format '{{.Names}}' | grep -Fxq jobseek-go-sitemap-shadow"; then
            echo "Shadow container cleanup was not completed" >&2
            remote_status=1
          fi
          (( remote_status == 0 )) || exit "$remote_status"

          jq -e \
            --arg commit "$EXPECTED_SOURCE_COMMIT" \
            --arg identity "$IMAGE_IDENTITY" \
            --arg digest "$IMAGE_DIGEST" \
            '.schema_version == 1 and
             .source_commit == $commit and
             .image_identity == $identity and
             .image_digest == $digest and
             .status == "succeeded" and
             .error_kind == null and
             (.run_duration_ms >= 0) and
             (.jobs | length == 2) and
             (.jobs | all(
               .status == "succeeded" and
               .truncated == false and
               (.canonical_url_count > 0) and
               (.canonical_url_sha256 | test("^[0-9a-f]{64}$"))
             )) and
             .worker.accepted == 2 and
             .worker.completed == 2 and
             .worker.panics == 0 and
             .worker.queued == 0 and
             .worker.in_flight == 0 and
             .worker.max_in_flight == 2 and
             .connections.open == 0 and
             .connections.in_use_permits == 0 and
             .connections.waiters == 0 and
             .connections.maximum_open <= .connections.permit_limit and
             .connections.maximum_in_use_permits <= .connections.permit_limit and
             .container_lifecycle.valid == true and
             .container_lifecycle.oom_killed == false and
             .protected_services_unchanged == true' \
            "$report_path" >/dev/null

      - name: Upload sanitized shadow report
        if: always() && steps.shadow.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-sitemap-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: go-sitemap-shadow-report.json
          if-no-files-found: error
          retention-days: 14
