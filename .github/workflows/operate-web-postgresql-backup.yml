name: Operate Web PostgreSQL Backup (Hetzner)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Staged web PostgreSQL backup operation
        required: true
        default: verify
        type: choice
        options:
          - verify
          - backup
          - restore
          - rehearse
          - enable-timer
      rehearsal_migration_tag:
        description: Exact reviewed company reference rehearsal target
        required: false
        default: 0100_company_references
        type: choice
        options:
          - 0100_company_references
          - 0101_company_reference_selection_contract
      confirmation:
        description: Enter the exact confirmation token documented in the runbook
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REHEARSAL_MIGRATION_TAG: ${{ inputs.rehearsal_migration_tag }}

concurrency:
  # Share the deployment lock so an operation cannot overlap artifact sync.
  group: hetzner-data-backup-production-sync
  cancel-in-progress: false

jobs:
  preauthorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISPATCH_ACTOR: ${{ github.actor }}
      DISPATCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      DISPATCH_MODE: ${{ inputs.mode }}
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_EVENT: ${{ github.event_name }}
      DISPATCH_REF: ${{ github.ref }}
    steps:
      - name: Reject unauthorized dispatches before requesting approval
        run: |
          set -euo pipefail
          test "$DISPATCH_ACTOR" = viktor-shcherb
          test "$DISPATCH_TRIGGERING_ACTOR" = viktor-shcherb
          test "$DISPATCH_EVENT" = workflow_dispatch
          test "$DISPATCH_REF" = refs/heads/main
          case "$DISPATCH_MODE:$DISPATCH_CONFIRMATION" in
            verify:VERIFY-WEB-POSTGRESQL) ;;
            backup:RUN-WEB-POSTGRESQL-BACKUP) ;;
            restore:RUN-WEB-POSTGRESQL-RESTORE-DRILL) ;;
            rehearse:REHEARSE-COMPANY-REFERENCE-0100) test "$REHEARSAL_MIGRATION_TAG" = 0100_company_references ;;
            rehearse:REHEARSE-COMPANY-REFERENCE-0101) test "$REHEARSAL_MIGRATION_TAG" = 0101_company_reference_selection_contract ;;
            enable-timer:ENABLE-WEB-POSTGRESQL-TIMER) ;;
            *) exit 2 ;;
          esac

  authorize:
    needs: preauthorize
    if: github.actor == 'viktor-shcherb' && github.triggering_actor == 'viktor-shcherb'
    runs-on: ubuntu-latest
    environment: production-backup-operations
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.artifacts.outputs.deploy_sha }}
      data_backup_sha256: ${{ steps.artifacts.outputs.data_backup_sha256 }}
      image_protector_sha256: ${{ steps.artifacts.outputs.image_protector_sha256 }}
      operations_sha256: ${{ steps.artifacts.outputs.operations_sha256 }}
      retirement_migration_sha256: ${{ steps.artifacts.outputs.retirement_migration_sha256 }}
      restore_drill_sha256: ${{ steps.artifacts.outputs.restore_drill_sha256 }}
      service_sha256: ${{ steps.artifacts.outputs.service_sha256 }}
      timer_sha256: ${{ steps.artifacts.outputs.timer_sha256 }}
      rehearsal_manifest_sha256: ${{ steps.rehearsal.outputs.manifest_sha256 }}
      rehearsal_verifier_sha256: ${{ steps.rehearsal.outputs.verifier_sha256 }}
    env:
      DISPATCH_ACTOR: ${{ github.actor }}
      DISPATCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      DISPATCH_MODE: ${{ inputs.mode }}
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_EVENT: ${{ github.event_name }}
      DISPATCH_REF: ${{ github.ref }}
      DISPATCH_SHA: ${{ github.sha }}
    steps:
      - name: Require the owner, main, and mode-specific confirmation
        run: |
          set -euo pipefail
          test "$DISPATCH_ACTOR" = viktor-shcherb
          test "$DISPATCH_TRIGGERING_ACTOR" = viktor-shcherb
          test "$DISPATCH_EVENT" = workflow_dispatch
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$DISPATCH_MODE" in
            verify)
              expected=VERIFY-WEB-POSTGRESQL
              ;;
            backup)
              expected=RUN-WEB-POSTGRESQL-BACKUP
              ;;
            restore)
              expected=RUN-WEB-POSTGRESQL-RESTORE-DRILL
              ;;
            rehearse)
              case "$REHEARSAL_MIGRATION_TAG" in
                0100_company_references) expected=REHEARSE-COMPANY-REFERENCE-0100 ;;
                0101_company_reference_selection_contract) expected=REHEARSE-COMPANY-REFERENCE-0101 ;;
                *) exit 2 ;;
              esac
              ;;
            enable-timer)
              expected=ENABLE-WEB-POSTGRESQL-TIMER
              ;;
            *)
              echo "Unsupported operation mode" >&2
              exit 2
              ;;
          esac
          test "$DISPATCH_CONFIRMATION" = "$expected"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.mode == 'rehearse'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: inputs.mode == 'rehearse'
        with:
          node-version: 24
          cache: pnpm
      - name: Bind the reviewed helper bundle and exact target
        if: inputs.mode == 'rehearse'
        id: rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq .object.sha)" = "$DISPATCH_SHA"
          pnpm install --frozen-lockfile
          pnpm --filter @jobseek/web build:company-reference:rehearsal
          manifest=deploy/backups/web-postgresql/company-reference-bundle/manifest.json
          digest="$(sha256sum "$manifest" | cut -d' ' -f1)"
          python3 deploy/backups/web-postgresql/verify-rehearsal-bundle.py "$(dirname "$manifest")" "$DISPATCH_SHA" "$digest" "$REHEARSAL_MIGRATION_TAG"
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "verifier_sha256=$(sha256sum deploy/backups/web-postgresql/verify-rehearsal-bundle.py | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Bind authorization to the deployed revision and reviewed artifacts
        id: artifacts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          deploy_sha="$DISPATCH_SHA"
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "deploy_sha=$deploy_sha"
            echo "data_backup_sha256=$(sha256sum scripts/jobseek-data-backup.py | cut -d' ' -f1)"
            echo "image_protector_sha256=$(sha256sum deploy/backups/web-postgresql/protect-client-image.sh | cut -d' ' -f1)"
            echo "operations_sha256=$(sha256sum deploy/backups/web-postgresql/operations.py | cut -d' ' -f1)"
            echo "retirement_migration_sha256=$(sha256sum apps/web/drizzle/0086_drop_supabase_job_posting.sql | cut -d' ' -f1)"
            echo "restore_drill_sha256=$(sha256sum deploy/backups/web-postgresql/restore-drill.sh | cut -d' ' -f1)"
            echo "service_sha256=$(sha256sum deploy/systemd/jobseek-web-postgresql-backup.service | cut -d' ' -f1)"
            echo "timer_sha256=$(sha256sum deploy/systemd/jobseek-web-postgresql-backup.timer | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: [preauthorize, authorize]
    if: github.actor == 'viktor-shcherb' && github.triggering_actor == 'viktor-shcherb'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      OPERATION_MODE: ${{ inputs.mode }}
      DISPATCH_ACTOR: ${{ github.actor }}
      DISPATCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
      EXPECTED_DEPLOY_SHA: ${{ needs.authorize.outputs.deploy_sha }}
      EXPECTED_DATA_BACKUP_SHA256: ${{ needs.authorize.outputs.data_backup_sha256 }}
      EXPECTED_IMAGE_PROTECTOR_SHA256: ${{ needs.authorize.outputs.image_protector_sha256 }}
      EXPECTED_OPERATIONS_SHA256: ${{ needs.authorize.outputs.operations_sha256 }}
      EXPECTED_RETIREMENT_MIGRATION_SHA256: ${{ needs.authorize.outputs.retirement_migration_sha256 }}
      EXPECTED_RESTORE_DRILL_SHA256: ${{ needs.authorize.outputs.restore_drill_sha256 }}
      EXPECTED_SERVICE_SHA256: ${{ needs.authorize.outputs.service_sha256 }}
      EXPECTED_TIMER_SHA256: ${{ needs.authorize.outputs.timer_sha256 }}
      EXPECTED_REHEARSAL_MANIFEST_SHA256: ${{ needs.authorize.outputs.rehearsal_manifest_sha256 }}
      EXPECTED_REHEARSAL_VERIFIER_SHA256: ${{ needs.authorize.outputs.rehearsal_verifier_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run the authorized operation over host-key-pinned OpenSSH
        run: |
          set -euo pipefail
          umask 077
          test "$DISPATCH_ACTOR" = viktor-shcherb
          test "$DISPATCH_TRIGGERING_ACTOR" = viktor-shcherb
          case "$OPERATION_MODE" in
            verify|backup|restore|rehearse|enable-timer) ;;
            *) exit 2 ;;
          esac
          : "${TARGET_HOST:?production host is required}"
          : "${SSH_PRIVATE_KEY:?SSH private key is required}"
          : "${SSH_KNOWN_HOSTS:?trusted SSH host keys are required}"
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          for digest in \
            "$EXPECTED_DATA_BACKUP_SHA256" \
            "$EXPECTED_IMAGE_PROTECTOR_SHA256" \
            "$EXPECTED_OPERATIONS_SHA256" \
            "$EXPECTED_RETIREMENT_MIGRATION_SHA256" \
            "$EXPECTED_RESTORE_DRILL_SHA256" \
            "$EXPECTED_SERVICE_SHA256" \
            "$EXPECTED_TIMER_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done

          rehearsal_args=""
          if [[ "$OPERATION_MODE" == rehearse ]]; then
            case "$REHEARSAL_MIGRATION_TAG" in
              0100_company_references|0101_company_reference_selection_contract) ;;
              *) exit 2 ;;
            esac
            test "$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq .object.sha)" = "$EXPECTED_DEPLOY_SHA"
            [[ "$EXPECTED_REHEARSAL_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_REHEARSAL_VERIFIER_SHA256" =~ ^[0-9a-f]{64}$ ]]
            rehearsal_args="--rehearsal-migration-tag $REHEARSAL_MIGRATION_TAG --expected-rehearsal-manifest-sha256 $EXPECTED_REHEARSAL_MANIFEST_SHA256 --expected-rehearsal-verifier-sha256 $EXPECTED_REHEARSAL_VERIFIER_SHA256"
          fi
          ssh_root="$(mktemp -d "$RUNNER_TEMP/jobseek-web-backup-ssh.XXXXXX")"
          cleanup() {
            rm -rf -- "$ssh_root"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_root/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_root/known_hosts"
          chmod 0600 "$ssh_root/id" "$ssh_root/known_hosts"
          ssh-keygen -y -f "$ssh_root/id" >/dev/null
          ssh-keygen -F "$TARGET_HOST" -f "$ssh_root/known_hosts" >/dev/null
          ssh_options=(
            -F /dev/null
            -i "$ssh_root/id"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_root/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )
          # All interpolated remote arguments are allowlisted or regex-validated above.
          # shellcheck disable=SC2029
          timeout --foreground --signal=TERM --kill-after=30s 165m \
            ssh "${ssh_options[@]}" "root@$TARGET_HOST" \
            "set -eu; \
              umask 077; \
              test ! -L /run/jobseek-backup-deployment.lock; \
              exec 8>/run/jobseek-backup-deployment.lock; \
              chown root:root /run/jobseek-backup-deployment.lock; \
              chmod 0600 /run/jobseek-backup-deployment.lock; \
              test \"\$(stat -c '%U:%G:%a' /run/jobseek-backup-deployment.lock)\" = root:root:600; \
              flock -w 60 8; \
              test ! -L /usr/local/sbin/jobseek-web-postgresql-operations; \
              test -f /usr/local/sbin/jobseek-web-postgresql-operations; \
              test \"\$(stat -c '%U:%G:%a' /usr/local/sbin/jobseek-web-postgresql-operations)\" = root:root:755; \
              operations_hash=\$(sha256sum /usr/local/sbin/jobseek-web-postgresql-operations); \
              test \"\${operations_hash%% *}\" = '$EXPECTED_OPERATIONS_SHA256'; \
              export JOBSEEK_BACKUP_DEPLOYMENT_LOCK_FD=8; \
              exec /usr/local/sbin/jobseek-web-postgresql-operations '$OPERATION_MODE' \
              --expected-deploy-sha '$EXPECTED_DEPLOY_SHA' \
              --expected-data-backup-sha256 '$EXPECTED_DATA_BACKUP_SHA256' \
              --expected-image-protector-sha256 '$EXPECTED_IMAGE_PROTECTOR_SHA256' \
              --expected-operations-sha256 '$EXPECTED_OPERATIONS_SHA256' \
              --expected-retirement-migration-sha256 '$EXPECTED_RETIREMENT_MIGRATION_SHA256' \
              --expected-restore-drill-sha256 '$EXPECTED_RESTORE_DRILL_SHA256' \
              --expected-service-sha256 '$EXPECTED_SERVICE_SHA256' \
              --expected-timer-sha256 '$EXPECTED_TIMER_SHA256' $rehearsal_args" | tee "$RUNNER_TEMP/company-reference-operation.txt"
          if [[ "$OPERATION_MODE" == rehearse ]]; then
            test "$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq .object.sha)" = "$EXPECTED_DEPLOY_SHA"
            mkdir -p "$RUNNER_TEMP/company-reference-evidence"
            python3 - <<'PYPROOF'
          import json, os
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'company-reference-operation.txt').read_text().splitlines()
          matches=[line.removeprefix('Company reference rehearsal evidence: ') for line in lines if line.startswith('Company reference rehearsal evidence: ')]
          if len(matches)!=1: raise SystemExit('Protected rehearsal evidence missing')
          proof=json.loads(matches[0])
          if proof['outcome']!='passed' or proof['sourceRevision']!=os.environ['EXPECTED_DEPLOY_SHA'] or proof['manifestSha256']!=os.environ['EXPECTED_REHEARSAL_MANIFEST_SHA256'] or proof['target']['tag']!=os.environ['REHEARSAL_MIGRATION_TAG']: raise SystemExit('Protected rehearsal identity differs')
          proof.update(runId=os.environ['GITHUB_RUN_ID'],runAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']),cleanup='passed',packetVersion=3)
          Path(os.environ['RUNNER_TEMP'],'company-reference-evidence','proof.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          PYPROOF
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'rehearse'
        with:
          name: company-reference-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/company-reference-evidence/proof.json
          if-no-files-found: error
          retention-days: 7
