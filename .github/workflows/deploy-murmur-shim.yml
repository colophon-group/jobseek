# Deploy jobseek-murmur-shim to the Hetzner crawler box.
#
# Source spec: issue #2776 (H4). Mirrors the murmur repo's
# `.github/workflows/deploy.yml` shape, with build + deploy unified
# (jobseek's CI doesn't gate this deploy via workflow_run because the
# image is built here in-line).
#
# Trigger model:
#   - `push` to `murmur-demo` touching the shim source, the crawler
#     compose (where the murmur-shim service is declared by H3), or
#     this workflow file. The path filter prevents accidental redeploys
#     when unrelated files change.
#   - `workflow_dispatch`: manual trigger so the operator can force a
#     redeploy without a code commit (e.g. after rotating MURMUR_TOKEN).
#
# Concurrency: `deploy-murmur-shim` with `cancel-in-progress: false` —
# never kill an in-flight deploy mid-restart.
#
# Secrets resolve from the `production` environment on the deploy job.
# Required: HETZNER_HOST, HETZNER_SSH_KEY, HETZNER_GH_TOKEN
# (pull-only `read:packages` for the host), MURMUR_TOKEN, LOCAL_DATABASE_URL.
# Build and compatibility-tag promotion use the job-scoped GITHUB_TOKEN.
#
# Lessons baked in (from the murmur deploy this session):
#   1. `docker/login-action@v3` is broken with classic PATs against GHCR
#      (auth probe fails with `denied: denied`). Use a direct
#      `docker login` via stdin instead.
#   2. The PAT login username must be the PAT owner (`viktor-shcherb`),
#      NOT `github.repository_owner` — the package lives under
#      colophon-group but auth presents user identity.
#   3. `appleboy/scp-action`'s `strip_components` drops files that have
#      fewer leading components than the strip count. Single-file SCP
#      from `apps/crawler/docker-compose.yml` with `strip_components: 2`
#      is safe (file has exactly 2 leading components -> lands as
#      `/home/deploy/docker-compose.yml`). If we ever bundle the
#      shim sources too, split per-depth into separate SCP steps.
#   4. The runner's GITHUB_TOKEN has job-scoped `packages: write`; the
#      host receives only its pull credential.
#   5. SHA-pin every action — no @v3 floating tags.
#
# Action SHA pins (mirror apps/crawler/.github/workflows/deploy-crawler-browser.yml
# so all jobseek deploys pin to the same versions):
#   actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1            # v7.0.1
#   docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
#   docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a    # v7.3.0
#   appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345         # v1.0.0
#   appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2         # v1
#   actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a     # v7.0.1

name: Deploy murmur-shim

on:
  push:
    # `murmur-demo` was the long-lived integration branch during H1–H3
    # and was squash-merged into `main` in #2793; subsequent work flows
    # through main like the rest of jobseek. Both branches stay in the
    # trigger list — main is the load-bearing one, `murmur-demo` is
    # kept for the unlikely case anyone still pushes there.
    branches: [main, murmur-demo]
    paths:
      - apps/murmur-shim/**
      - apps/crawler/docker-compose.yml
      - apps/crawler/deploy.sh
      - .github/workflows/deploy-murmur-shim.yml
  workflow_dispatch:

concurrency:
  group: deploy-murmur-shim
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-shim.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR (job token, stdin)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push jobseek-murmur-shim
        id: build-shim
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build context is the monorepo root because the Dockerfile COPYs
          # apps/web/src/db/schema.ts (wildcard re-export) plus pnpm-lock.yaml
          # and pnpm-workspace.yaml from the workspace root. Dockerfile path
          # is therefore relative to root, not to apps/murmur-shim.
          context: .
          file: ./apps/murmur-shim/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/colophon-group/jobseek-murmur-shim:${{ github.sha }}
          cache-from: type=gha,scope=murmur-shim
          cache-to: type=gha,mode=max,scope=murmur-shim,ignore-error=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The host mutation lock may be held by a bounded crawler maintenance job
    # for up to two hours. Never bypass that lock to rewrite shared deploy state.
    timeout-minutes: 135
    # `environment: production` is what makes the production-env secrets
    # available to this job. Required reviewers / wait-timer can be
    # added later via repo settings without changing this file.
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Single SCP, single file. `strip_components: 2` strips
      # `apps/crawler/`, landing the file at
      # `/home/deploy/incoming-shim/docker-compose.yml`, where the locked
      # host script can validate and activate it transactionally. Do NOT mix
      # multi-depth sources here
      # (see lesson #3); add a second SCP step instead.
      - name: Copy docker-compose.yml to box
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: apps/crawler/docker-compose.yml
          target: /home/deploy/incoming-shim/
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 130m
          # `envs:` whitelist — only these names are forwarded into the
          # remote shell. Names only; values come from the matching
          # `env:` block below. Never put a secret name into `script:`.
          envs: GHCR_PULL_TOKEN,MURMUR_TOKEN,LOCAL_DATABASE_URL,OWNER,SHIM_IMAGE_REF
          # Inline script (no /home/deploy/deploy.sh dependency — this
          # workflow only touches the murmur-shim service). The crawler's
          # deploy.sh is left alone; full-stack redeploys still go via
          # deploy-crawler-browser.yml.
          script: |
            set -euo pipefail
            # `appleboy/ssh-action`'s `envs:` injects the listed names as
            # plain shell variables (assignment only, no `export`). Child
            # processes — including `docker compose` — therefore do NOT
            # inherit them, and compose's `${MURMUR_TOKEN}` /
            # `${LOCAL_DATABASE_URL}` substitutions resolve to empty.
            # Live evidence: deploy run 25137948546 logged
            # `WARN[0000] The "MURMUR_TOKEN" variable is not set.
            # Defaulting to a blank string.` despite the secret being
            # forwarded correctly through `envs:`. Re-export here so
            # docker compose (a child process) sees the values.
            #
            # The session exports the new immutable image reference for
            # Compose. Only after health passes does this workflow replace
            # that one line in the crawler-owned .env; all secret and
            # unrelated settings remain byte-for-byte intact.
            export MURMUR_TOKEN OWNER LOCAL_DATABASE_URL SHIM_IMAGE_REF
            cd /home/deploy
            exec 9>/run/lock/jobseek-crawler-mutation.lock
            flock -w 7200 9 || {
              echo "Timed out waiting for the crawler mutation lock" >&2
              exit 1
            }
            [[ "$SHIM_IMAGE_REF" =~ ^ghcr\.io/colophon-group/jobseek-murmur-shim@sha256:[0-9a-f]{64}$ ]]
            live_compose=/home/deploy/docker-compose.yml
            live_env=/home/deploy/.env
            staged_compose=/home/deploy/incoming-shim/docker-compose.yml
            legacy_active_compose=/home/deploy/.crawler-active-docker-compose.yml
            legacy_active_compose_sha256=/home/deploy/.crawler-active-docker-compose.sha256
            release_root=/home/deploy/.crawler-release-generations
            active_release=/home/deploy/.crawler-active-release
            test -f "$live_compose"
            test ! -L "$live_compose"
            test -f "$staged_compose"
            test ! -L "$staged_compose"
            test -f "$live_env"
            test ! -L "$live_env"

            verify_snapshot() {
              snapshot="$1"
              digest_file="$2"
              label="$3"
              test -f "$snapshot"
              test ! -L "$snapshot"
              test -f "$digest_file"
              test ! -L "$digest_file"
              expected="$(tr -d '[:space:]' <"$digest_file")"
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              actual="$(sha256sum "$snapshot" | awk '{print $1}')"
              if [[ "$actual" != "$expected" ]]; then
                echo "Crawler-confirmed ${label} snapshot failed verification" >&2
                return 1
              fi
            }

            verify_release_generation() {
              generation="$1"
              test -d "$generation"
              test ! -L "$generation"
              verify_snapshot \
                "$generation/docker-compose.yml" "$generation/docker-compose.sha256" Compose
              verify_snapshot \
                "$generation/environment.env" "$generation/environment.sha256" environment
              test "$(stat -c '%a' "$generation/environment.env")" = 600
              test -f "$generation/success.env"
              test ! -L "$generation/success.env"
              test -f "$generation/release.manifest"
              test ! -L "$generation/release.manifest"
              format_version="$(sed -n 's/^RELEASE_FORMAT_VERSION=//p' "$generation/release.manifest")"
              compose_digest="$(sed -n 's/^COMPOSE_SHA256=//p' "$generation/release.manifest")"
              env_digest="$(sed -n 's/^ENVIRONMENT_SHA256=//p' "$generation/release.manifest")"
              success_digest="$(sed -n 's/^SUCCESS_SHA256=//p' "$generation/release.manifest")"
              [[ "$format_version" == 0 || "$format_version" == 1 ]]
              [[ "$compose_digest" =~ ^[0-9a-f]{64}$ ]]
              [[ "$env_digest" =~ ^[0-9a-f]{64}$ ]]
              [[ "$success_digest" =~ ^[0-9a-f]{64}$ ]]
              test "$compose_digest" = "$(tr -d '[:space:]' <"$generation/docker-compose.sha256")"
              test "$env_digest" = "$(tr -d '[:space:]' <"$generation/environment.sha256")"
              test "$success_digest" = "$(sha256sum "$generation/success.env" | awk '{print $1}')"
            }

            if [[ ! -e "$active_release" ]]; then
              # First rollout: bundle the last crawler-confirmed Compose file,
              # current credential environment, and committed marker, then
              # atomically select the complete legacy generation before the
              # shim workflow changes either live file.
              verify_snapshot \
                "$legacy_active_compose" "$legacy_active_compose_sha256" Compose
              test -f /home/deploy/.crawler-deploy-success.env
              test ! -L /home/deploy/.crawler-deploy-success.env
              test ! -e "$release_root" || {
                test -d "$release_root"
                test ! -L "$release_root"
              }
              install -d -m 0700 "$release_root"
              legacy_generation="$(mktemp -d "$release_root/legacy.XXXXXX")"
              install -m 0644 "$legacy_active_compose" "$legacy_generation/docker-compose.yml"
              install -m 0600 "$live_env" "$legacy_generation/environment.env"
              install -m 0644 /home/deploy/.crawler-deploy-success.env \
                "$legacy_generation/success.env"
              compose_digest="$(sha256sum "$legacy_generation/docker-compose.yml" | awk '{print $1}')"
              env_digest="$(sha256sum "$legacy_generation/environment.env" | awk '{print $1}')"
              success_digest="$(sha256sum "$legacy_generation/success.env" | awk '{print $1}')"
              printf '%s\n' "$compose_digest" >"$legacy_generation/docker-compose.sha256"
              printf '%s\n' "$env_digest" >"$legacy_generation/environment.sha256"
              printf '%s\n' \
                'RELEASE_FORMAT_VERSION=0' \
                "COMPOSE_SHA256=$compose_digest" \
                "ENVIRONMENT_SHA256=$env_digest" \
                "SUCCESS_SHA256=$success_digest" \
                >"$legacy_generation/release.manifest"
              chmod 0644 "$legacy_generation"/*.sha256 "$legacy_generation/release.manifest"
              python3 - "$legacy_generation" "$active_release" <<'PY'
            import os
            import secrets
            import sys

            generation, active = sys.argv[1:]
            for name in os.listdir(generation):
                path = os.path.join(generation, name)
                if os.path.isfile(path) and not os.path.islink(path):
                    fd = os.open(path, os.O_RDONLY)
                    try:
                        os.fsync(fd)
                    finally:
                        os.close(fd)
            generation_fd = os.open(generation, os.O_RDONLY | os.O_DIRECTORY)
            try:
                os.fsync(generation_fd)
            finally:
                os.close(generation_fd)
            candidate = f"{active}.{secrets.token_hex(16)}"
            os.symlink(generation, candidate)
            os.replace(candidate, active)
            directory_fd = os.open("/home/deploy", os.O_RDONLY | os.O_DIRECTORY)
            try:
                os.fsync(directory_fd)
            finally:
                os.close(directory_fd)
            PY
            fi
            test -d "$release_root"
            test ! -L "$release_root"
            test -L "$active_release"
            active_generation="$(readlink "$active_release")"
            [[ "$active_generation" == "$release_root/"* ]]
            [[ "${active_generation#"$release_root/"}" != */* ]]
            verify_release_generation "$active_generation"

            resolve_running_digest() {
              container="$1"
              repository="$2"
              configured_ref="$(docker inspect "$container" --format '{{.Config.Image}}')"
              if [[ "$configured_ref" =~ ^${repository}@sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$configured_ref"
                return 0
              fi
              image_id="$(docker inspect "$container" --format '{{.Image}}')"
              [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
              mapfile -t digest_refs < <(
                docker image inspect "$image_id" \
                  --format '{{range .RepoDigests}}{{println .}}{{end}}' |
                  grep -E "^${repository}@sha256:[0-9a-f]{64}$"
              )
              test "${#digest_refs[@]}" -eq 1
              printf '%s\n' "${digest_refs[0]}"
            }

            CRAWLER_IMAGE_REF="$(
              resolve_running_digest deploy-worker-1-1 \
                ghcr.io/colophon-group/jobseek-crawler
            )"
            BROWSER_IMAGE_REF="$(
              resolve_running_digest deploy-browser-1-1 \
                ghcr.io/colophon-group/jobseek-crawler-browser
            )"
            previous_shim_ref="$(
              resolve_running_digest deploy-murmur-shim-1 \
                ghcr.io/colophon-group/jobseek-murmur-shim
            )"
            export CRAWLER_IMAGE_REF BROWSER_IMAGE_REF

            previous_compose="$(mktemp /home/deploy/.docker-compose.shim.rollback.XXXXXX)"
            previous_env="$(mktemp /home/deploy/.env.shim.rollback.XXXXXX)"
            cp --preserve=mode,ownership "$live_compose" "$previous_compose"
            cp --preserve=mode,ownership "$live_env" "$previous_env"
            chmod 0600 "$previous_env"
            previous_compose_sha256="$(sha256sum "$previous_compose" | awk '{print $1}')"
            previous_env_sha256="$(sha256sum "$previous_env" | awk '{print $1}')"
            rollback_armed=0
            compose_activated=0
            env_activated=0
            env_candidate=""
            rollback_shim() {
              status=$?
              trap - EXIT
              set +e
              if [[ -n "$env_candidate" && -f "$env_candidate" && ! -L "$env_candidate" ]]; then
                rm -f -- "$env_candidate"
              fi
              if [[ "$status" -ne 0 && "$rollback_armed" -eq 1 ]]; then
                echo "Murmur shim deploy failed; restoring the prior immutable image" >&2
                rollback_restore_failed=0
                if [[ "$compose_activated" -eq 1 ]]; then
                  if mv -f "$previous_compose" "$live_compose"; then
                    compose_activated=0
                  else
                    rollback_restore_failed=1
                  fi
                fi
                if [[ "$env_activated" -eq 1 ]]; then
                  if mv -f "$previous_env" "$live_env"; then
                    env_activated=0
                  else
                    rollback_restore_failed=1
                  fi
                fi
                [[ "$(sha256sum "$live_compose" | awk '{print $1}')" == \
                  "$previous_compose_sha256" ]] || rollback_restore_failed=1
                [[ "$(sha256sum "$live_env" | awk '{print $1}')" == \
                  "$previous_env_sha256" ]] || rollback_restore_failed=1
                rollback_override="$(mktemp "${live_compose}.murmur-rollback-override.XXXXXX")"
                printf 'services:\n  murmur-shim:\n    image: %s\n' \
                  "$previous_shim_ref" >"$rollback_override"
                chmod 0600 "$rollback_override"
                if [[ "$rollback_restore_failed" -ne 0 ]] ||
                  ! env -i \
                    "PATH=${PATH:-/usr/local/bin:/usr/bin:/bin}" \
                    "HOME=${HOME:-/home/deploy}" \
                    COMPOSE_PROJECT_NAME=deploy \
                    docker compose --env-file "$live_env" \
                      -f "$live_compose" -f "$rollback_override" \
                      up -d murmur-shim ||
                  ! sleep 5 ||
                  ! env -i "PATH=${PATH:-/usr/local/bin:/usr/bin:/bin}" \
                    curl -sf http://localhost:8080/health >/dev/null ||
                  [[ "$(env -i "PATH=${PATH:-/usr/local/bin:/usr/bin:/bin}" \
                    docker inspect deploy-murmur-shim-1 --format '{{.Config.Image}}')" \
                    != "$previous_shim_ref" ]]
                then
                  echo "Murmur shim rollback did not converge" >&2
                  status=1
                fi
                rm -f -- "$rollback_override"
              fi
              if [[ "$compose_activated" -eq 0 ]]; then
                rm -f -- "$previous_compose"
              fi
              if [[ "$env_activated" -eq 0 ]]; then
                rm -f -- "$previous_env"
              fi
              rm -f -- "$staged_compose"
              exit "$status"
            }
            trap rollback_shim EXIT
            env_candidate="$(mktemp /home/deploy/.env.shim.XXXXXX)"
            awk '!/^(CRAWLER_IMAGE_REF|BROWSER_IMAGE_REF|SHIM_IMAGE_REF)=/' \
              "$previous_env" >"$env_candidate"
            printf 'CRAWLER_IMAGE_REF=%s\n' "$CRAWLER_IMAGE_REF" >>"$env_candidate"
            printf 'BROWSER_IMAGE_REF=%s\n' "$BROWSER_IMAGE_REF" >>"$env_candidate"
            printf 'SHIM_IMAGE_REF=%s\n' "$SHIM_IMAGE_REF" >>"$env_candidate"
            chmod 0600 "$env_candidate"
            mv "$env_candidate" "$live_env"
            env_candidate=""
            env_activated=1
            install -m 0644 "$staged_compose" "$live_compose"
            compose_activated=1

            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u viktor-shcherb --password-stdin
            # Pull both the shim image AND the runtime-init image. The
            # init service `pull_policy: always` would handle this on
            # `up`, but pulling explicitly here surfaces auth/network
            # errors before we touch the running shim. Without this,
            # only `murmur-shim` was pulled and an upgraded init image
            # would only land on the next compose-triggered pull.
            docker compose pull murmur-shim murmur-shim-runtime-init
            rollback_armed=1
            docker compose up -d murmur-shim
            docker compose ps murmur-shim
            # Brief settle, then probe the shim's health endpoint via
            # the host network. The shim listens on :8080 by H2's
            # contract; if H5's tunnel is also up, the public probe
            # is `https://jobseek-murmur.colophon-group.org/health`.
            sleep 5
            curl -sf http://localhost:8080/health
            test "$(docker inspect deploy-murmur-shim-1 --format '{{.Config.Image}}')" = "$SHIM_IMAGE_REF"
            rollback_armed=0
            compose_activated=0
            env_activated=0
            rm -f -- "$previous_compose" "$previous_env" "$staged_compose"
        env:
          OWNER: ${{ github.repository_owner }}
          SHIM_IMAGE_REF: ghcr.io/colophon-group/jobseek-murmur-shim@${{ needs.build.outputs.image_digest }}
          GHCR_PULL_TOKEN: ${{ secrets.HETZNER_GH_TOKEN }}
          MURMUR_TOKEN: ${{ secrets.MURMUR_TOKEN }}
          # Forwarded so the compose `MURMUR_DB_DSN: ${LOCAL_DATABASE_URL}`
          # substitution resolves on this single-service redeploy. The
          # crawler's full-stack deploy already pins the same secret in
          # /home/deploy/.env, but this workflow runs without invoking
          # deploy.sh, so the inline export above is the only path.
          LOCAL_DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}

  promote:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR (job token, stdin)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote deployed shim to compatibility tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ghcr.io/colophon-group/jobseek-murmur-shim:latest \
            "ghcr.io/colophon-group/jobseek-murmur-shim@${{ needs.build.outputs.image_digest }}"

      - name: Write exact deployed-release record
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{
              run_id: $run_id,
              run_attempt: $run_attempt,
              head_sha: $head_sha,
              event: $event,
              image_digest: $image_digest
            }' >murmur-release.json

      # A run-attempt-scoped immutable artifact remains stable if an operator
      # reruns this workflow later. It is written only after host deploy and
      # compatibility promotion both succeeded with the recorded digest.
      - name: Upload exact deployed-release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: murmur-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: murmur-release.json
          if-no-files-found: error
          retention-days: 7
