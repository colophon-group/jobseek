name: Go ordinary queue contracts

on:
  pull_request:
    paths:
      - "apps/crawler/go/ordinary-queue/**"
      - "apps/crawler/go/ordinary-worker/**"
      - "apps/crawler/go/greenhouse-monitor/**"
      - "apps/crawler/go/lightpanda-b0-executor/**"
      - "apps/crawler/go/lightpanda-b0-supervisor/**"
      - "apps/crawler/go/job-enrichment/**"
      - "apps/crawler/go/dom-detail/**"
      - "apps/crawler/go/jsonld-detail/**"
      - "apps/crawler/go/publisher-policy/**"
      - "apps/crawler/contracts/**"
      - "apps/crawler/data/**"
      - "apps/crawler/src/queries/monitor.py"
      - "apps/crawler/src/processing/board.py"
      - "apps/crawler/src/processing/gone_policy.py"
      - "apps/crawler/src/processing/tdm.py"
      - "apps/crawler/src/shared/tdm.py"
      - "apps/crawler/src/processing/cpu.py"
      - "apps/crawler/src/processing/scrape.py"
      - "apps/crawler/src/core/job_content.py"
      - "apps/crawler/src/core/monitor.py"
      - "apps/crawler/src/core/monitors/greenhouse.py"
      - "apps/crawler/src/shared/truncation.py"
      - "apps/crawler/src/shared/http.py"
      - "apps/crawler/src/shared/ssrf.py"
      - "apps/crawler/src/lua/claim_work.lua"
      - "apps/crawler/src/lua/heartbeat_task.lua"
      - "apps/crawler/src/lua/complete_task.lua"
      - "apps/crawler/src/lua/reschedule_task.lua"
      - "apps/crawler/src/lua/reap_expired.lua"
      - "apps/crawler/go/typesense-exporter/**"
      - "apps/crawler/src/migrations/**"
      - "apps/crawler/src/ordinary_ownership.py"
      - "apps/crawler/src/lightpanda/activation.py"
      - "apps/crawler/src/lightpanda/producer_client.py"
      - "apps/crawler/src/redis_queue.py"
      - "apps/crawler/src/config.py"
      - "apps/crawler/src/workers/pipeline.py"
      - "apps/crawler/tests/test_ordinary_ownership.py"
      - "apps/crawler/tests/test_lightpanda_activation.py"
      - "apps/crawler/tests/test_redis_queue.py"
      - "apps/crawler/tests/test_pipeline.py"
      - "apps/crawler/tests/test_rich_monitor_contract.py"
      - "apps/crawler/Dockerfile"
      - "apps/crawler/uv.lock"
      - ".github/workflows/go-ordinary-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ordinary-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ordinary queue private PostgreSQL/Redis (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: jobseek_ordinary_worker_test
        options: >-
          --health-cmd "pg_isready -U crawler -d jobseek_ordinary_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/crawler/go/ordinary-queue
    env:
      JOBSEEK_ORDINARY_QUEUE_REQUIRE_REDIS: "1"
      JOBSEEK_ORDINARY_QUEUE_REQUIRE_POSTGRES: "1"
      LOCAL_DATABASE_URL: postgresql://crawler:crawler@127.0.0.1:5432/jobseek_ordinary_worker_test
      JOBSEEK_ORDINARY_QUEUE_TEST_DATABASE_URL: postgresql://crawler:crawler@127.0.0.1:5432/jobseek_ordinary_worker_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/crawler/go/ordinary-queue/go.mod
          cache-dependency-path: apps/crawler/go/ordinary-queue/go.sum

      - name: Install fixture Redis on the disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version

      - name: Apply and reverse the actual isolated database migration
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          uv run --frozen alembic -c src/migrations/alembic.ini upgrade head
          uv run --frozen alembic -c src/migrations/alembic.ini downgrade 0034
          uv run --frozen alembic -c src/migrations/alembic.ini upgrade head

      - name: Verify real database authority and private queue transitions
        run: |
          set -euo pipefail
          # The preceding suite takes 104–110s on Linux before executable
          # finalizer coverage. Preserve bounded individual operations and emit
          # per-test timings within a three-minute aggregate race-test budget.
          go test -race -count=1 -timeout=180s -v ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

      - name: Verify independently pinned prior executable at restored R
        run: |
          set -euo pipefail
          prior_source="3cccd9fc33e8251ee8b043d8c6e91a3806c7f5b4"
          prior_checkout="${RUNNER_TEMP}/ordinary-prior-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prior_binary="${RUNNER_TEMP}/ordinary-prior-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"
          git fetch --no-tags origin "$prior_source"
          git worktree add --detach "$prior_checkout" "$prior_source"
          trap 'rm -f "$prior_binary"; git worktree remove "$prior_checkout"' EXIT
          test "$(git -C "$prior_checkout" rev-parse HEAD)" = "$prior_source"
          test -z "$(git -C "$prior_checkout" status --porcelain)"
          (cd "$prior_checkout/apps/crawler/go/ordinary-worker" && go build -trimpath -ldflags="-X main.sourceRevision=${prior_source}" -o "$prior_binary" ./cmd/live)
          test -z "$(git -C "$prior_checkout" status --porcelain)"
          prior_hash="$(sha256sum "$prior_binary" | cut -d ' ' -f1)"
          JOBSEEK_ORDINARY_PRIOR_REQUIRE=1 \
          JOBSEEK_ORDINARY_PRIOR_BINARY="$prior_binary" \
          JOBSEEK_ORDINARY_PRIOR_BINARY_SHA256="$prior_hash" \
          JOBSEEK_ORDINARY_PRIOR_DATA_DIRECTORY="$prior_checkout/apps/crawler/data" \
            go test -race -tags=integration -count=1 -timeout=60s -v \
            -run '^TestPriorNativeExecutableConsumesRestoredV1AuthorityAtR$' ./...
          printf 'prior_source=%s\nprior_binary_sha256=%s\n' "$prior_source" "$prior_hash"

      - name: Verify native forward planning with the installed UID 10001 producer
        run: |
          set -euo pipefail
          fixture_prefix="/tmp/jobseek-b0-forward-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          producer_binary="${fixture_prefix}-producer"
          worker_binary="${fixture_prefix}-worker"
          integration_binary="${fixture_prefix}.test"
          lua_fixture="${fixture_prefix}.lua"
          (cd ../lightpanda-b0-supervisor && go build -buildvcs=false -ldflags="-X main.sourceRevision=${GITHUB_SHA}" -o "$producer_binary" .)
          (cd ../ordinary-worker && go build -buildvcs=false -ldflags="-X main.sourceRevision=${GITHUB_SHA}" -o "$worker_binary" ./cmd/live)
          go test -race -c -tags=integration -o "$integration_binary" .
          chmod 0755 "$producer_binary" "$worker_binary" "$integration_binary"
          install -m 0644 ../../src/lua/lightpanda_b0_queue.lua "$lua_fixture"
          sudo install -d -m 0700 -o 10001 -g 10001 /run/jobseek-lightpanda-producer
          trap 'sudo rmdir /run/jobseek-lightpanda-producer; rm -f "$producer_binary" "$worker_binary" "$integration_binary" "$lua_fixture"' EXIT
          sudo env \
            JOBSEEK_ORDINARY_QUEUE_REQUIRE_REDIS=1 \
            JOBSEEK_ORDINARY_QUEUE_REQUIRE_POSTGRES=1 \
            JOBSEEK_ORDINARY_QUEUE_TEST_DATABASE_URL="$JOBSEEK_ORDINARY_QUEUE_TEST_DATABASE_URL" \
            JOBSEEK_B0_FORWARD_PRODUCER_BINARY="$producer_binary" \
            JOBSEEK_B0_FORWARD_WORKER_BINARY="$worker_binary" \
            JOBSEEK_B0_FORWARD_SOURCE_REVISION="$GITHUB_SHA" \
            JOBSEEK_B0_FORWARD_LUA_FILE="$lua_fixture" \
            "$integration_binary" \
            -test.run '^TestInstalledNativeColdB0(ForwardPreparesAndRetainsExactManifest|ReactivationUsesRetainedRollbackAtR)$' \
            -test.count=1 -test.timeout=90s -test.v

      - name: Verify the production Go reaper participates in database retirement
        working-directory: apps/crawler/go/typesense-exporter
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=90s -run '^TestLeaseReaper' ./...
          go vet ./...
          go mod tidy -diff

      - name: Regenerate ordinary inventory, URL and HTTP captures from Python
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run --frozen python go/ordinary-worker/testdata/collect_inventory.py
          git diff --exit-code -- go/ordinary-worker/testdata/python_inventory.json go/ordinary-worker/testdata/python_urls.json
          uv run --frozen python go/ordinary-worker/testdata/collect_discovery.py
          git diff --exit-code -- go/ordinary-worker/testdata/python_discovery.json
          uv run --frozen python go/ordinary-worker/testdata/collect_ssrf.py
          uv run --frozen python go/ordinary-worker/testdata/collect_http_transport.py
          git diff --exit-code -- go/ordinary-worker/ssrf_networks.json go/ordinary-worker/testdata/python_ssrf.json go/ordinary-worker/testdata/python_http_decoding.json

      - name: Verify native producer socket and actual Python wire compatibility
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run --frozen python contracts/v1/b0producer/testdata/collect.py
          git diff --exit-code -- contracts/v1/b0producer/testdata/python_protocol.json
          cd contracts
          go test -race -count=1 -timeout=30s ./v1/b0producer
          go vet ./v1/b0producer

      - name: Verify assembled native inventory and owned processing pipeline
        working-directory: apps/crawler/go/ordinary-worker
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=90s ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

      - name: Verify the rich oracle still matches the actual Python writer
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run --frozen python go/lightpanda-b0-executor/testdata/collect_rich_monitor.py
          git diff --exit-code -- go/lightpanda-b0-executor/testdata/python_rich_monitor.json

      - name: Verify disappearance and provider-gone oracles against Python
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run --frozen python go/ordinary-queue/testdata/collect_lifecycle.py
          git diff --exit-code -- go/ordinary-queue/testdata/python_lifecycle.json go/ordinary-queue/testdata/python_gone.json

      - name: Verify native rich preparation against captured Python output
        working-directory: apps/crawler/go/lightpanda-b0-executor
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=90s -run '^Test(RichMonitorPreparation|PreparedContent|OrdinaryLookupStore)' ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

      - name: Verify legacy ownership attestation and private queue exclusion
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_ordinary_ownership.py tests/test_lightpanda_activation.py tests/test_redis_queue.py tests/test_pipeline.py tests/test_rich_monitor_contract.py -q
