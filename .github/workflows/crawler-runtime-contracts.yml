name: Crawler runtime contracts

on:
  pull_request:
    paths:
      - "apps/crawler/contracts/**"
      - "apps/crawler/pyproject.toml"
      - "apps/crawler/uv.lock"
      - ".github/workflows/crawler-runtime-contracts.yml"
  push:
    branches: [main]
    paths:
      - "apps/crawler/contracts/**"
      - "apps/crawler/pyproject.toml"
      - "apps/crawler/uv.lock"
      - ".github/workflows/crawler-runtime-contracts.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crawler/contracts/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.17"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: apps/crawler/contracts/v1/go.sum
      - name: Install pinned generators
        run: |
          uv sync --project ../..
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Verify generated bindings and fixtures
        env:
          BASELINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PYTHONPATH=. uv run --project ../.. python tools/check_baseline_immutable.py
          ./generate.sh --check
          PYTHONPATH=. uv run --project ../.. python tools/build_fixtures.py
          git diff --exit-code -- gen fixtures
      - name: Python conformance
        run: |
          PYTHONPATH=. uv run --project ../.. pytest -q conformance/python/test_contract.py
          PYTHONPATH=. uv run --project ../.. python tools/check_contract.py
          uv run --project ../.. ruff check conformance/python tools
          uv run --project ../.. ruff format --check conformance/python tools
          PYTHONPATH=. uv run --project ../.. python tools/wheel_smoke.py
      - name: Go conformance
        run: |
          go test -race ./...
          go vet ./...
