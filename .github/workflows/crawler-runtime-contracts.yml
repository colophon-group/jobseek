name: Crawler Runtime v1 Contracts

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/v1/**'
      - 'apps/crawler/pyproject.toml'
      - 'apps/crawler/uv.lock'
      - 'apps/crawler/Dockerfile'
      - 'apps/crawler/VERSION'
      - 'apps/crawler/scripts/verify-build-info-release.py'
      - 'apps/crawler/src/metrics.py'
      - 'apps/crawler/src/shared/constants.py'
      - '.github/workflows/crawler-runtime-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/v1/**'
      - 'apps/crawler/pyproject.toml'
      - 'apps/crawler/uv.lock'
      - 'apps/crawler/Dockerfile'
      - 'apps/crawler/VERSION'
      - 'apps/crawler/scripts/verify-build-info-release.py'
      - 'apps/crawler/src/metrics.py'
      - 'apps/crawler/src/shared/constants.py'
      - '.github/workflows/crawler-runtime-contracts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bindings-and-conformance:
    name: Bindings and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: apps/crawler/contracts/go.sum

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Install pinned generators
        run: |
          set -euo pipefail
          cd apps/crawler
          uv sync --frozen --group dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          printf '#!/usr/bin/env bash\nexec "%s" -m grpc_tools.protoc "$@"\n' \
            "$GITHUB_WORKSPACE/apps/crawler/.venv/bin/python" \
            > "$RUNNER_TEMP/protoc"
          chmod 0755 "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check deterministic generated bindings
        working-directory: apps/crawler
        run: ./contracts/v1/generate.sh --check

      - name: Check frozen protocol and shared corpora
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run python contracts/v1/tools/check_protocol.py
          uv run python contracts/v1/tools/check_compatibility.py \
            --protoc "$RUNNER_TEMP/protoc"
          uv run python contracts/v1/tools/generate_privacy.py --check
          uv run python contracts/v1/tools/check_semantics.py --check
          uv run pytest -q \
            contracts/v1/conformance/python \
            tests/test_runtime_contracts.py

      - name: Test Go bindings and conformance
        working-directory: apps/crawler/contracts
        run: |
          set -euo pipefail
          go test -race ./v1/...
          go vet ./v1/...

      - name: Test generated Go package from an external consumer
        env:
          CONTRACT_MODULE: github.com/colophon-group/jobseek/apps/crawler/contracts
        run: |
          set -euo pipefail
          consumer="$(mktemp -d "$RUNNER_TEMP/runtime-v1-go-consumer.XXXXXX")"
          cd "$consumer"
          go mod init example.com/runtime-v1-consumer
          go mod edit "-require=${CONTRACT_MODULE}@v0.0.0"
          go mod edit "-replace=${CONTRACT_MODULE}=${GITHUB_WORKSPACE}/apps/crawler/contracts"
          cat > runtime_test.go <<'EOF'
          package consumer

          import (
            "testing"

            runtimev1 "github.com/colophon-group/jobseek/apps/crawler/contracts/v1/gen/go"
            "google.golang.org/protobuf/proto"
          )

          func TestGeneratedBinding(t *testing.T) {
            hello := &runtimev1.ClientHello{
              SupportedContractVersions: []string{"crawler.runtime/v1"},
              Implementation: runtimev1.Implementation_IMPLEMENTATION_GO,
            }
            encoded, err := proto.Marshal(hello)
            if err != nil {
              t.Fatal(err)
            }
            restored := new(runtimev1.ClientHello)
            if err := proto.Unmarshal(encoded, restored); err != nil {
              t.Fatal(err)
            }
            if !proto.Equal(hello, restored) {
              t.Fatal("generated binding changed the message")
            }
          }
          EOF
          GOWORK=off go mod tidy
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...

      - name: Build and import the isolated crawler wheel
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          wheel_dir="$(mktemp -d "$RUNNER_TEMP/runtime-v1-wheel.XXXXXX")"
          venv_dir="$(mktemp -d "$RUNNER_TEMP/runtime-v1-venv.XXXXXX")"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.13.15 "$venv_dir"
          uv pip install --python "$venv_dir/bin/python" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH='' "$venv_dir/bin/python" -I - <<'PY'
          import importlib.resources
          import json
          import os
          import sysconfig
          from pathlib import Path

          import jobseek_runtime_v1
          from jobseek_runtime_v1 import CONTRACT_VERSION, runtime_pb2
          from jobseek_runtime_v1 import framing

          site_packages = Path(sysconfig.get_paths()["purelib"]).resolve()
          for module in (jobseek_runtime_v1, runtime_pb2, framing):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(site_packages), (origin, site_packages)
              assert not origin.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))

          hello = runtime_pb2.ClientHello(
              supported_contract_versions=[CONTRACT_VERSION],
              implementation=runtime_pb2.IMPLEMENTATION_PYTHON,
          )
          payload = hello.SerializeToString()
          wire = framing.encode_record(payload, 4096)
          assert framing.decode_record(wire, 4096) == payload
          registry = json.loads(
              importlib.resources.files("jobseek_runtime_v1")
              .joinpath("privacy_registry.json")
              .read_text(encoding="utf-8")
          )
          assert registry["format"] == "jobseek.runtime.privacy-registry/v1"
          assert runtime_pb2.DESCRIPTOR.package == "jobseek.crawler.runtime.v1"
          PY
          expected_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/apps/crawler/VERSION")"
          PYTHONPATH='' "$venv_dir/bin/python" -I \
            "$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py" \
            --expected-version "$expected_version" \
            --require-installed

  image-parity:
    name: Installed image parity
    needs: bindings-and-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build slim crawler image
        run: docker build --target slim --build-arg "CRAWLER_SOURCE_REVISION=${GITHUB_SHA}" --tag jobseek-crawler:runtime-v1 apps/crawler

      - name: Import the installed contract surface from the image
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            -I -c 'import importlib.resources, json, pathlib, sysconfig; import jobseek_runtime_v1; from jobseek_runtime_v1 import CONTRACT_VERSION, framing, runtime_pb2; site=pathlib.Path(sysconfig.get_paths()["purelib"]).resolve(); modules=(jobseek_runtime_v1, framing, runtime_pb2); assert all(pathlib.Path(module.__file__).resolve().is_relative_to(site) for module in modules); assert not pathlib.Path("/app/contracts").exists(); hello=runtime_pb2.ClientHello(supported_contract_versions=[CONTRACT_VERSION], implementation=runtime_pb2.IMPLEMENTATION_PYTHON); payload=hello.SerializeToString(); wire=framing.encode_record(payload, 4096); assert framing.decode_record(wire, 4096) == payload; registry=json.loads(importlib.resources.files("jobseek_runtime_v1").joinpath("privacy_registry.json").read_text(encoding="utf-8")); assert registry["format"] == "jobseek.runtime.privacy-registry/v1"; assert runtime_pb2.DESCRIPTOR.package == "jobseek.crawler.runtime.v1"'

      - name: Verify installed native ordinary executable source and mode
        run: |
          set -euo pipefail
          docker run --rm --read-only --entrypoint /usr/local/bin/go-ordinary-worker \
            jobseek-crawler:runtime-v1 --identity \
            | jq -e --arg revision "$GITHUB_SHA" '.source_revision == $revision and .profile == "greenhouse.token-skip/v1" and .profiles == ["greenhouse.token-skip/v1", "ashby.token-skip/v1", "lever.token-skip/v1", "recruitee.api-skip/v1", "pinpoint.slug-skip/v1", "rss.teamtailor-skip/v1", "rss.successfactors-skip/v1", "personio.xml-skip/v1", "workday.cxs-urls/v1", "workday.cxs-detail/v1", "jsonld.direct-detail/v1", "smartrecruiters.api-detail/v1", "workable.api-detail/v1", "smartrecruiters.api-urls/v1", "workable.api-urls/v1", "join.nextdata-urls/v1", "join.nextdata-detail/v1", "sitemap.explicit-urls/v1", "dom.direct-detail/v1", "dom.direct-urls/v1", "dom.rendered-urls/v1", "dom.rendered-detail/v1", "jsonld.rendered-detail/v1", "api_sniffer.http-items/v1", "oracle_hcm.finder-items/v1", "oracle_hcm.api-detail/v1", "embedded.direct-detail/v1", "embedded.rendered-detail/v1", "api_sniffer.http-detail/v1", "icims.listing-urls/v1", "breezy.api-urls/v1", "gem.token-skip/v1", "jazzhr.listing-urls/v1", "gupy.nextdata-urls/v1", "phenom.sitemap-urls/v1", "jobylon.embed-items/v1", "nextdata.embedded-items/v1", "nextdata.embedded-urls/v1", "nextdata.rendered-items/v1", "nextdata.rendered-urls/v1", "beisen.portal-items/v1", "inline.document-items/v1", "personio.xml-items/v1", "rss.teamtailor-items/v1", "rss.successfactors-items/v1", "mokahr.encrypted-items/v1", "almacareer.graphql-items/v1", "eightfold.pcsx-sitemap/v1", "mokahr.encrypted-detail/v1", "eightfold.jsonld-api-detail/v1", "softgarden.inline-urls/v1", "ukg.search-items/v1", "bamboohr.careers-list/v1", "recruiter-co-kr.jobflex/v1", "rss.generic-skip/v1", "rss.generic-items/v1", "comeet.hosted-items/v1", "comeet.api-items/v1", "jobvite.listing-urls/v1", "adp.search-items/v1", "cornerstone.search-items/v1", "paylocity.embedded-items/v1", "adp.public-detail/v1", "paylocity.html-detail/v1", "paycom.preview-items/v1", "rippling.v1-urls/v1", "paycom.public-detail/v1", "rippling.v1-detail/v1", "paylocity.proxy-embedded-items/v1", "paylocity.proxy-html-detail/v1", "dayforce.session-search/v1", "dom.proxy-urls/v1", "api_sniffer.proxy-http-items/v1", "inline.proxy-document-items/v1", "sitemap.proxy-explicit-urls/v1", "eightfold.proxy-pcsx-sitemap/v1", "phenom.proxy-sitemap-urls/v1", "eightfold.proxy-jsonld-api-detail/v1", "dom.proxy-detail/v1", "jsonld.proxy-detail/v1", "api_sniffer.proxy-http-detail/v1", "rss.governmentjobs-skip/v1", "rss.governmentjobs-items/v1", "rss.zoho_recruit-skip/v1", "rss.zoho_recruit-items/v1", "dom.direct-rows/v1", "dom.proxy-rows/v1", "dom.rendered-rows/v1", "rss.hr_manager-skip/v1", "rss.hr_manager-items/v1", "rss.successfactors-legacy-xml-skip/v1", "rss.successfactors-legacy-xml-items/v1", "rss.generic-summary-skip/v1", "rss.generic-summary-items/v1", "rss.wp_job_manager-skip/v1", "rss.wp_job_manager-items/v1", "rss.rendered-generic-skip/v1", "rss.rendered-generic-items/v1", "rss.rendered-generic-summary-skip/v1", "rss.rendered-generic-summary-items/v1", "rss.rendered-wp_job_manager-skip/v1", "rss.rendered-wp_job_manager-items/v1", "inline.rendered-items/v1", "manatal.career-items/v1", "hrmos.listing-urls/v1", "recruiterbox.listing-urls/v1", "jobs_ch.company-urls/v1", "api_sniffer.browser-items/v1", "deel.public-items/v1", "hibob.public-items/v1", "traffit.public-items/v1", "earcu.public-items/v1", "earcu.proxy-feed-items/v1", "cvwarehouse.public-items/v1", "woowa.public-items/v1", "beehire.public-items/v1", "hirehive.public-items/v1", "welcometothejungle.public-items/v1", "computrabajo.listing-urls/v1", "computrabajo.proxy-listing-urls/v1", "ycombinator.listing-urls/v1", "talentbrew.listing-urls/v1", "intervieweb.form-listing-urls/v1", "typify.partition-items/v1", "universia.public-items/v1", "talentreef.brand-items/v1", "umantis.listing-urls/v1", "umantis.proxy-listing-urls/v1", "notion.public-urls/v1", "notion.public-detail/v1", "unifr.authoritative-items/v1", "pdf.public-detail/v1", "seek.advertiser-urls/v1", "avature.listing-urls/v1", "seek.graphql-detail/v1", "linkedin.guest-items/v1", "taleo.listing-urls/v1", "practicematch.proxy-listing-urls/v1", "linkedin.guest-detail/v1", "jazzhr.public-detail/v1", "taleo.enterprise-detail/v1", "jobbank104.public-items/v1", "jobbank104.proxy-public-items/v1", "cnstaff.public-items/v1", "seamlesshiring.public-items/v1", "jarvi.public-items/v1", "job51.public-items/v1", "paynet.public-items/v1", "nowhiring.public-items/v1", "fenbi.public-items/v1", "wecruit.public-items/v1", "ashby.token-items/v1", "lever.token-items/v1", "recruitee.api-items/v1", "pageup.listing-items/v1", "infoniqa.session-urls/v1", "keka.public-items/v1", "turbohire.public-items/v1", "curately.public-items/v1", "inploi.public-items/v1", "jobconvo.listing-urls/v1", "jobconvo.public-detail/v1", "workable.proxy-api-urls/v1", "workable.proxy-api-detail/v1", "smartrecruiters.canonical-items/v1", "jobstreet.company-items/v1", "jobstreet.graphql-detail/v1", "rss.successfactors-legacy-session-items/v1", "darwinbox.session-items/v1", "bytedance.partition-items/v1", "accenture.http-items/v1", "candidatus.http-postback-urls/v1", "johdi.listing-urls/v1", "jobdiva.listing-urls/v1", "headhunter.summary-items/v1", "headhunter.proxy-summary-items/v1", "johdi.api-detail/v1", "headhunter.api-detail/v1", "headhunter.proxy-api-detail/v1", "papa_johns.listing-urls/v1", "papa_johns.proxy-listing-urls/v1", "infor.session-items/v1", "peoplesoft.session-items/v1", "unisante.authoritative-items/v1", "infor.session-detail/v1", "peoplesoft.session-detail/v1", "talemetry.listing-urls/v1", "talemetry.proxy-listing-urls/v1", "talemetry.json-urls/v1", "talemetry.proxy-json-urls/v1", "prospective.localized-items/v1", "kipt.bulletin-items/v1", "rss.successfactors-rmk-skip/v1", "rss.successfactors-rmk-items/v1", "rss.successfactors-rmk-proxy-skip/v1", "rss.successfactors-rmk-proxy-items/v1", "amazon.partitioned-items/v1", "oracle_hcm.proxy-finder-items/v1", "oracle_hcm.proxy-api-detail/v1", "skip.unscheduled-detail/v1", "skip.browser-unscheduled-detail/v1"]'
          if docker run --rm --read-only --entrypoint /usr/local/bin/go-ordinary-worker jobseek-crawler:runtime-v1; then
            echo "Native worker accepted an unselected environment" >&2
            exit 1
          fi

      - name: Verify installed proxy preflight without runtime credentials or network
        run: |
          set -euo pipefail
          output="$(docker run --rm --read-only --network none \
            --entrypoint /usr/local/bin/go-ordinary-worker \
            -e PROXY_PROVIDER=none \
            jobseek-crawler:runtime-v1 --proxy-preflight)"
          test "$output" = 'Runtime proxy configuration valid: mode=disabled, pool_entries=0'
          if docker run --rm --read-only --network none \
            --entrypoint /usr/local/bin/go-ordinary-worker \
            -e PROXY_PROVIDER=webshare \
            jobseek-crawler:runtime-v1 --proxy-preflight; then
            echo 'Proxy preflight accepted a selected provider without an endpoint' >&2
            exit 1
          fi

      - name: Verify installed legacy routing reader against the Go codec fixture
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/go/ordinary-queue/testdata/ownership_projection_python.json,target=/tmp/ownership-codec.json,readonly" \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            -I -c 'import json, pathlib; from src.ordinary_ownership import ownership_projection; cases=json.loads(pathlib.Path("/tmp/ownership-codec.json").read_text())["cases"]; assert any(case["name"] == "api_browser_monitor" for case in cases); assert all(ownership_projection(case["payload"]) == case["projection"] for case in cases)'

      - name: Verify installed build info for all long-lived roles
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < apps/crawler/VERSION)"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            -I /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-installed

          misleading_version="$RUNNER_TEMP/misleading-crawler-VERSION"
          printf '0.13.111\n' >"$misleading_version"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            --mount \
              "type=bind,source=$misleading_version,target=/app/VERSION,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-source-checkout \
            --expected-source-root /app
