name: Crawler Runtime v1 Contracts

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/v1/**'
      - 'apps/crawler/pyproject.toml'
      - 'apps/crawler/uv.lock'
      - 'apps/crawler/Dockerfile'
      - 'apps/crawler/VERSION'
      - 'apps/crawler/scripts/verify-build-info-release.py'
      - 'apps/crawler/src/metrics.py'
      - 'apps/crawler/src/shared/constants.py'
      - '.github/workflows/crawler-runtime-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/v1/**'
      - 'apps/crawler/pyproject.toml'
      - 'apps/crawler/uv.lock'
      - 'apps/crawler/Dockerfile'
      - 'apps/crawler/VERSION'
      - 'apps/crawler/scripts/verify-build-info-release.py'
      - 'apps/crawler/src/metrics.py'
      - 'apps/crawler/src/shared/constants.py'
      - '.github/workflows/crawler-runtime-contracts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish installed-source evidence already being collected; retain only the
  # newest pending revision. Each newer source still needs its own admission.
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bindings-and-conformance:
    name: Bindings and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: apps/crawler/contracts/go.sum

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Install pinned generators
        run: |
          set -euo pipefail
          cd apps/crawler
          uv sync --frozen --group dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          printf '#!/usr/bin/env bash\nexec "%s" -m grpc_tools.protoc "$@"\n' \
            "$GITHUB_WORKSPACE/apps/crawler/.venv/bin/python" \
            > "$RUNNER_TEMP/protoc"
          chmod 0755 "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check deterministic generated bindings
        working-directory: apps/crawler
        run: ./contracts/v1/generate.sh --check

      - name: Check frozen protocol and shared corpora
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run python contracts/v1/tools/check_protocol.py
          uv run python contracts/v1/tools/check_compatibility.py \
            --protoc "$RUNNER_TEMP/protoc"
          uv run python contracts/v1/tools/generate_privacy.py --check
          uv run python contracts/v1/tools/check_semantics.py --check
          uv run pytest -q \
            contracts/v1/conformance/python \
            tests/test_runtime_contracts.py

      - name: Test Go bindings and conformance
        working-directory: apps/crawler/contracts
        run: |
          set -euo pipefail
          go test -race ./v1/...
          go vet ./v1/...

      - name: Test generated Go package from an external consumer
        env:
          CONTRACT_MODULE: github.com/colophon-group/jobseek/apps/crawler/contracts
        run: |
          set -euo pipefail
          consumer="$(mktemp -d "$RUNNER_TEMP/runtime-v1-go-consumer.XXXXXX")"
          cd "$consumer"
          go mod init example.com/runtime-v1-consumer
          go mod edit "-require=${CONTRACT_MODULE}@v0.0.0"
          go mod edit "-replace=${CONTRACT_MODULE}=${GITHUB_WORKSPACE}/apps/crawler/contracts"
          cat > runtime_test.go <<'EOF'
          package consumer

          import (
            "testing"

            runtimev1 "github.com/colophon-group/jobseek/apps/crawler/contracts/v1/gen/go"
            "google.golang.org/protobuf/proto"
          )

          func TestGeneratedBinding(t *testing.T) {
            hello := &runtimev1.ClientHello{
              SupportedContractVersions: []string{"crawler.runtime/v1"},
              Implementation: runtimev1.Implementation_IMPLEMENTATION_GO,
            }
            encoded, err := proto.Marshal(hello)
            if err != nil {
              t.Fatal(err)
            }
            restored := new(runtimev1.ClientHello)
            if err := proto.Unmarshal(encoded, restored); err != nil {
              t.Fatal(err)
            }
            if !proto.Equal(hello, restored) {
              t.Fatal("generated binding changed the message")
            }
          }
          EOF
          GOWORK=off go mod tidy
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...

      - name: Build and import the isolated crawler wheel
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          wheel_dir="$(mktemp -d "$RUNNER_TEMP/runtime-v1-wheel.XXXXXX")"
          venv_dir="$(mktemp -d "$RUNNER_TEMP/runtime-v1-venv.XXXXXX")"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.13.15 "$venv_dir"
          uv pip install --python "$venv_dir/bin/python" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH='' "$venv_dir/bin/python" -I - <<'PY'
          import importlib.resources
          import json
          import os
          import sysconfig
          from pathlib import Path

          import jobseek_runtime_v1
          from jobseek_runtime_v1 import CONTRACT_VERSION, runtime_pb2
          from jobseek_runtime_v1 import framing

          site_packages = Path(sysconfig.get_paths()["purelib"]).resolve()
          for module in (jobseek_runtime_v1, runtime_pb2, framing):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(site_packages), (origin, site_packages)
              assert not origin.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))

          hello = runtime_pb2.ClientHello(
              supported_contract_versions=[CONTRACT_VERSION],
              implementation=runtime_pb2.IMPLEMENTATION_PYTHON,
          )
          payload = hello.SerializeToString()
          wire = framing.encode_record(payload, 4096)
          assert framing.decode_record(wire, 4096) == payload
          registry = json.loads(
              importlib.resources.files("jobseek_runtime_v1")
              .joinpath("privacy_registry.json")
              .read_text(encoding="utf-8")
          )
          assert registry["format"] == "jobseek.runtime.privacy-registry/v1"
          assert runtime_pb2.DESCRIPTOR.package == "jobseek.crawler.runtime.v1"
          PY
          expected_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/apps/crawler/VERSION")"
          PYTHONPATH='' "$venv_dir/bin/python" -I \
            "$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py" \
            --expected-version "$expected_version" \
            --require-installed

  image-parity:
    name: Installed image parity (${{ matrix.arch }})
    needs: bindings-and-conformance
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Full installed host readbacks run across every joined cold phase/retry.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: jobseek_ordinary_worker_test
        options: >-
          --health-cmd "pg_isready -U crawler -d jobseek_ordinary_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --label com.docker.compose.project=jobseek-native-host-contain
          --label com.docker.compose.service=postgres
          --label com.docker.compose.oneoff=False
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/crawler/go/ordinary-worker/go.mod
          cache-dependency-path: apps/crawler/go/ordinary-worker/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Prepare isolated native process database and Redis fixtures
        working-directory: apps/crawler
        env:
          LOCAL_DATABASE_URL: postgresql://crawler:crawler@127.0.0.1:5432/jobseek_ordinary_worker_test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          uv sync --frozen --group dev
          uv run --frozen alembic -c src/migrations/alembic.ini upgrade head

      - name: Build slim crawler image
        run: docker build --target slim --build-arg "CRAWLER_SOURCE_REVISION=${GITHUB_SHA}" --tag jobseek-crawler:runtime-v1 apps/crawler

      - name: Verify installed native ordinary source and CA identity
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint go-ordinary-worker jobseek-crawler:runtime-v1 --identity \
            > "$RUNNER_TEMP/ordinary-identity.json"
          python3 - "$RUNNER_TEMP/ordinary-identity.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          identity = json.load(open(sys.argv[1], encoding="utf-8"))
          assert identity == {"source_revision": sys.argv[2], "ca_sha256": "fc9165a12403263e7ebfbdad7be7a3eac0fa5d325d3c70465f28d3690072ca28", "profile": "greenhouse.token-skip/v1"}
          PY

      - name: Verify image-installed native process crash and receipt recovery
        id: ordinary-image-process
        working-directory: apps/crawler/go/ordinary-worker
        env:
          JOBSEEK_ORDINARY_QUEUE_TEST_DATABASE_URL: postgresql://crawler:crawler@127.0.0.1:5432/jobseek_ordinary_worker_test
          JOBSEEK_ORDINARY_QUEUE_REQUIRE_POSTGRES: "1"
          JOBSEEK_ORDINARY_QUEUE_REQUIRE_REDIS: "1"
          JOBSEEK_ORDINARY_IMAGE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          fixture_directory="$(mktemp -d "$RUNNER_TEMP/ordinary-image.XXXXXX")"
          chmod 0700 "$fixture_directory"
          fixture_container="$(docker create jobseek-crawler:runtime-v1)"
          join_container=''
          fixture_registry=''
          containment_worker=''
          containment_exporter=''
          cleanup_image_fixtures() {
            if [ -n "$containment_worker" ]; then docker rm -f "$containment_worker" >/dev/null; fi
            if [ -n "$containment_exporter" ]; then docker rm -f "$containment_exporter" >/dev/null; fi
            if [ -n "$join_container" ]; then docker rm "$join_container" >/dev/null; fi
            if [ -n "$fixture_registry" ]; then docker rm -f -v "$fixture_registry" >/dev/null; fi
            docker rm "$fixture_container" >/dev/null
          }
          trap cleanup_image_fixtures EXIT
          docker cp "$fixture_container:/usr/local/bin/go-ordinary-worker" "$fixture_directory/ordinary-worker"
          docker cp "$fixture_container:/etc/ssl/certs/ca-certificates.crt" "$fixture_directory/system-ca.pem"
          docker cp "$fixture_container:/app/data" "$fixture_directory/data"
          chmod -R a-w "$fixture_directory/data"
          export JOBSEEK_ORDINARY_IMAGE_BINARY="$fixture_directory/ordinary-worker"
          echo "binary=$fixture_directory/ordinary-worker" >> "$GITHUB_OUTPUT"
          export JOBSEEK_ORDINARY_IMAGE_DATA_DIRECTORY="$fixture_directory/data"
          echo "data_directory=$fixture_directory/data" >> "$GITHUB_OUTPUT"
          docker image inspect --format '{{.Id}}' jobseek-crawler:runtime-v1 > "$fixture_directory/image-id"
          docker image inspect --format '{{.Architecture}}' jobseek-crawler:runtime-v1 > "$fixture_directory/image-architecture"
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint sha256sum jobseek-crawler:runtime-v1 \
            /usr/local/bin/go-ordinary-worker > "$fixture_directory/installed-binary-sha256"
          python3 - "$fixture_directory" "$GITHUB_SHA" "$RUNNER_TEMP/ordinary-image-proof.json" "${{ matrix.arch }}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          architecture = (root / "image-architecture").read_text().strip()
          assert architecture == sys.argv[4] and architecture in {"amd64", "arm64"}
          binary_sha = hashlib.sha256((root / "ordinary-worker").read_bytes()).hexdigest()
          assert binary_sha == (root / "installed-binary-sha256").read_text().split()[0]
          assets = {str(path.relative_to(root / "data")): hashlib.sha256(path.read_bytes()).hexdigest()
                    for path in sorted((root / "data").rglob("*")) if path.is_file()}
          assert assets
          proof = {"source_revision": sys.argv[2], "image_id": (root / "image-id").read_text().strip(), "architecture": architecture,
                   "binary_sha256": binary_sha, "system_ca_sha256": hashlib.sha256((root / "system-ca.pem").read_bytes()).hexdigest(),
                   "installed_asset_sha256": assets,
                   "scope": "image-extracted native binary and assets on Linux; private PostgreSQL/Redis",
                   "production_changed": False}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(proof, indent=2) + "\n")
          PY
          go test -race -count=1 -timeout=90s -v -run '^TestRealNativeExecutable' ./... \
            | tee "$RUNNER_TEMP/ordinary-image-process-tests.log"
          # Read the already-owned, never-started container through the native
          # host evidence library. Do not create or mutate containers here.
          # Expected source/build authentication remains a separate host gate.
          (
            cd ../ordinary-queue
            JOBSEEK_CRAWLER_RELEASE_REQUIRE_INSTALLED_FILES=1 \
            JOBSEEK_CRAWLER_RELEASE_IMAGE_FILE_PROOF="$RUNNER_TEMP/ordinary-image-proof.json" \
            JOBSEEK_CRAWLER_RELEASE_IMAGE_CONTAINER="$fixture_container" \
              go test -race -tags=integration -count=1 -timeout=180s -v \
                -run '^TestActualInstalledContainerFilesRequireExactRetainedManifest$' ./releaseevidence
          ) | tee "$RUNNER_TEMP/ordinary-installed-files-tests.log"
          # Only this disposable harness publishes to a loopback registry and
          # creates the scoped, never-started native container. The installed
          # coordinator observes it read-only; no agent receives Docker access.
          fixture_registry="$(docker run -d --restart=no -p 127.0.0.1:15000:5000 \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373)"
          curl --fail --silent --retry 12 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:15000/v2/ >/dev/null
          docker tag jobseek-crawler:runtime-v1 localhost:15000/native:fixture
          docker push localhost:15000/native:fixture
          docker image inspect --format '{{json .RepoDigests}}' jobseek-crawler:runtime-v1 \
            > "$fixture_directory/repository-digests.json"
          python3 - "$fixture_directory/repository-digests.json" "$RUNNER_TEMP/ordinary-image-proof.json" \
            "$RUNNER_TEMP/ordinary-host-installed-join-proof.json" "$fixture_directory/immutable-reference" \
            "$RUNNER_TEMP/ordinary-host-installed-manifest.json" <<'PY'
          import hashlib, json, pathlib, re, sys, urllib.request
          refs = [ref for ref in json.loads(pathlib.Path(sys.argv[1]).read_text())
                  if re.fullmatch(r'localhost:15000/native@sha256:[0-9a-f]{64}', ref)]
          assert len(refs) == 1
          ref = refs[0]
          digest = ref.split('@', 1)[1]
          request = urllib.request.Request('http://127.0.0.1:15000/v2/native/manifests/' + digest,
              headers={'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              raw = response.read(1 << 20)
              assert response.headers['Docker-Content-Digest'] == digest
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == digest
          manifest = json.loads(raw)
          original = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert manifest['config']['digest'] == original['image_id']
          proof = dict(original, immutable_reference=ref, registry_manifest_sha256=digest.split(':', 1)[1],
                       manifest_config_image_id=manifest['config']['digest'],
                       scope='disposable loopback publication of exact native image; synthetic release roles; no production build/selection admission')
          pathlib.Path(sys.argv[3]).write_text(json.dumps(proof, indent=2) + '\n')
          pathlib.Path(sys.argv[4]).write_text(ref + '\n')
          pathlib.Path(sys.argv[5]).write_bytes(raw)
          PY
          join_container="$(docker create --user 10001:10001 \
            --label com.docker.compose.project=jobseek-native-installed-join \
            --label com.docker.compose.service=worker \
            --label com.docker.compose.oneoff=False \
            "$(cat "$fixture_directory/immutable-reference")")"
          # Execute the connected preflight on this disposable Linux host,
          # using the independently image-installed binary. It retains only
          # fixture evidence and grants no cold or runtime admission.
          JOBSEEK_CRAWLER_RELEASE_REQUIRE_HOST_PREFLIGHT=1 \
          JOBSEEK_CRAWLER_RELEASE_REQUIRE_HOST_INSTALLED_JOIN=1 \
          JOBSEEK_CRAWLER_RELEASE_HOST_JOIN_PROOF="$RUNNER_TEMP/ordinary-host-installed-join-proof.json" \
          JOBSEEK_CRAWLER_RELEASE_HOST_JOIN_CONTAINER="$join_container" \
          JOBSEEK_CRAWLER_RELEASE_HOST_UNSCOPED_CONTAINER="$fixture_container" \
            go test -race -tags=integration -count=1 -timeout=180s -v \
              -run '^TestActualInstalledNativeHostPreflight' ./... \
            | tee "$RUNNER_TEMP/ordinary-host-preflight-tests.log"
          # The installed coordinator's only effects in this fixture disable
          # restarts and stop these two disposable sleeping writer stand-ins.
          # This does not grant SQL, full runtime fidelity or rollout admission.
          # Remove the foreign live registry before whole-daemon containment;
          # immutable image inspection uses already installed local identities.
          docker rm -f -v "$fixture_registry" >/dev/null
          fixture_registry=''
          containment_worker="$(docker run -d --restart=always --user 10001:10001 \
            --label com.docker.compose.project=jobseek-native-host-contain \
            --label com.docker.compose.service=worker --label com.docker.compose.oneoff=False \
            --entrypoint /bin/sleep "$(cat "$fixture_directory/immutable-reference")" 600)"
          containment_exporter="$(docker run -d --restart=always --user 10001:10001 \
            --label com.docker.compose.project=jobseek-native-host-contain \
            --label com.docker.compose.service=exporter --label com.docker.compose.oneoff=False \
            --entrypoint /bin/sleep "$(cat "$fixture_directory/immutable-reference")" 600)"
          JOBSEEK_CRAWLER_RELEASE_REQUIRE_HOST_CONTAINMENT=1 \
          JOBSEEK_CRAWLER_RELEASE_HOST_JOIN_PROOF="$RUNNER_TEMP/ordinary-host-installed-join-proof.json" \
          JOBSEEK_CRAWLER_RELEASE_CONTAINMENT_WORKER="$containment_worker" \
          JOBSEEK_CRAWLER_RELEASE_CONTAINMENT_EXPORTER="$containment_exporter" \
            go test -race -tags=integration -count=1 -timeout=600s -v \
              -run '^TestActualInstalledNativeHostContainment' ./... \
            | tee "$RUNNER_TEMP/ordinary-host-containment-tests.log"
          JOBSEEK_CRAWLER_RELEASE_REQUIRE_HOST_QUIESCENCE=1 \
          JOBSEEK_CRAWLER_RELEASE_HOST_JOIN_PROOF="$RUNNER_TEMP/ordinary-host-installed-join-proof.json" \
          JOBSEEK_CRAWLER_RELEASE_CONTAINMENT_WORKER="$containment_worker" \
          JOBSEEK_CRAWLER_RELEASE_CONTAINMENT_EXPORTER="$containment_exporter" \
            go test -race -tags=integration -count=1 -timeout=600s -v \
              -run '^TestActualInstalledNativeHostQuiescence' ./... \
            | tee "$RUNNER_TEMP/ordinary-host-quiescence-tests.log"

      - name: Verify actual selected Redis host callback and retained journal phases
        working-directory: apps/crawler/go/ordinary-worker
        run: |
          set -euo pipefail
          # Only this disposable harness runs the owned root fixture. The
          # coordinator needs the official Redis daemon's host /proc PID/fd
          # observation; agents do not receive or invoke the Docker socket.
          docker pull redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
          joined_binary="${RUNNER_TEMP}/ordinary-host-selected-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.test"
          go test -race -c -tags=integration -o "$joined_binary" .
          chmod 0755 "$joined_binary"
          trap 'rm -f "$joined_binary"' EXIT
          installed_binary="${{ steps.ordinary-image-process.outputs.binary }}"
          installed_data="${{ steps.ordinary-image-process.outputs.data_directory }}"
          test -x "$installed_binary"
          test -d "$installed_data"
          # Earlier fixture commands created this shared inode as the runner
          # user. Transfer only its disposable ownership while holding that
          # same lock, so the strict root coordinator owner predicate holds.
          test -f /run/lock/jobseek-crawler-mutation.lock
          test ! -L /run/lock/jobseek-crawler-mutation.lock
          # util-linux flock opens with O_CREAT|O_RDWR. Linux protected_regular
          # refuses that open for an existing runner-owned file in /run/lock's
          # sticky directory, including as root. Open the exact existing inode
          # read-only without following links; fchown only after its flock.
          sudo python3 - <<'PY'
          import fcntl, os, stat, time
          path = '/run/lock/jobseek-crawler-mutation.lock'
          fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              opened = os.fstat(fd)
              assert stat.S_ISREG(opened.st_mode) and opened.st_nlink == 1
              assert opened.st_mode & 0o022 == 0
              deadline = time.monotonic() + 5
              while True:
                  try:
                      fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      break
                  except BlockingIOError:
                      if time.monotonic() >= deadline:
                          raise TimeoutError('owned fixture mutation lock busy')
                      time.sleep(0.025)
              named = os.lstat(path)
              assert (opened.st_dev, opened.st_ino) == (named.st_dev, named.st_ino)
              os.fchown(fd, 0, 0)
          finally:
              os.close(fd)
          PY
          sudo env PATH=/usr/bin:/bin GITHUB_ACTIONS=true \
            JOBSEEK_CRAWLER_RELEASE_REQUIRE_HOST_SELECTED_REDIS=1 \
            JOBSEEK_CRAWLER_RELEASE_HOST_JOIN_PROOF="$RUNNER_TEMP/ordinary-host-installed-join-proof.json" \
            JOBSEEK_CRAWLER_RELEASE_HOST_SELECTED_REDIS_PROOF="$RUNNER_TEMP/ordinary-host-selected-redis-proof.json" \
            JOBSEEK_ORDINARY_QUEUE_REQUIRE_POSTGRES=1 \
            JOBSEEK_ORDINARY_QUEUE_REQUIRE_REDIS=1 \
            JOBSEEK_ORDINARY_QUEUE_TEST_DATABASE_URL=postgresql://crawler:crawler@127.0.0.1:5432/jobseek_ordinary_worker_test \
            JOBSEEK_ORDINARY_IMAGE_SOURCE_REVISION="$GITHUB_SHA" \
            JOBSEEK_ORDINARY_IMAGE_BINARY="$installed_binary" \
            JOBSEEK_ORDINARY_IMAGE_DATA_DIRECTORY="$installed_data" \
            "$joined_binary" \
            -test.run '^TestActualHostSelectedRedisJournalJoinsScopeAndExactReservation$' \
            -test.count=1 -test.timeout=960s -test.v \
            | tee "$RUNNER_TEMP/ordinary-host-selected-redis-tests.log"

      - name: Save installed native process identities and test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordinary-image-process-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ordinary-identity.json
            ${{ runner.temp }}/ordinary-image-proof.json
            ${{ runner.temp }}/ordinary-image-process-tests.log
            ${{ runner.temp }}/ordinary-installed-files-tests.log
            ${{ runner.temp }}/ordinary-host-preflight-tests.log
            ${{ runner.temp }}/ordinary-host-installed-join-proof.json
            ${{ runner.temp }}/ordinary-host-installed-manifest.json
            ${{ runner.temp }}/ordinary-host-containment-tests.log
            ${{ runner.temp }}/ordinary-host-quiescence-tests.log
            ${{ runner.temp }}/ordinary-host-selected-redis-tests.log
            ${{ runner.temp }}/ordinary-host-selected-redis-proof.json
          if-no-files-found: error

      - name: Import the installed contract surface from the image
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            -I -c 'import importlib.resources, json, pathlib, sysconfig; import jobseek_runtime_v1; from jobseek_runtime_v1 import CONTRACT_VERSION, framing, runtime_pb2; site=pathlib.Path(sysconfig.get_paths()["purelib"]).resolve(); modules=(jobseek_runtime_v1, framing, runtime_pb2); assert all(pathlib.Path(module.__file__).resolve().is_relative_to(site) for module in modules); assert not pathlib.Path("/app/contracts").exists(); hello=runtime_pb2.ClientHello(supported_contract_versions=[CONTRACT_VERSION], implementation=runtime_pb2.IMPLEMENTATION_PYTHON); payload=hello.SerializeToString(); wire=framing.encode_record(payload, 4096); assert framing.decode_record(wire, 4096) == payload; registry=json.loads(importlib.resources.files("jobseek_runtime_v1").joinpath("privacy_registry.json").read_text(encoding="utf-8")); assert registry["format"] == "jobseek.runtime.privacy-registry/v1"; assert runtime_pb2.DESCRIPTOR.package == "jobseek.crawler.runtime.v1"'

      - name: Verify installed build info for all long-lived roles
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < apps/crawler/VERSION)"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            -I /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-installed

          misleading_version="$RUNNER_TEMP/misleading-crawler-VERSION"
          printf '0.13.111\n' >"$misleading_version"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            --mount \
              "type=bind,source=$misleading_version,target=/app/VERSION,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler:runtime-v1 \
            /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-source-checkout \
            --expected-source-root /app
