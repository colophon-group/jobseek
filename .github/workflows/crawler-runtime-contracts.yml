name: Crawler runtime contracts

on:
  pull_request:
    paths:
      - "apps/crawler/contracts/**"
      - "apps/crawler/pyproject.toml"
      - "apps/crawler/uv.lock"
      - ".github/workflows/crawler-runtime-contracts.yml"
  push:
    branches: [main]
    paths:
      - "apps/crawler/contracts/**"
      - "apps/crawler/pyproject.toml"
      - "apps/crawler/uv.lock"
      - ".github/workflows/crawler-runtime-contracts.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crawler/contracts/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.17"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: apps/crawler/contracts/v1/go.sum
      - name: Install pinned generators
        run: |
          uv sync --project ../..
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Verify generated bindings and fixtures
        run: |
          ./generate.sh --check
          PYTHONPATH=python:. uv run --project ../.. python tools/build_fixtures.py
          git diff --exit-code -- gen python/crawler_runtime_contracts/v1/runtime_pb2.py fixtures
      - name: Verify installable Python boundary
        run: |
          uv build --project ../.. --wheel --out-dir "$RUNNER_TEMP/contracts-dist"
          uv venv "$RUNNER_TEMP/contracts-venv"
          uv pip install --python "$RUNNER_TEMP/contracts-venv/bin/python" "$RUNNER_TEMP/contracts-dist/"*.whl
          "$RUNNER_TEMP/contracts-venv/bin/python" -c "from crawler_runtime_contracts.v1 import framing, runtime_pb2; assert runtime_pb2.DESCRIPTOR.package == 'jobseek.crawler.runtime.v1'; assert callable(framing.decode_delimited)"
      - name: Python conformance
        run: |
          PYTHONPATH=python:. uv run --project ../.. pytest -q conformance/python/test_contract.py
          PYTHONPATH=python:. uv run --project ../.. python tools/check_contract.py
          uv run --project ../.. ruff check conformance/python tools python/crawler_runtime_contracts/v1/framing.py
          uv run --project ../.. ruff format --check conformance/python tools python/crawler_runtime_contracts/v1/framing.py
      - name: Go conformance
        run: |
          go test -race ./...
          go vet ./...
