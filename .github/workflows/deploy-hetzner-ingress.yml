name: Deploy Hetzner Ingress Baseline

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only audit or guarded production apply
        required: true
        type: choice
        options:
          - audit
          - apply
          - install-feed-role
          - audit-feed-role

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: hetzner-ingress-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install PostgreSQL 16 for the reader boundary proof
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16
          test -x /usr/lib/postgresql/16/bin/initdb
      - name: Validate ingress tooling
        env:
          JOBSEEK_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          bash -n deploy/networking/install-host.sh
          bash -n deploy/networking/harden-postgresql.sh
          bash -n deploy/networking/verify-private-paths.sh
          bash -n deploy/networking/run-remote.sh
          bash -n deploy/backups/postgresql/restore-drill.sh
          shellcheck \
            deploy/networking/install-host.sh \
            deploy/networking/harden-postgresql.sh \
            deploy/networking/verify-private-paths.sh \
            deploy/networking/run-remote.sh \
            deploy/backups/postgresql/restore-drill.sh
          python3 -m py_compile \
            scripts/jobseek-ingress-conformance.py \
            scripts/manage-hetzner-ingress.py \
            deploy/networking/justup-feed-readonly-role.py
          cd apps/crawler
          uv run --frozen pytest \
            tests/test_ingress_baseline.py \
            tests/test_justup_feed_role.py \
            tests/test_justup_feed_role_postgres.py -q

  control-plane-audit:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit firewall and derive private inventory
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/unused-firewall-state.json"
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "$state" \
            --github-env "$GITHUB_ENV"

  host-stage-or-audit:
    needs: control-plane-audit
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [crawler, postgresql, typesense]
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive private inventory
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "${RUNNER_TEMP}/unused-firewall-state.json" \
            --github-env "$GITHUB_ENV"
      - name: Audit crawler without writing to production
        if: ${{ inputs.action == 'audit' && matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          audit
          crawler
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
      - name: Audit PostgreSQL without writing to production
        if: ${{ inputs.action == 'audit' && matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          audit
          postgresql
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
      - name: Audit Typesense without writing to production
        if: ${{ inputs.action == 'audit' && matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          audit
          typesense
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
      - name: Stage crawler host policy
        if: ${{ inputs.action == 'apply' && matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          stage
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Stage PostgreSQL host policy
        if: ${{ inputs.action == 'apply' && matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          stage
          postgresql
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Stage Typesense host policy
        if: ${{ inputs.action == 'apply' && matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          stage
          typesense
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back a failed crawler host stage
        if: ${{ failure() && inputs.action == 'apply' && matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back a failed PostgreSQL host stage
        if: ${{ failure() && inputs.action == 'apply' && matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          postgresql
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back a failed Typesense host stage
        if: ${{ failure() && inputs.action == 'apply' && matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          typesense
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"

  provider-audit-conformance:
    if: ${{ always() && inputs.action == 'audit' }}
    needs: host-stage-or-audit
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact provider policy and external port state
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py verify \
            --state "${RUNNER_TEMP}/unused-firewall-state.json"

  validate-private-paths:
    if: ${{ inputs.action == 'apply' }}
    needs: host-stage-or-audit
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive private inventory
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "${RUNNER_TEMP}/unused-firewall-state.json" \
            --github-env "$GITHUB_ENV"
      - name: Verify real crawler private paths over a fresh SSH session
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          verify-private-paths
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
          "$JOBSEEK_TYPESENSE_PRIVATE_IP"

  rollback-after-staging-or-validation-failure:
    if: ${{ always() && inputs.action == 'apply' && (needs.host-stage-or-audit.result == 'failure' || (needs.host-stage-or-audit.result == 'success' && needs.validate-private-paths.result != 'success')) }}
    needs: [host-stage-or-audit, validate-private-paths]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [crawler, postgresql, typesense]
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive private inventory
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "${RUNNER_TEMP}/unused-firewall-state.json" \
            --github-env "$GITHUB_ENV"
      - name: Immediately roll back the staged crawler host
        if: ${{ matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Immediately roll back the staged PostgreSQL host
        if: ${{ matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          postgresql
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Immediately roll back the staged Typesense host
        if: ${{ matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          typesense
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"

  commit-hosts:
    if: ${{ inputs.action == 'apply' }}
    needs: validate-private-paths
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [crawler, postgresql, typesense]
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive private inventory
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "${RUNNER_TEMP}/unused-firewall-state.json" \
            --github-env "$GITHUB_ENV"
      - name: Commit crawler host policy after fresh-session and private-path proof
        if: ${{ matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          commit
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Commit PostgreSQL host policy after fresh-session and private-path proof
        if: ${{ matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          commit
          postgresql
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Commit Typesense host policy after fresh-session and private-path proof
        if: ${{ matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          commit
          typesense
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back any crawler transaction left pending by a failed commit
        if: ${{ failure() && matrix.service == 'crawler' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          crawler
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back any PostgreSQL transaction left pending by a failed commit
        if: ${{ failure() && matrix.service == 'postgresql' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          postgresql
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"
      - name: Roll back any Typesense transaction left pending by a failed commit
        if: ${{ failure() && matrix.service == 'typesense' }}
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          rollback
          typesense
          "${{ github.sha }}"
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
          "$JOBSEEK_POSTGRES_PRIVATE_IP"

  provider-firewall:
    if: ${{ inputs.action == 'apply' }}
    needs: commit-hosts
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply, verify, and transactionally retain the provider firewall
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/firewall-rollback.json"
          rollback=1
          cleanup() {
            status=$?
            if [[ "$rollback" == 1 && -s "$state" ]]; then
              python3 scripts/manage-hetzner-ingress.py rollback --state "$state" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          python3 scripts/manage-hetzner-ingress.py apply --state "$state"
          python3 scripts/manage-hetzner-ingress.py verify --state "$state"
          rollback=0
          trap - EXIT
          rm -f "$state"

  feed-role-maintenance:
    if: ${{ inputs.action == 'install-feed-role' || inputs.action == 'audit-feed-role' }}
    needs: control-plane-audit
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
      HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact current merged main revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
      - name: Derive the exact private inventory
        run: |
          set -euo pipefail
          python3 scripts/manage-hetzner-ingress.py audit \
            --state "${RUNNER_TEMP}/unused-firewall-state.json" \
            --github-env "$GITHUB_ENV"
      - name: Verify applied HBA, transport and install the fixed feed role
        if: ${{ inputs.action == 'install-feed-role' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          install-feed-role
          postgresql
          "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
      - name: Audit the installed feed role before an operator export
        if: ${{ inputs.action == 'audit-feed-role' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: >-
          bash deploy/networking/run-remote.sh
          audit-feed-role
          postgresql
          "$JOBSEEK_CRAWLER_PRIVATE_IP"
