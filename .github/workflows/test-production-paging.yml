name: Test Production Paging

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: production-paging-end-to-end
  cancel-in-progress: false

jobs:
  page-and-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Force and recover an independent critical page
        working-directory: apps/crawler
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          uv run --frozen python ../../scripts/test-grafana-paging.py \
            --test-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
