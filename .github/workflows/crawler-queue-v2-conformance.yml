            fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec jobseek-queue-v2-due-feeder-redis redis-cli -n 15 --raw DBSIZE)" = 0

      - name: Verify bounded due feeder and exact Redis composition
        working-directory: pilots/go-queue-v2-due-feeder
        env:
          QUEUE_V2_DUE_FEEDER_REDIS_ISOLATED: "1"
          QUEUE_V2_DUE_FEEDER_REDIS_URL: redis://127.0.0.1:6382/15
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.24.0 linux/amd64"
          go test -count=1 -race ./...
          go vet ./...
          gofmt -l . > "$RUNNER_TEMP/queue-v2-due-feeder-gofmt.out"
          if [[ -s "$RUNNER_TEMP/queue-v2-due-feeder-gofmt.out" ]]; then
            cat "$RUNNER_TEMP/queue-v2-due-feeder-gofmt.out"
            exit 1
          fi
          git diff --exit-code -- go.mod go.sum

      - name: Verify and stop isolated due-feeder Redis fixture
        if: always()
        run: |
          set +e
          status=0
          if docker container inspect jobseek-queue-v2-due-feeder-redis >/dev/null 2>&1; then
            dbsize="$(docker exec jobseek-queue-v2-due-feeder-redis \
              redis-cli -n 15 --raw DBSIZE)" || status=1
            if [[ "$dbsize" != 0 ]]; then
              echo "Redis DB 15 is not empty after due-feeder tests: $dbsize keys" >&2
              status=1
            fi
            docker rm --force jobseek-queue-v2-due-feeder-redis || status=1
          fi
          if docker container inspect jobseek-queue-v2-due-feeder-redis >/dev/null 2>&1; then
            echo "Due-feeder Redis fixture container still exists after cleanup" >&2
            status=1
          fi
          exit "$status"

      - name: Confirm due-feeder conformance left the tree unchanged
        if: always()
        run: git diff --exit-code -- pilots/go-queue-v2-due-feeder
