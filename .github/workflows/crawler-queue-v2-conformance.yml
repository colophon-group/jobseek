name: Candidate Queue v2 Conformance

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/queue/v2/**'
      - 'pilots/go-http-sitemap/boundedhttp/**'
      - 'pilots/go-http-sitemap/go.mod'
      - 'pilots/go-http-sitemap/sitemap/**'
      - 'pilots/go-http-sitemap/worker/**'
      - 'pilots/go-queue-v2-admission/**'
      - 'pilots/go-queue-v2-due-feeder/**'
      - '.github/workflows/crawler-queue-v2-conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/crawler/contracts/go.mod'
      - 'apps/crawler/contracts/go.sum'
      - 'apps/crawler/contracts/queue/v2/**'
      - 'pilots/go-http-sitemap/boundedhttp/**'
      - 'pilots/go-http-sitemap/go.mod'
      - 'pilots/go-http-sitemap/sitemap/**'
      - 'pilots/go-http-sitemap/worker/**'
      - 'pilots/go-queue-v2-admission/**'
      - 'pilots/go-queue-v2-due-feeder/**'
      - '.github/workflows/crawler-queue-v2-conformance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  conformance:
    name: Python and Go deterministic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: apps/crawler/contracts/go.sum

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Install locked Python test environment
        working-directory: apps/crawler
        run: uv sync --frozen --group dev

      - name: Verify deterministic corpus and Python reference
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          uv run python contracts/queue/v2/tools/generate_corpus.py --check
          uv run pytest -q contracts/queue/v2/conformance/python

      - name: Verify independent Go conformance
        working-directory: apps/crawler/contracts
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.24.0 linux/amd64"
          go test -race ./queue/v2/...
          go vet ./queue/v2/...
          gofmt -l queue/v2 > "$RUNNER_TEMP/queue-v2-gofmt.out"
          if [[ -s "$RUNNER_TEMP/queue-v2-gofmt.out" ]]; then
            cat "$RUNNER_TEMP/queue-v2-gofmt.out"
            exit 1
          fi

      - name: Start isolated production Redis fixture
        run: |
          set -euo pipefail
          docker run --detach --name jobseek-queue-v2-redis \
            --publish 127.0.0.1:6380:6379 \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            redis-server --save "" --appendonly no

          ready=false
          for _ in {1..30}; do
            if docker exec jobseek-queue-v2-redis redis-cli ping | grep -qx PONG; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec jobseek-queue-v2-redis redis-cli -n 15 --raw DBSIZE)" = 0

      - name: Verify Python and Go against real Redis
        env:
          QUEUE_V2_REDIS_ISOLATED: "1"
          QUEUE_V2_REDIS_URL: redis://127.0.0.1:6380/15
        run: |
          set -euo pipefail
          cd apps/crawler
          uv run pytest -q contracts/queue/v2/redis/python
          cd contracts
          go test -count=1 -race ./queue/v2/...

      - name: Verify and stop isolated Redis fixture
        if: always()
        run: |
          set +e
          status=0
          if docker container inspect jobseek-queue-v2-redis >/dev/null 2>&1; then
            dbsize="$(docker exec jobseek-queue-v2-redis redis-cli -n 15 --raw DBSIZE)"
            if [[ "$dbsize" != 0 ]]; then
              echo "Redis DB 15 is not empty after queue-v2 tests: $dbsize keys" >&2
              status=1
            fi
            docker rm --force jobseek-queue-v2-redis || status=1
          fi
          if docker container inspect jobseek-queue-v2-redis >/dev/null 2>&1; then
            echo "Redis fixture container still exists after cleanup" >&2
            status=1
          fi
          exit "$status"

      - name: Confirm generation left the tree unchanged
        if: always()
        run: git diff --exit-code -- apps/crawler/contracts/queue/v2

  postgres-conformance:
    name: PostgreSQL transactional fencing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Install locked Python test environment
        working-directory: apps/crawler
        run: uv sync --frozen --group dev

      - name: Start isolated PostgreSQL fence fixture
        run: |
          set -euo pipefail
          docker run --detach --name jobseek-queue-v2-postgres \
            --env POSTGRES_USER=queue_v2 \
            --env POSTGRES_PASSWORD=queue_v2 \
            --env POSTGRES_DB=queue_v2_contract \
            --publish 127.0.0.1:5433:5432 \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193

          ready=false
          for _ in {1..30}; do
            if docker exec jobseek-queue-v2-postgres \
              pg_isready -U queue_v2 -d queue_v2_contract >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec jobseek-queue-v2-postgres \
            psql -U queue_v2 -d queue_v2_contract -Atqc \
            "SELECT count(*) FROM pg_namespace WHERE nspname = 'queue_v2_contract'")" = 0

      - name: Verify transaction-bound PostgreSQL fencing
        working-directory: apps/crawler
        env:
          QUEUE_V2_POSTGRES_ISOLATED: "1"
          QUEUE_V2_POSTGRES_URL: postgresql://queue_v2:queue_v2@127.0.0.1:5433/queue_v2_contract
        run: uv run pytest -q contracts/queue/v2/postgres/python

      - name: Verify and stop isolated PostgreSQL fence fixture
        if: always()
        run: |
          set +e
          status=0
          if docker container inspect jobseek-queue-v2-postgres >/dev/null 2>&1; then
            residue="$(docker exec jobseek-queue-v2-postgres \
              psql -U queue_v2 -d queue_v2_contract -Atqc \
              "SELECT count(*) FROM pg_namespace WHERE nspname = 'queue_v2_contract'" \
              2>/dev/null)" || status=1
            if [[ "$residue" != 0 ]]; then
              echo "PostgreSQL queue-v2 contract schema remains after tests" >&2
              status=1
            fi
            docker rm --force jobseek-queue-v2-postgres || status=1
          fi
          if docker container inspect jobseek-queue-v2-postgres >/dev/null 2>&1; then
            echo "PostgreSQL fixture container still exists after cleanup" >&2
            status=1
          fi
          exit "$status"

      - name: Confirm PostgreSQL conformance left the tree unchanged
        if: always()
        run: git diff --exit-code -- apps/crawler/contracts/queue/v2/postgres

  admission-conformance:
    name: Go admission-before-claim composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: pilots/go-queue-v2-admission/go.sum

      - name: Start isolated production Redis fixture
        run: |
          set -euo pipefail
          docker run --detach --name jobseek-queue-v2-admission-redis \
            --publish 127.0.0.1:6381:6379 \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            redis-server --save "" --appendonly no

          ready=false
          for _ in {1..30}; do
            if docker exec jobseek-queue-v2-admission-redis redis-cli ping | grep -qx PONG; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec jobseek-queue-v2-admission-redis redis-cli -n 15 --raw DBSIZE)" = 0

      - name: Verify bounded admission and exact Redis composition
        working-directory: pilots/go-queue-v2-admission
        env:
          QUEUE_V2_ADMISSION_REDIS_ISOLATED: "1"
          QUEUE_V2_ADMISSION_REDIS_URL: redis://127.0.0.1:6381/15
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.24.0 linux/amd64"
          go test -count=1 -race ./...
          go vet ./...
          gofmt -l . > "$RUNNER_TEMP/queue-v2-admission-gofmt.out"
          if [[ -s "$RUNNER_TEMP/queue-v2-admission-gofmt.out" ]]; then
            cat "$RUNNER_TEMP/queue-v2-admission-gofmt.out"
            exit 1
          fi
          git diff --exit-code -- go.mod go.sum

      - name: Verify and stop isolated admission Redis fixture
        if: always()
        run: |
          set +e
          status=0
          if docker container inspect jobseek-queue-v2-admission-redis >/dev/null 2>&1; then
            dbsize="$(docker exec jobseek-queue-v2-admission-redis \
              redis-cli -n 15 --raw DBSIZE)" || status=1
            if [[ "$dbsize" != 0 ]]; then
              echo "Redis DB 15 is not empty after admission tests: $dbsize keys" >&2
              status=1
            fi
            docker rm --force jobseek-queue-v2-admission-redis || status=1
          fi
          if docker container inspect jobseek-queue-v2-admission-redis >/dev/null 2>&1; then
            echo "Admission Redis fixture container still exists after cleanup" >&2
            status=1
          fi
          exit "$status"

      - name: Confirm admission conformance left the tree unchanged
        if: always()
        run: git diff --exit-code -- pilots/go-queue-v2-admission

  due-feeder-conformance:
    name: Go bounded due-feeder composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: pilots/go-queue-v2-due-feeder/go.sum

      - name: Start isolated production Redis fixture
        run: |
          set -euo pipefail
          docker run --detach --name jobseek-queue-v2-due-feeder-redis \
            --publish 127.0.0.1:6382:6379 \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            redis-server --save "" --appendonly no

          ready=false
          for _ in {1..30}; do
            if docker exec jobseek-queue-v2-due-feeder-redis redis-cli ping | grep -qx PONG; then
              ready=true
