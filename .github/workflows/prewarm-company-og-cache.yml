name: Prewarm company OG cache
run-name: Prewarm company OG ${{ inputs.target_revision || github.sha }} ${{ inputs.handoff_token || 'automatic' }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prewarm-company-og-cache.yml"
      - "apps/web/public/fonts/JetBrainsMono-Bold.ttf"
      - "apps/web/public/android-chrome-512x512.png"
      - "apps/web/script/prewarm-company-og-cache.ts"
      - "apps/web/src/lib/og/company-og-card.tsx"
      - "apps/web/src/lib/og/company-og-completion-marker.ts"
      - "apps/web/src/lib/og/company-og-key.ts"
      - "apps/web/src/lib/og/company-og-prewarm-plan.ts"
      - "apps/web/src/lib/og/company-og-renderer-version.ts"
      - "apps/web/src/lib/og/company-og-source-version.ts"
      - "apps/web/src/lib/og/render-company-og.tsx"
      - "apps/web/src/lib/og/site-og-card.tsx"
      - "apps/web/src/lib/og/site-og-key.ts"
  schedule:
    # Reconcile any objects missed by a failed deploy-triggered run.
    - cron: "43 2 * * 0"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel render/upload workers"
        required: false
        default: "4"
      max_companies:
        description: "Optional positive company limit for a canary"
        required: false
        default: ""
      target_revision:
        description: "Exact 40-character Git revision to prewarm"
        required: false
        default: ""
      handoff_token:
        description: "Opaque token identifying one trusted sync handoff"
        required: false
        default: ""
      full_rebuild:
        description: "Rebuild the complete company matrix (manual bootstrap only)"
        required: false
        default: false
        type: boolean
      full_rebuild_confirmation:
        description: "Type REBUILD-COMPANY-OG to approve a bounded full rebuild"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Every run writes the same production current.json pointer. One global
  # group plus ancestry checks prevent concurrent publication and rollback.
  group: prewarm-company-og-cache-production
  cancel-in-progress: false

jobs:
  prewarm:
    name: Render company OG cards outside Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Production
    env:
      PREWARM_CONCURRENCY: ${{ inputs.concurrency || '4' }}
      PREWARM_MAX_COMPANIES: ${{ inputs.max_companies || '' }}
      PREWARM_TARGET_REVISION: ${{ inputs.target_revision || github.sha }}
      PREWARM_HANDOFF_TOKEN: ${{ inputs.handoff_token || '' }}
      PREWARM_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
      PREWARM_FULL_REBUILD_CONFIRMATION: ${{ inputs.full_rebuild_confirmation || '' }}
      PREWARM_EVENT_NAME: ${{ github.event_name }}
      PREWARM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      COMPANY_OG_RENDERER_VERSION_SALT: ${{ vars.COMPANY_OG_RENDERER_VERSION_SALT || '' }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always start from the production branch. A workflow dispatched
          # from another ref must not execute unmerged code with R2 secrets.
          ref: ${{ github.event.repository.default_branch }}
          # Marker lineage may span skipped/cancelled workflow revisions.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select exact target revision
        shell: bash
        run: |
          if [[ ! "$PREWARM_TARGET_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "target_revision must be an exact 40-character lowercase SHA" >&2
            exit 1
          fi
          if [[ -n "$PREWARM_HANDOFF_TOKEN" && ! "$PREWARM_HANDOFF_TOKEN" =~ ^[a-f0-9]{32}$ ]]; then
            echo "handoff_token must be empty or 32 lowercase hexadecimal characters" >&2
            exit 1
          fi
          git check-ref-format --branch "$PREWARM_DEFAULT_BRANCH" >/dev/null
          default_tip=$(git rev-parse "refs/remotes/origin/$PREWARM_DEFAULT_BRANCH")
          if ! git merge-base --is-ancestor "$PREWARM_TARGET_REVISION" "$default_tip"; then
            echo "target_revision must be in the production branch history" >&2
            exit 1
          fi
          git switch --detach "$PREWARM_TARGET_REVISION"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Render and upload missing cards
        shell: bash
        run: |
          if [[ ! "$PREWARM_CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
            echo "concurrency must be a positive integer" >&2
            exit 1
          fi
          if (( PREWARM_CONCURRENCY > 4 )); then
            echo "concurrency must not exceed 4" >&2
            exit 1
          fi
          if [[ -n "$PREWARM_MAX_COMPANIES" && ! "$PREWARM_MAX_COMPANIES" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_companies must be empty or a positive integer" >&2
            exit 1
          fi
          max_planned_writes=1000
          max_put_attempts=3000
          if [[ "$PREWARM_FULL_REBUILD" == "true" ]]; then
            if [[ "$PREWARM_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "full rebuilds are manual-only" >&2
              exit 1
            fi
            if [[ "$PREWARM_FULL_REBUILD_CONFIRMATION" != "REBUILD-COMPANY-OG" ]]; then
              echo "full rebuild confirmation must be REBUILD-COMPANY-OG" >&2
              exit 1
            fi
            # Enough for the current ~23k matrix, but still a hard fail-closed cap.
            max_planned_writes=30000
            max_put_attempts=90000
          fi

          args=(
            --yes
            --concurrency "$PREWARM_CONCURRENCY"
            --target-revision "$PREWARM_TARGET_REVISION"
            --max-planned-writes "$max_planned_writes"
            --max-put-attempts "$max_put_attempts"
          )
          if [[ -n "$PREWARM_MAX_COMPANIES" ]]; then
            args+=(--max-companies "$PREWARM_MAX_COMPANIES")
          fi
          if [[ "$PREWARM_FULL_REBUILD" == "true" ]]; then
            args+=(
              --full-rebuild
              --approve-full-rebuild "$PREWARM_FULL_REBUILD_CONFIRMATION"
            )
          fi

          pnpm --filter @jobseek/web og:prewarm -- "${args[@]}"
