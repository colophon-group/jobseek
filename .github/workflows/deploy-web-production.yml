name: Deploy web production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Optional exact main revision to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy cumulative web delta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_ALIAS: jseek.co
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Classify the cumulative undeployed delta
        id: paths
        env:
          REQUESTED_SHA: ${{ inputs.revision }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          current_sha="$current_main"
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Invalid requested revision: $REQUESTED_SHA" >&2
              exit 1
            fi
            if [[ "$current_main" != "$REQUESTED_SHA" ]]; then
              echo "Requested revision $REQUESTED_SHA is stale; main is $current_main" >&2
              exit 1
            fi
            current_sha="$REQUESTED_SHA"
          fi
          production="$(pnpm dlx vercel@59.3.0 api \
            "/v13/deployments/$PRODUCTION_ALIAS?teamId=$VERCEL_ORG_ID" \
            --raw --token="$VERCEL_TOKEN")"
          production_sha="$(jq -r '.gitSource.sha // .meta.githubCommitSha // ""' <<<"$production")"
          if [[ ! "$production_sha" =~ ^[a-f0-9]{40}$ ]]; then
            production_sha=0000000000000000000000000000000000000000
          fi
          git fetch --no-tags origin "$current_sha"
          result="$(node .github/scripts/classify-vercel-web-change.mjs \
            "$production_sha" "$current_sha")"
          deploy="$(jq -r '.deploy' <<<"$result")"
          relevant="$(jq -r '.relevant | join(", ")' <<<"$result")"
          {
            echo "deploy=$deploy"
            echo "current_sha=$current_sha"
            echo "production_sha=$production_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Web deployment required: $deploy (${relevant:-no web inputs})"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.paths.outputs.deploy == 'true'
        with:
          ref: ${{ steps.paths.outputs.current_sha }}
          persist-credentials: false

      - name: Install locked dependencies
        if: steps.paths.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Require production database at checked-out migration head
        if: steps.paths.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate:verify-head

      - name: Pull production project settings
        if: steps.paths.outputs.deploy == 'true'
        run: >-
          pnpm dlx vercel@59.3.0 pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Require stable Server Action encryption
        if: steps.paths.outputs.deploy == 'true'
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: node .github/scripts/verify-vercel-server-action-key.mjs

      - name: Build the production artifact
        if: steps.paths.outputs.deploy == 'true'
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: >-
          pnpm dlx vercel@59.3.0 build
          --prod
          --token="$VERCEL_TOKEN"

      - name: Stage without assigning production domains
        if: steps.paths.outputs.deploy == 'true'
        id: stage
        env:
          COMMIT_SHA: ${{ steps.paths.outputs.current_sha }}
          COMMIT_REF: main
        run: |
          deployment="$(pnpm dlx vercel@59.3.0 deploy \
            --prebuilt --prod --skip-domain --archive=tgz --format=json \
            --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$COMMIT_SHA" \
            --meta githubCommitRef="$COMMIT_REF" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubRepo="${GITHUB_REPOSITORY#*/}")"
          url="$(jq -r '.url' <<<"$deployment")"
          id="$(jq -r '.id' <<<"$deployment")"
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]
          [[ "$id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Staged $id at $url"

      - name: Verify staged production functionality
        if: steps.paths.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          pnpm dlx vercel@59.3.0 inspect "$DEPLOYMENT_URL" \
            --wait --timeout=5m --token="$VERCEL_TOKEN"
          for path in \
            /en/explore?wm=remote\&q=python \
            /en/company/securitas-ag \
            /en/sign-in; do
            status="$(pnpm dlx vercel@59.3.0 curl "$path" \
              --deployment="$DEPLOYMENT_URL" \
              -- --silent --show-error --output /dev/null --write-out '%{http_code}')"
            echo "Smoke $path -> HTTP $status"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Staged smoke failed::$path returned HTTP $status"
              exit 1
            fi
          done
          umask 077
          scanner_headers="$(mktemp "$RUNNER_TEMP/vercel-scanner-headers.XXXXXX")"
          chmod 600 "$scanner_headers"
          trap 'rm -f -- "$scanner_headers"' EXIT
          scanner_status="$(pnpm dlx vercel@59.3.0 curl /wp-admin/setup-config.php \
            --deployment="$DEPLOYMENT_URL" \
            -- --location --silent --show-error \
            --dump-header "$scanner_headers" \
            --output /dev/null --write-out '%{http_code}')"
          echo "Smoke /wp-admin/setup-config.php -> HTTP $scanner_status after redirects"
          if ! node .github/scripts/verify-vercel-scanner-response.mjs \
            "$scanner_status" "$scanner_headers"; then
            echo "::error title=Scanner path exposed::Rejected final HTTP $scanner_status"
            exit 1
          fi
          rm -f -- "$scanner_headers"
          trap - EXIT

      - name: Require the staged revision is still main
        if: steps.paths.outputs.deploy == 'true'
        env:
          EXPECTED_SHA: ${{ steps.paths.outputs.current_sha }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
            echo "Refusing promotion for stale revision $EXPECTED_SHA; main is $current_main" >&2
            exit 1
          fi

      - name: Reverify production migration head immediately before promotion
        if: steps.paths.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate:verify-head

      - name: Promote only if this SHA is still main
        if: steps.paths.outputs.deploy == 'true'
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          EXPECTED_SHA: ${{ steps.paths.outputs.current_sha }}
          REQUIRE_EXACT_PROMOTION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision != '' }}
        run: |
          echo "promoted=false" >> "$GITHUB_OUTPUT"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
            echo "Skipping stale staged deployment: expected $EXPECTED_SHA, main is $current_main"
            if [[ "$REQUIRE_EXACT_PROMOTION" == "true" ]]; then
              echo "The requested company revision was not promoted" >&2
              exit 1
            fi
            exit 0
          fi
          pnpm dlx vercel@59.3.0 promote "$DEPLOYMENT_URL" \
            --yes --timeout=3m --token="$VERCEL_TOKEN"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Verify the promoted deployment owns production
        if: steps.promote.outputs.promoted == 'true'
        env:
          EXPECTED_SHA: ${{ steps.paths.outputs.current_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.stage.outputs.id }}
          EXPECTED_DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          node .github/scripts/verify-vercel-promotion.mjs

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          git fetch --no-tags origin "$current_main"
          result="$(node .github/scripts/classify-vercel-web-change.mjs \
            "$EXPECTED_SHA" "$current_main")"
          deploy="$(jq -r '.deploy' <<<"$result")"
          relevant="$(jq -r '.relevant | join(", ")' <<<"$result")"
          if [[ "$deploy" == "true" ]]; then
            message="Promoted $EXPECTED_SHA ($EXPECTED_DEPLOYMENT_ID), but main $current_main now contains web inputs: $relevant"
            echo "::error title=Web change landed during Vercel promotion::$message. Staged URL: $EXPECTED_DEPLOYMENT_URL"
            {
              echo "## Web change landed during Vercel promotion"
              echo
              echo "- Promoted SHA: \`$EXPECTED_SHA\`"
              echo "- Current main SHA: \`$current_main\`"
              echo "- Deployment: \`$EXPECTED_DEPLOYMENT_ID\` ($EXPECTED_DEPLOYMENT_URL)"
              echo "- New web inputs: \`$relevant\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Production remains current for web inputs at main $current_main"
