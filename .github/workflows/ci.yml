      - name: Boundary gate (validateUrl/safeFetch)
        run: bash apps/murmur-shim/scripts/grep-validateurl-boundary.sh

  test-crawler:
    name: Test Crawler
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install frozen runtime-contract protoc
        working-directory: apps/crawler
        env:
          PROTOC_LINUX_X86_64_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          set -euo pipefail
          version="$(python -c 'import json; from pathlib import Path; value=json.loads(Path("contracts/v1/baseline/manifest.json").read_text())["generator"]; prefix="libprotoc "; assert value.startswith(prefix); print(value.removeprefix(prefix))')"
          test "$version" = "36.0"
          archive="$RUNNER_TEMP/protoc-$version-linux-x86_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-$version"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-linux-x86_64.zip"
          printf '%s  %s\n' "$PROTOC_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$protoc_root"
          "$protoc_root/bin/protoc" --version | grep -Fx "libprotoc $version"
          printf '%s\n' "$protoc_root/bin" >>"$GITHUB_PATH"

      - run: uv sync --group dev --extra enrich
        working-directory: apps/crawler

      - run: uv run pytest tests/ -v --ignore=tests/e2e/test_typesense_indexing.py
        working-directory: apps/crawler

      - name: Verify the web backup helper survives real Docker GC
        env:
          JOBSEEK_RUN_DOCKER_GC_INTEGRATION: "1"
          JOBSEEK_ALLOW_DESTRUCTIVE_DOCKER_GC_TEST: github-hosted-ephemeral-runner
        run: >-
          uv run pytest tests/test_web_postgresql_backup_image_gc.py -q
          -k real_docker_prune_retains_the_leased_digest
        working-directory: apps/crawler

      - name: Verify Redis noeviction write pressure
        run: |
          docker run --detach --name jobseek-redis-pressure \
            --publish 127.0.0.1:6380:6379 \
            redis:8-alpine \
            redis-server --maxmemory 8mb --maxmemory-policy noeviction --save ""
          for _ in {1..20}; do
            if docker exec jobseek-redis-pressure redis-cli ping | grep -qx PONG; then
              break
            fi
            sleep 1
          done
          uv run python ../../scripts/test-redis-noeviction-pressure.py \
            --url redis://127.0.0.1:6380/15
        working-directory: apps/crawler

      - name: Stop Redis pressure fixture
        if: always()
        run: docker rm --force jobseek-redis-pressure || true

  test-crawler-typesense-e2e:
    name: Test Crawler Typesense E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      typesense:
        image: typesense/typesense:27.1
        ports:
          - 8108:8108
        options: --tmpfs /data:rw
        env:
          TYPESENSE_API_KEY: local_dev_typesense_key
          TYPESENSE_DATA_DIR: /data
    env:
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_OPERATIONS_KEY: local_dev_typesense_key
      REQUIRE_TYPESENSE_E2E: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Typesense
        run: |
          for _ in {1..60}; do
            if curl -fsS http://localhost:8108/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          curl -fsS http://localhost:8108/health

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: uv sync --group dev
        working-directory: apps/crawler

      - run: uv run python ../../scripts/typesense-setup.py --force
        working-directory: apps/crawler

      - run: uv run pytest tests/e2e/test_typesense_indexing.py -v
        working-directory: apps/crawler

  test-crawler-postgres-cdc-e2e:
    name: Test Crawler PostgreSQL E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOCAL_DATABASE_URL: postgresql://crawler:crawler@localhost:5432/crawler
      REQUIRE_POSTGRES_E2E: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: uv sync --group dev
        working-directory: apps/crawler

      - run: uv run alembic -c src/migrations/alembic.ini upgrade head
        working-directory: apps/crawler

      - run: >-
          uv run pytest
          tests/e2e/test_postgres_cdc_commit_order.py
          tests/e2e/test_foreign_relisting.py
          tests/e2e/test_board_quarantine_backoff.py
          tests/e2e/test_labeller_sampling_plan.py
          tests/e2e/test_location_taxonomy_repair.py
          tests/e2e/test_postgres_pool_session_guards.py
          tests/e2e/test_durable_source_identity.py
          tests/e2e/test_merck_identity_migration.py
          tests/e2e/test_nw_provider_migration.py
          tests/e2e/test_umantis_provider_migration.py
          -v
        working-directory: apps/crawler

