name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, murmur-demo]
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number for path-aware bot retry"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-review:
    name: Dependency Review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
          # sharp already distributes libvips through these platform packages.
          # Keep the global LGPL deny-list and scope the established exception
          # to the binaries required for the patched sharp release.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64

  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Test observability rollback retention
        run: |
          python3 -m py_compile \
            deploy/observability/prune_rollbacks.py \
            deploy/observability/test_prune_rollbacks.py
          python3 deploy/observability/test_prune_rollbacks.py

      - name: Test repository scripts
        run: >
          node --test
          scripts/ci-workflow.test.mjs
          scripts/dependabot-health.test.mjs
          scripts/crawler-version.test.mjs
          scripts/crawler-runtime-contract.test.mjs
          scripts/crawler-host-hygiene.test.mjs
          scripts/docs-index.test.mjs
          scripts/dealroom-company-requests.test.mjs
          scripts/vercel-web-deploy-paths.test.mjs
          scripts/vercel-server-action-key.test.mjs
          scripts/vercel-smoke-response.test.mjs
          scripts/vercel-company-cache.test.mjs
          scripts/vercel-production-sha.test.mjs
          scripts/vercel-promotion-identity.test.mjs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - name: actionlint
        # GitHub added vulnerability-alerts in 2026; actionlint support is pending upstream.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'SC(2002|2086|2129)|unknown permission scope "vulnerability-alerts"'

      - name: zizmor
        run: uvx --from zizmor==1.26.1 zizmor --persona regular --min-severity medium --min-confidence high .github/workflows

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.manual-default.outputs.code || steps.manual-pr.outputs.code || steps.filter-combined.outputs.code }}
      crawler_code: ${{ steps.manual-default.outputs.crawler_code || steps.manual-pr.outputs.crawler_code || steps.filter-combined.outputs.crawler_code }}
      go_http_pilot: ${{ steps.manual-default.outputs.go_http_pilot || steps.manual-pr.outputs.go_http_pilot || steps.filter.outputs.go_http_pilot }}
      boards_csv: ${{ steps.manual-default.outputs.boards_csv || steps.manual-pr.outputs.boards_csv || steps.filter.outputs.boards_csv }}
      is_pr: ${{ steps.manual-default.outputs.is_pr || steps.manual-pr.outputs.is_pr || steps.pull-request.outputs.is_pr }}
      base_ref: ${{ steps.manual-default.outputs.base_ref || steps.manual-pr.outputs.base_ref || steps.pull-request.outputs.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Manual dispatch defaults
        id: manual-default
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr == ''
        run: |
          {
            echo "code=true"
            echo "crawler_code=false"
            echo "go_http_pilot=true"
            echo "boards_csv=false"
            echo "is_pr=false"
            echo "base_ref="
          } >> "$GITHUB_OUTPUT"

      - name: Classify manually dispatched PR paths
        id: manual-pr
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr != ''
        run: .github/scripts/classify-pr-paths.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr }}

      - name: Record pull request context
        id: pull-request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "is_pr=true"
            echo "base_ref=$BASE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/dependabot.yml'
              - '!.github/dependabot.yaml'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/DISCUSSION_TEMPLATE/**'
              - '!apps/crawler/data/**'
              - '!apps/crawler/traces/**'
              - '!apps/crawler/tests/lightpanda/fixtures/census.json'
              - '!apps/crawler/VERSION'
            crawler_code:
              - 'apps/crawler/**'
              - '!**/*.md'
              - '!apps/crawler/data/**'
              - '!apps/crawler/traces/**'
              - '!apps/crawler/tests/lightpanda/fixtures/census.json'
              - '!apps/crawler/VERSION'
            crawler_runtime_boundary:
              - '{apps/crawler/data/{industries,occupations,seniority,technologies}.csv,scripts/{derive-crawler-runtime-contract.mjs,verify-crawler-release-bridge.py}}'
            go_http_pilot:
              - '{pilots/go-http-sitemap/**,.github/workflows/crawler-go-sitemap-shadow.yml,.github/workflows/crawler-sitemap-fleet-benchmark.yml,apps/crawler/Dockerfile,apps/crawler/uv.lock,apps/crawler/data/boards.csv,apps/crawler/src/core/__init__.py,apps/crawler/src/core/monitor.py,apps/crawler/src/core/monitors/raw.py,apps/crawler/src/core/monitors/sitemap.py,apps/crawler/src/shared/__init__.py,apps/crawler/src/shared/ssrf.py,apps/crawler/src/shared/tdm.py}'
            boards_csv:
              - 'apps/crawler/data/boards.csv'

      - name: Combine crawler runtime-boundary classification
        id: filter-combined
        if: github.event_name != 'workflow_dispatch'
        env:
          CODE: ${{ steps.filter.outputs.code }}
          CRAWLER_CODE: ${{ steps.filter.outputs.crawler_code }}
          CRAWLER_RUNTIME_BOUNDARY: ${{ steps.filter.outputs.crawler_runtime_boundary }}
        run: |
          set -euo pipefail
          if [[ "$CODE" == true || "$CRAWLER_RUNTIME_BOUNDARY" == true ]]; then
            echo 'code=true' >>"$GITHUB_OUTPUT"
          else
            echo 'code=false' >>"$GITHUB_OUTPUT"
          fi
          if [[ "$CRAWLER_CODE" == true || "$CRAWLER_RUNTIME_BOUNDARY" == true ]]; then
            echo 'crawler_code=true' >>"$GITHUB_OUTPUT"
          else
            echo 'crawler_code=false' >>"$GITHUB_OUTPUT"
          fi

  test-go-http-pilot:
    name: Test Go HTTP Sitemap Pilot
    needs: changes
    if: needs.changes.outputs.go_http_pilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pilots/go-http-sitemap/go.mod
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - name: Check formatting
        working-directory: pilots/go-http-sitemap
        run: test -z "$(find . -type f -name '*.go' -exec gofmt -l {} +)"

      - name: Test
        working-directory: pilots/go-http-sitemap
        run: go test ./...

      - name: Test race detector
        working-directory: pilots/go-http-sitemap
        run: go test -race ./...

      - name: Vet
        working-directory: pilots/go-http-sitemap
        run: go vet ./...

      - name: Check module metadata
        working-directory: pilots/go-http-sitemap
        run: go mod tidy -diff

      - name: Install Python comparator test dependencies
        working-directory: apps/crawler
        run: uv sync --group dev

      - name: Test Python comparator
        working-directory: apps/crawler
        run: |
          uv run python -m unittest discover -s ../../pilots/go-http-sitemap/python_shadow -p 'test_*.py'
          uv run python -m unittest discover -s ../../pilots/go-http-sitemap/benchmark -p 'test_report_wire.py'

      - name: Lint Python comparator
        working-directory: apps/crawler
        run: |
          uv run ruff check ../../pilots/go-http-sitemap/python_shadow ../../pilots/go-http-sitemap/benchmark/*.py
          uv run ruff format --check ../../pilots/go-http-sitemap/python_shadow ../../pilots/go-http-sitemap/benchmark/*.py
          uv run pyright --level error ../../pilots/go-http-sitemap/python_shadow/runner.py ../../pilots/go-http-sitemap/benchmark/report_wire.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ARM64 production shadow image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pilots/go-http-sitemap/Dockerfile.shadow
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            IMAGE_IDENTITY=ghcr.io/colophon-group/jobseek-go-sitemap-shadow:sha-${{ github.sha }}
          cache-from: type=gha,scope=go-sitemap-shadow
          cache-to: type=gha,mode=max,scope=go-sitemap-shadow,ignore-error=true

      - name: Build ARM64 resident stability shadow image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pilots/go-http-sitemap/Dockerfile.resident-shadow
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            IMAGE_IDENTITY=ghcr.io/colophon-group/jobseek-go-sitemap-resident-shadow:sha-${{ github.sha }}
          cache-from: type=gha,scope=go-sitemap-resident-shadow
          cache-to: type=gha,mode=max,scope=go-sitemap-resident-shadow,ignore-error=true

      - name: Build ARM64 Go fleet benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pilots/go-http-sitemap/Dockerfile.benchmark
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            IMAGE_IDENTITY=ghcr.io/colophon-group/jobseek-sitemap-fleet-go:sha-${{ github.sha }}
          cache-from: type=gha,scope=sitemap-fleet-go
          cache-to: type=gha,mode=max,scope=sitemap-fleet-go,ignore-error=true

      - name: Build ARM64 Python fleet benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pilots/go-http-sitemap/Dockerfile.python-benchmark
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            IMAGE_IDENTITY=ghcr.io/colophon-group/jobseek-sitemap-fleet-python:sha-${{ github.sha }}
          cache-from: type=gha,scope=sitemap-fleet-python
          cache-to: type=gha,mode=max,scope=sitemap-fleet-python,ignore-error=true

  test-go-b0-supervisor:
    name: Test Go Lightpanda B0 Supervisor
    needs: changes
    if: needs.changes.outputs.crawler_code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/crawler/go/lightpanda-b0-supervisor
    services:
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/crawler/go/lightpanda-b0-supervisor/go.mod
          cache-dependency-path: apps/crawler/go/lightpanda-b0-supervisor/go.sum

      - name: Test, race, vet, module metadata, and formatting
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

      - name: Test installed producer UDS against real Redis and Lua
        run: |
          set -euo pipefail
          # RUNNER_TEMP is private to the runner user; the installed producer
          # test drops to UID 10001 and needs a traversable parent directory.
          producer_binary="/tmp/lightpanda-b0-supervisor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          integration_binary="/tmp/lightpanda-b0-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.test"
          lua_fixture="/tmp/lightpanda-b0-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.lua"
          go build -o "$producer_binary" .
          chmod 0755 "$producer_binary"
          go test -c -tags=integration -o "$integration_binary" .
          chmod 0755 "$integration_binary"
          install -m 0644 ../../src/lua/lightpanda_b0_queue.lua "$lua_fixture"
          sudo install -d -m 0700 -o 10001 -g 10001 /run/jobseek-lightpanda-producer
          trap 'sudo rmdir /run/jobseek-lightpanda-producer; rm -f "$producer_binary" "$lua_fixture"' EXIT
          sudo env \
            LIGHTPANDA_B0_INTEGRATION_BINARY="$producer_binary" \
            LIGHTPANDA_B0_INTEGRATION_REDIS_URL=redis://localhost:6379/15 \
            LIGHTPANDA_B0_INTEGRATION_LUA_PATH="$lua_fixture" \
            LIGHTPANDA_B0_INTEGRATION_PRODUCER_UID=10001 \
            "$integration_binary" \
            -test.run '^(TestInstalledProducerOwnsRealRedisLifecycleAndFailsReadinessOnFence|TestRealRedisFullAuditAndCapacityBounds)$' \
            -test.count=1

      - name: Prove activated Redis authority survives a hard restart
        run: |
          set -euo pipefail
          integration_binary="/tmp/lightpanda-b0-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.test"
          redis_container=jobseek-b0-persistence-ci
          redis_volume=jobseek-b0-persistence-ci
          cleanup() {
            docker rm --force "$redis_container" >/dev/null 2>&1 || true
            docker volume rm "$redis_volume" >/dev/null 2>&1 || true
          }
          wait_for_redis() {
            for attempt in $(seq 1 30); do
              if docker exec "$redis_container" redis-cli ping | grep -qx PONG; then
                return 0
              fi
              ((attempt < 30)) || return 1
              sleep 1
            done
          }
          trap 'cleanup; rm -f "$integration_binary"' EXIT
          cleanup
          docker volume create "$redis_volume" >/dev/null
          docker run --detach --name "$redis_container" \
            --publish 127.0.0.1:6380:6379 \
            --mount "type=volume,source=$redis_volume,target=/data" \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            redis-server --save "" >/dev/null
          wait_for_redis
          LIGHTPANDA_B0_INTEGRATION_REDIS_URL=redis://127.0.0.1:6380/15 \
            "$integration_binary" -test.run '^TestRealRedisPersistenceSeed$' -test.count=1
          docker kill --signal KILL "$redis_container" >/dev/null
          docker rm "$redis_container" >/dev/null
          docker run --detach --name "$redis_container" \
            --publish 127.0.0.1:6380:6379 \
            --mount "type=volume,source=$redis_volume,target=/data" \
            redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 \
            redis-server --save "" >/dev/null
          wait_for_redis
          LIGHTPANDA_B0_INTEGRATION_REDIS_URL=redis://127.0.0.1:6380/15 \
            "$integration_binary" -test.run '^TestRealRedisPersistenceVerify$' -test.count=1

  test-go-r2-drain:
    name: Test Go R2 drain
    needs: changes
    if: needs.changes.outputs.crawler_code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/crawler/go/r2-drain
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/crawler/go/r2-drain/go.mod
          cache-dependency-path: apps/crawler/go/r2-drain/go.sum
      - name: Test real PostgreSQL transitions and R2 request contract
        env:
          TEST_DATABASE_URL: postgres://crawler:crawler@127.0.0.1:5432/crawler?sslmode=disable
        run: |
          go test -race ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

  crawler-image:
    name: Build Crawler Browser Image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.is_pr == 'true' && needs.changes.outputs.crawler_code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR merge provenance
        id: merge-provenance
        env:
          TESTED_BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          read -r commit parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$TESTED_BUILD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$parent_one"
          git merge-base --is-ancestor "$parent_one" origin/main
          test "$parent_two" = "$PR_HEAD_SHA"
          test -z "${extra:-}"
          test "$(git rev-parse HEAD)" = "$TESTED_BUILD_SHA"
          test "$(git rev-parse HEAD^1)" = "$parent_one"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          echo "base_sha=$parent_one" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Guard exact slim image build context
        env:
          TESTED_BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          read -r commit parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$TESTED_BUILD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$parent_one"
          git merge-base --is-ancestor "$parent_one" origin/main
          test "$parent_two" = "$PR_HEAD_SHA"
          test -z "${extra:-}"
          test "$(git rev-parse HEAD)" = "$TESTED_BUILD_SHA"
          test "$(git rev-parse HEAD^1)" = "$parent_one"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

      - name: Build slim crawler image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/crawler
          target: slim
          platforms: linux/amd64
          tags: jobseek-crawler-slim-ci:pr
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.colophon-group.jobseek.pr-head=${{ github.event.pull_request.head.sha }}
            com.colophon-group.jobseek.base=${{ steps.merge-provenance.outputs.base_sha }}
          load: true
          push: false
          cache-from: type=gha,scope=crawler-slim
          cache-to: type=gha,mode=max,scope=crawler-slim,ignore-error=true

      - name: Prove fresh producer volume initialization and client connectivity
        env:
          COMPOSE_PROJECT_NAME: jobseek-b0-volume-ci
          CRAWLER_IMAGE_REF: jobseek-crawler-slim-ci:pr
          BROWSER_IMAGE_REF: jobseek-crawler-slim-ci:pr
          LIGHTPANDA_B0_PRODUCER_COHORT: c1
          LIGHTPANDA_B0_ROUTING_EPOCH: "2"
          LIGHTPANDA_B0_CREDENTIAL_DIR: /tmp/jobseek-unused-credentials
          LOCAL_DATABASE_URL: postgresql://crawler:crawler@127.0.0.1:5432/crawler
          R2_ACCESS_KEY_ID: fixture
          R2_SECRET_ACCESS_KEY: fixture
          R2_ENDPOINT_URL: https://fixture.invalid
          R2_DOMAIN_URL: https://fixture.invalid
          R2_BUCKET: fixture
          TYPESENSE_HOST: fixture.invalid
          TYPESENSE_PORT: "8108"
          TYPESENSE_PROTOCOL: https
          TYPESENSE_OPERATIONS_KEY: fixture
          GRAFANA_PROM_URL: https://fixture.invalid
          GRAFANA_PROM_USERNAME: fixture
          GRAFANA_PROM_PASSWORD: fixture
          GRAFANA_LOKI_URL: https://fixture.invalid
          GRAFANA_LOKI_USERNAME: fixture
          GRAFANA_LOKI_PASSWORD: fixture
        run: |
          set -euo pipefail
          compose=(docker compose -f apps/crawler/docker-compose.yml -f apps/crawler/lightpanda-b0-enabled.override.yml)
          cleanup() {
            "${compose[@]}" down --remove-orphans --volumes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker run --rm --network host \
            -e LOCAL_DATABASE_URL -e CRAWLER_DB_ROLE=lightpanda-b0-ci-migration \
            jobseek-crawler-slim-ci:pr \
            uv run --no-sync alembic -c src/migrations/alembic.ini upgrade head
          epoch_json="$(docker run --rm --network host \
            -e LOCAL_DATABASE_URL -e CRAWLER_DB_ROLE=lightpanda-b0-ci-allocator \
            jobseek-crawler-slim-ci:pr \
            uv run --no-sync lightpanda-b0-activation reserve-epoch)"
          python3 -c \
            'import json,sys; assert json.loads(sys.argv[1]) == {"routing_epoch": 2}' \
            "$epoch_json"
          "${compose[@]}" config -q
          test -z "$(docker volume ls -q --filter name='^jobseek-lightpanda-b0-producer-socket$')"
          test -z "$(docker volume ls -q --filter name='^jobseek-lightpanda-b0-executor-socket$')"
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-producer-socket-init
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-executor-socket-init
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-executor-socket-init
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN \
            --mount \
              type=volume,source=jobseek-lightpanda-b0-executor-socket,target=/run/jobseek-lightpanda-executor \
            --entrypoint /bin/sh jobseek-crawler-slim-ci:pr \
            -eu -c 'chown 0:0 /run/jobseek-lightpanda-executor; test "$(stat -c "%u:%g:%a" /run/jobseek-lightpanda-executor)" = 0:0:700'
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-executor-socket-init
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN \
            --mount \
              type=volume,source=jobseek-lightpanda-b0-executor-socket,target=/run/jobseek-lightpanda-executor \
            --entrypoint /bin/sh jobseek-crawler-slim-ci:pr \
            -eu -c 'chown 0:0 /run/jobseek-lightpanda-executor; touch /run/jobseek-lightpanda-executor/unsafe'
          if timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-executor-socket-init; then
            echo "nonempty root:root/0700 executor volume was accepted" >&2
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN \
            --mount \
              type=volume,source=jobseek-lightpanda-b0-executor-socket,target=/run/jobseek-lightpanda-executor \
            --entrypoint /bin/sh jobseek-crawler-slim-ci:pr \
            -eu -c 'chmod 0755 /run/jobseek-lightpanda-executor'
          if timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps lightpanda-executor-socket-init; then
            echo "nonempty root:root/0755 executor volume was accepted" >&2
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN \
            --mount \
              type=volume,source=jobseek-lightpanda-b0-executor-socket,target=/run/jobseek-lightpanda-executor \
            --entrypoint /bin/sh jobseek-crawler-slim-ci:pr \
            -eu -c 'rm /run/jobseek-lightpanda-executor/unsafe; chmod 0700 /run/jobseek-lightpanda-executor; chown 10001:10001 /run/jobseek-lightpanda-executor'
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" up -d --no-deps --force-recreate lightpanda-producer
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" up -d --no-deps --force-recreate lightpanda-executor
          for service in lightpanda-producer lightpanda-executor; do
            container_id="$("${compose[@]}" ps -aq "$service")"
            if [[ -z "$container_id" ]]; then
              "${compose[@]}" ps -a
              "${compose[@]}" logs "$service"
              exit 1
            fi
            for attempt in $(seq 1 30); do
              state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              [[ "$state" == healthy ]] && break
              if [[ "$state" == exited || "$state" == dead ]] || ((attempt == 30)); then
                "${compose[@]}" logs "$service"
                exit 1
              fi
              sleep 1
            done
          done
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            "${compose[@]}" run --rm --no-deps \
            --entrypoint /app/.venv/bin/python worker-1 -c \
            'import asyncio; from src.lightpanda.producer_client import request_manifest; result = asyncio.run(request_manifest("c1")); assert result.board_slugs == ("browser-use-careers",)'

      - name: Guard exact full image build context
        env:
          TESTED_BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          read -r commit parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$TESTED_BUILD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$parent_one"
          git merge-base --is-ancestor "$parent_one" origin/main
          test "$parent_two" = "$PR_HEAD_SHA"
          test -z "${extra:-}"
          test "$(git rev-parse HEAD)" = "$TESTED_BUILD_SHA"
          test "$(git rev-parse HEAD^1)" = "$parent_one"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

      - name: Build full crawler image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/crawler
          target: full
          platforms: linux/amd64
          tags: jobseek-crawler-ci:pr
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.colophon-group.jobseek.pr-head=${{ github.event.pull_request.head.sha }}
            com.colophon-group.jobseek.base=${{ steps.merge-provenance.outputs.base_sha }}
          load: true
          push: false
          cache-from: type=gha,scope=crawler-browser
          cache-to: type=gha,mode=max,scope=crawler-browser,ignore-error=true

      - name: Self-test sampler container probe
        run: python3 .github/scripts/crawler-sampler-container-smoke.py --self-test

      - name: Verify installed build info for all long-lived roles
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < apps/crawler/VERSION)"
          docker run --rm \
            --platform linux/amd64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler-slim-ci:pr \
            -I /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-installed

          misleading_version="$RUNNER_TEMP/misleading-crawler-VERSION"
          printf '0.13.111\n' >"$misleading_version"
          docker run --rm \
            --platform linux/amd64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --workdir /tmp \
            --mount \
              "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/scripts/verify-build-info-release.py,target=/tmp/verify-build-info-release.py,readonly" \
            --mount \
              "type=bind,source=$misleading_version,target=/app/VERSION,readonly" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler-slim-ci:pr \
            /tmp/verify-build-info-release.py \
            --expected-version "$expected_version" \
            --require-source-checkout \
            --expected-source-root /app

      - name: Test installed sync data-root contract
        run: |
          set -euo pipefail
          staged_data="$(mktemp -d)"
          trap 'rm -rf "$staged_data"' EXIT
          python3 - "$staged_data" <<'PY'
          import csv
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          csvs = {
              "companies.csv": (
                  [
                      "slug", "name", "website", "logo_url", "icon_url",
                      "logo_type", "industry", "employee_count_range",
                      "founded_year", "extras",
                  ],
                  {
                      "slug": "ci-staged", "name": "CI Staged",
                      "website": "https://ci.invalid", "logo_type": "wordmark",
                      "industry": "901", "employee_count_range": "1",
                      "founded_year": "2026", "extras": "{}",
                  },
              ),
              "boards.csv": (
                  [
                      "company_slug", "board_slug", "board_url", "monitor_type",
                      "monitor_config", "scraper_type", "scraper_config",
                  ],
                  {
                      "company_slug": "ci-staged", "board_slug": "ci-staged",
                      "board_url": "https://ci.invalid/jobs",
                      "monitor_type": "greenhouse", "monitor_config": "{}",
                  },
              ),
              "occupation_domains.csv": (
                  ["slug", "en", "de", "fr", "it"],
                  {"slug": "sentinel-domain", "en": "Sentinel Domain"},
              ),
              "occupations.csv": (
                  [
                      "slug", "parent", "domain", "en", "de", "fr", "it",
                      "pl", "es", "nl", "pt", "cs", "sv", "hu", "ro", "bg",
                      "el", "da", "fi", "hr", "sk", "sl", "lt", "lv", "et",
                      "aliases",
                  ],
                  {
                      "slug": "sentinel-occupation", "domain": "sentinel-domain",
                      "en": "Sentinel Engineer", "aliases": "Sentinel Builder",
                  },
              ),
              "seniority.csv": (
                  ["slug", "en", "de", "fr", "it", "aliases"],
                  {"slug": "sentinel-seniority", "en": "Sentinel Seniority"},
              ),
              "industries.csv": (
                  ["id", "name", "keywords"],
                  {"id": "901", "name": "Sentinel Industry", "keywords": "sentinel"},
              ),
              "company_descriptions.csv": (
                  ["slug", "en", "de", "fr", "it"],
                  {"slug": "ci-staged", "en": "Sentinel description"},
              ),
              "technologies.csv": (
                  ["slug", "name", "category", "patterns", "flags"],
                  {
                      "slug": "sentinel-technology", "name": "Sentinel Technology",
                      "category": "other", "patterns": "SentinelTech",
                  },
              ),
          }
          for filename, (fieldnames, row) in csvs.items():
              with (root / filename).open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerow(row)
          PY

          docker run --rm -i \
            --platform linux/amd64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --mount "type=bind,source=$staged_data,target=/app/data,readonly" \
            --workdir /tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint /app/.venv/bin/python \
            jobseek-crawler-slim-ci:pr - <<'PY'
          import errno
          import sys
          from pathlib import Path

          from src import sync
          from src.cli import _resolve_ats_registry_paths
          from src.core import occupation_resolve, seniority_resolve, technology_resolve
          from src.core.enrich import company, taxonomy

          module_path = Path(sync.__file__).resolve()
          assert module_path.is_relative_to("/app/.venv")
          assert "site-packages" in module_path.parts
          assert "/app/src" not in sys.path
          assert Path.cwd() == Path("/tmp")
          assert sync.get_data_dir() == Path("/app/data")
          assert _resolve_ats_registry_paths(None, None) == (
              Path("/app/data/companies.csv"),
              Path("/app/data/boards.csv"),
          )
          sync._require_installed_sync_data_mount()
          assert sync._load_companies()["slug"].to_list() == ["ci-staged"]
          assert sync._load_boards()["board_slug"].to_list() == ["ci-staged"]
          assert sync._load_occupation_domains()["slug"].to_list() == ["sentinel-domain"]
          assert sync._load_occupations()["slug"].to_list() == ["sentinel-occupation"]
          assert sync._load_seniority()["slug"].to_list() == ["sentinel-seniority"]
          assert sync._load_industries()["id"].to_list() == ["901"]
          assert sync._load_company_descriptions()["slug"].to_list() == ["ci-staged"]
          assert sync._load_technologies()["slug"].to_list() == ["sentinel-technology"]
          assert occupation_resolve.match_occupation("Sentinel Builder") == "sentinel-occupation"
          assert seniority_resolve._load_seniority_slugs() == ["sentinel-seniority"]
          assert technology_resolve.match_technologies("We use SentinelTech.") == [
              "sentinel-technology"
          ]
          assert company.match_industry("Sentinel Industry") == 901
          assert taxonomy._load_tech_name_map() == {
              "sentinel technology": "sentinel-technology"
          }
          try:
              (Path("/app/data") / "write-probe").touch()
          except OSError as exc:
              assert exc.errno in {errno.EROFS, errno.EACCES}
          else:
              raise AssertionError("/app/data must be mounted read-only")
          PY

          if missing_output="$(
            docker run --rm \
              --platform linux/amd64 \
              --workdir /tmp \
              -e PYTHONDONTWRITEBYTECODE=1 \
              --entrypoint /app/.venv/bin/crawler \
              jobseek-crawler-slim-ci:pr \
              sync 2>&1
          )"; then
            echo 'ERROR: naturally unmounted installed crawler sync succeeded' >&2
            exit 1
          fi
          grep -Fq \
            'installed crawler sync requires /app/data to be a separate read-only mount' \
            <<<"$missing_output"

      - name: Smoke-test read-only crawler entry point
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint /app/.venv/bin/crawler \
            jobseek-crawler-ci:pr \
            --help >/dev/null

      - name: Exercise real sampler and container shutdown lifecycle
        env:
          TESTED_BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.merge-provenance.outputs.base_sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          EVIDENCE_PATH: ${{ runner.temp }}/crawler-sampler-container-smoke.json
        run: |
          python3 .github/scripts/crawler-sampler-container-smoke.py \
            --slim-image jobseek-crawler-slim-ci:pr \
            --full-image jobseek-crawler-ci:pr \
            --tested-build-sha "$TESTED_BUILD_SHA" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --source-url "$SOURCE_URL" \
            --metrics-port 19091 \
            --evidence "$EVIDENCE_PATH"

      - name: Upload sampler lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawler-sampler-container-smoke-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/crawler-sampler-container-smoke.json
          if-no-files-found: error
          retention-days: 14

  lint-web:
    name: Lint Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify-pnpm-config.mjs

      - run: pnpm lint

  i18n-coverage:
    name: i18n Coverage Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: bash scripts/check-i18n-coverage.sh

  lint-crawler:
    name: Lint Crawler
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: uv sync --group dev
        working-directory: apps/crawler

      - run: uv run ruff check src/ tests/
        working-directory: apps/crawler

      - run: uv run ruff format --check src/ tests/
        working-directory: apps/crawler

  type-python:
    name: Type Python
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: uv sync --group dev
        working-directory: apps/crawler

      - run: uv run pyright --level error
        working-directory: apps/crawler

  type-all:
    name: Type All
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo run typecheck has dependsOn: ["^build"], so @jseek/mcp-server
      # is built once and all consumers (apps/web) typecheck against the
      # built declarations. Covers every TS workspace in the monorepo.
      - run: pnpm --filter @jseek/mcp-server test

      - run: pnpm typecheck

  test-web:
    name: Test Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # `packages/mcp-server/package.json` has `"prepare": "tsc"`, so
    # `pnpm install --frozen-lockfile` below builds `dist/` automatically.
    # No explicit `pnpm --filter @jseek/mcp-server build` step is needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enforce zero-call blog mention build budget
        run: pnpm --filter @jobseek/web blog-mentions:check

      - name: Generate company Proxy exclusions
        run: pnpm --filter @jobseek/web proxy-matchers:update

      - run: >
          pnpm --filter @jobseek/web exec vitest run
          --exclude src/lib/search/__tests__/typesense.e2e.test.ts

      - run: pnpm --filter @jobseek/trace-viewer test

      - run: pnpm --filter @jobseek/trace-viewer build

  test-web-typesense-e2e:
    name: Test Web Typesense E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      typesense:
        image: typesense/typesense:27.1
        ports:
          - 8108:8108
        options: --tmpfs /data:rw
        env:
          TYPESENSE_API_KEY: local_dev_typesense_key
          TYPESENSE_DATA_DIR: /data
    env:
      REQUIRE_TYPESENSE_E2E: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Typesense
        run: |
          for _ in {1..60}; do
            if curl -fsS http://localhost:8108/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          curl -fsS http://localhost:8108/health

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @jobseek/web exec vitest run src/lib/search/__tests__/typesense.e2e.test.ts

  test-web-isr:
    # Slow lane: runs `pnpm build` once via the vitest globalSetup
    # (`apps/web/test-setup/run-prod-build.ts`) and asserts each
    # must-stay-cacheable route is classified with its expected glyph
    # (`◐ Partial Prerender` or `○ Static`) in Next 16's route summary.
    # Catches three classes the build itself cannot: parser drift if
    # Next's stdout shape changes, list rot if a route is removed, and
    # ◐↔○ classification drift (the build only fails on `→ ƒ`). See
    # #2885 (and incident #2243).
    name: Test Web ISR (slow)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-web-build-env
        with:
          app-url: http://localhost:3000

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` auto-builds `packages/mcp-server/dist/` via its
      # `prepare` script (`"prepare": "tsc"`), so no explicit build step
      # is needed. `pnpm test:isr` then runs `pnpm build` itself via
      # vitest globalSetup (`apps/web/test-setup/run-prod-build.ts`).
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @jobseek/web test:isr

  test-shim:
