  test-crawler:
    name: Test Crawler
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "apps/crawler/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install frozen runtime-contract protoc
        working-directory: apps/crawler
        env:
          PROTOC_LINUX_X86_64_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          set -euo pipefail
          version="$(python -c 'import json; from pathlib import Path; value=json.loads(Path("contracts/v1/baseline/manifest.json").read_text())["generator"]; prefix="libprotoc "; assert value.startswith(prefix); print(value.removeprefix(prefix))')"
          test "$version" = "36.0"
          archive="$RUNNER_TEMP/protoc-$version-linux-x86_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-$version"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-linux-x86_64.zip"
          printf '%s  %s\n' "$PROTOC_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$protoc_root"
          "$protoc_root/bin/protoc" --version | grep -Fx "libprotoc $version"
          printf '%s\n' "$protoc_root/bin" >>"$GITHUB_PATH"

      - run: uv sync --group dev --extra enrich
        working-directory: apps/crawler

      - run: uv run pytest tests/ -v --ignore=tests/e2e/test_typesense_indexing.py
        working-directory: apps/crawler

      - name: Verify the web backup helper survives real Docker GC
        env:
          JOBSEEK_RUN_DOCKER_GC_INTEGRATION: "1"
          JOBSEEK_ALLOW_DESTRUCTIVE_DOCKER_GC_TEST: github-hosted-ephemeral-runner
        run: >-
          uv run pytest tests/test_web_postgresql_backup_image_gc.py -q
          -k real_docker_prune_retains_the_leased_digest
        working-directory: apps/crawler

      - name: Verify Redis noeviction write pressure
        run: |
          docker run --detach --name jobseek-redis-pressure \
            --publish 127.0.0.1:6380:6379 \
            redis:8-alpine \
            redis-server --maxmemory 8mb --maxmemory-policy noeviction --save ""
          for _ in {1..20}; do
            if docker exec jobseek-redis-pressure redis-cli ping | grep -qx PONG; then
              break
            fi
            sleep 1
          done
          uv run python ../../scripts/test-redis-noeviction-pressure.py \
            --url redis://127.0.0.1:6380/15
        working-directory: apps/crawler

      - name: Stop Redis pressure fixture
        if: always()
        run: docker rm --force jobseek-redis-pressure || true

