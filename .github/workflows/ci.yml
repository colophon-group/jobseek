name: Typesense native full-corpus RSS rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typesense-native-rss-lab
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          # These preinstalled SDKs belong only to this disposable hosted VM.
          # They are unrelated to the benchmark and are never needed below.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          python - <<'PY'
          import pathlib, shutil
          assert shutil.disk_usage('/').free >= 30 * 1024**3, 'Need 30 GiB free for corpus and snapshots'
          mem = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          assert int(mem['MemAvailable'].split()[0]) >= 8 * 1024**2, 'Need 8 GiB available RAM'
          PY
          python -m pip install --disable-pip-version-check typesense==2.0.0 httpx==0.28.1 structlog==26.1.0
      - name: Retrieve private encrypted test corpus
        env:
          LAB_TRANSFER: ${{ secrets.TYPESENSE_RSS_LAB_20260924_TRANSFER }}
        run: python scripts/typesense-rss-transfer.py
      - name: Rehearse migration and rollback at full cardinality
        shell: bash
        run: |
          set -euo pipefail
          python scripts/typesense-rss-suite.py --root "$RUNNER_TEMP/rss-lab" --input "$RUNNER_TEMP/rss-input" 2>&1 | tee "$RUNNER_TEMP/rss-run.log"
      - name: Preserve measurements only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typesense-native-rss-measurements
          path: |
            ${{ runner.temp }}/rss-lab/*.json
            ${{ runner.temp }}/rss-run.log
          if-no-files-found: warn
          retention-days: 14
