              "TYPESENSE_HOST": ${{ toJSON(secrets.TYPESENSE_HOST) }},
              "TYPESENSE_OPERATIONS_KEY": ${{ toJSON(secrets.TYPESENSE_OPERATIONS_KEY) }},
              "TYPESENSE_PORT": ${{ toJSON(secrets.TYPESENSE_PORT) }},
              "TYPESENSE_PROTOCOL": ${{ toJSON(secrets.TYPESENSE_PROTOCOL) }},
              "TYPESENSE_SEARCH_KEY": ${{ toJSON(secrets.TYPESENSE_SEARCH_KEY) }},
              "VERCEL_AUTOMATION_BYPASS_SECRET": ${{ toJSON(secrets.VERCEL_AUTOMATION_BYPASS_SECRET) }},
              "VERCEL_ORG_ID": ${{ toJSON(secrets.VERCEL_ORG_ID) }},
              "VERCEL_PROJECT_ID": ${{ toJSON(secrets.VERCEL_PROJECT_ID) }},
              "VERCEL_TOKEN": ${{ toJSON(secrets.VERCEL_TOKEN) }},
              "WEBSHARE_PROXY_URL": ${{ toJSON(secrets.WEBSHARE_PROXY_URL) }},
              "WEBSHARE_PROXY_URLS": ${{ toJSON(secrets.WEBSHARE_PROXY_URLS) }},
              "WEB_POSTGRES_AUDITOR_PASSWORD": ${{ toJSON(secrets.WEB_POSTGRES_AUDITOR_PASSWORD) }},
              "WEB_POSTGRES_OWNER_PASSWORD": ${{ toJSON(secrets.WEB_POSTGRES_OWNER_PASSWORD) }}
            }
        run: python3 scripts/migrate-secrets-to-doppler.py
      - name: Transfer production-migrations directly to the fixed Doppler inbox
        if: inputs.source == 'production-migrations'
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: >-
            {
              "DATABASE_URL_UNPOOLED": ${{ toJSON(secrets.DATABASE_URL_UNPOOLED) }}
            }
        run: python3 scripts/migrate-secrets-to-doppler.py
      - name: Transfer production-migration-drift directly to the fixed Doppler inbox
        if: inputs.source == 'production-migration-drift'
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: >-
            {
              "DATABASE_URL_READONLY": ${{ toJSON(secrets.DATABASE_URL_READONLY) }}
            }
        run: python3 scripts/migrate-secrets-to-doppler.py
