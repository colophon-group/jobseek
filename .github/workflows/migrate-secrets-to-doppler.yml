name: Migrate existing secrets to Doppler

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed current main SHA
        required: true
        type: string
      source:
        description: Existing secret scope to migrate
        required: true
        type: choice
        options:
          - repository
          - Production
          - production-migrations
          - production-migration-drift

permissions:
  contents: read

concurrency:
  group: jobseek-doppler-secret-import
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repository:
    if: inputs.source == 'repository'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind owner dispatch to reviewed current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate bounded transfer
        run: python3 scripts/test-migrate-secrets-to-doppler.py
      - name: Transfer directly to the fixed Doppler inbox
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: >-
            {
              "GHCR_PAT": ${{ toJSON(secrets.GHCR_PAT) }},
              "GRAFANA_METRICS_READ_URL": ${{ toJSON(secrets.GRAFANA_METRICS_READ_URL) }},
              "GRAFANA_METRICS_READ_USERNAME": ${{ toJSON(secrets.GRAFANA_METRICS_READ_USERNAME) }}
            }
        run: python3 scripts/migrate-secrets-to-doppler.py

  environment:
    if: inputs.source != 'repository'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.source }}
    steps:
      - name: Bind owner dispatch to reviewed current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate bounded transfer
        run: python3 scripts/test-migrate-secrets-to-doppler.py
      - name: Transfer Production directly to the fixed Doppler inbox
        if: inputs.source == 'Production'
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: >-
            {
              "AI_FILTER_CACHE_HMAC_SECRET": ${{ toJSON(secrets.AI_FILTER_CACHE_HMAC_SECRET) }},
              "AI_FILTER_REFRESH_SECRET": ${{ toJSON(secrets.AI_FILTER_REFRESH_SECRET) }},
              "ATS_INVENTORY_GITHUB_APP_ID": ${{ toJSON(secrets.ATS_INVENTORY_GITHUB_APP_ID) }},
              "ATS_INVENTORY_GITHUB_APP_INSTALLATION_ID": ${{ toJSON(secrets.ATS_INVENTORY_GITHUB_APP_INSTALLATION_ID) }},
              "ATS_INVENTORY_GITHUB_APP_PRIVATE_KEY": ${{ toJSON(secrets.ATS_INVENTORY_GITHUB_APP_PRIVATE_KEY) }},
              "CDP_ROUTES": ${{ toJSON(secrets.CDP_ROUTES) }},
              "CLOUDFLARE_DNS_API_TOKEN": ${{ toJSON(secrets.CLOUDFLARE_DNS_API_TOKEN) }},
              "CLOUDFLARE_TUNNEL_TOKEN": ${{ toJSON(secrets.CLOUDFLARE_TUNNEL_TOKEN) }},
              "COMPANY_REFERENCE_CANARY_EMAIL": ${{ toJSON(secrets.COMPANY_REFERENCE_CANARY_EMAIL) }},
              "COMPANY_REFERENCE_CANARY_PASSWORD": ${{ toJSON(secrets.COMPANY_REFERENCE_CANARY_PASSWORD) }},
              "COMPANY_REFERENCE_CANARY_USER_ID": ${{ toJSON(secrets.COMPANY_REFERENCE_CANARY_USER_ID) }},
              "CRAWLER_PRIVATE_IPV4": ${{ toJSON(secrets.CRAWLER_PRIVATE_IPV4) }},
              "DATABASE_URL": ${{ toJSON(secrets.DATABASE_URL) }},
              "DATABASE_URL_UNPOOLED": ${{ toJSON(secrets.DATABASE_URL_UNPOOLED) }},
              "FLY_API_TOKEN": ${{ toJSON(secrets.FLY_API_TOKEN) }},
              "GHCR_PAT": ${{ toJSON(secrets.GHCR_PAT) }},
              "GRAFANA_ALERTMANAGER_URL": ${{ toJSON(secrets.GRAFANA_ALERTMANAGER_URL) }},
              "GRAFANA_ALERTMANAGER_USERNAME": ${{ toJSON(secrets.GRAFANA_ALERTMANAGER_USERNAME) }},
              "GRAFANA_ALERT_EMAIL": ${{ toJSON(secrets.GRAFANA_ALERT_EMAIL) }},
              "GRAFANA_API_KEY": ${{ toJSON(secrets.GRAFANA_API_KEY) }},
              "GRAFANA_LOKI_PASSWORD": ${{ toJSON(secrets.GRAFANA_LOKI_PASSWORD) }},
              "GRAFANA_LOKI_URL": ${{ toJSON(secrets.GRAFANA_LOKI_URL) }},
              "GRAFANA_LOKI_USERNAME": ${{ toJSON(secrets.GRAFANA_LOKI_USERNAME) }},
              "GRAFANA_METRICS_READ_URL": ${{ toJSON(secrets.GRAFANA_METRICS_READ_URL) }},
              "GRAFANA_METRICS_READ_USERNAME": ${{ toJSON(secrets.GRAFANA_METRICS_READ_USERNAME) }},
              "GRAFANA_PROM_PASSWORD": ${{ toJSON(secrets.GRAFANA_PROM_PASSWORD) }},
              "GRAFANA_PROM_URL": ${{ toJSON(secrets.GRAFANA_PROM_URL) }},
              "GRAFANA_PROM_USERNAME": ${{ toJSON(secrets.GRAFANA_PROM_USERNAME) }},
              "GRAFANA_URL": ${{ toJSON(secrets.GRAFANA_URL) }},
              "HETZNER_API_TOKEN": ${{ toJSON(secrets.HETZNER_API_TOKEN) }},
              "HETZNER_BACKUP_KNOWN_HOSTS": ${{ toJSON(secrets.HETZNER_BACKUP_KNOWN_HOSTS) }},
              "HETZNER_CRAWLER_KNOWN_HOSTS": ${{ toJSON(secrets.HETZNER_CRAWLER_KNOWN_HOSTS) }},
              "HETZNER_HOST": ${{ toJSON(secrets.HETZNER_HOST) }},
