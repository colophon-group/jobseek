name: Migrate existing secrets to Doppler

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed current main SHA
        required: true
        type: string
      source:
        description: Existing secret scope to migrate
        required: true
        type: choice
        options:
          - repository
          - Production
          - production-migrations
          - production-migration-drift

permissions:
  contents: read

concurrency:
  group: jobseek-doppler-secret-import
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repository:
    if: inputs.source == 'repository'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind owner dispatch to reviewed current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate bounded transfer
        run: python3 scripts/test-migrate-secrets-to-doppler.py
      - name: Transfer directly to the fixed Doppler inbox
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: ${{ toJson(secrets) }}
        run: python3 scripts/migrate-secrets-to-doppler.py

  environment:
    if: inputs.source != 'repository'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.source }}
    steps:
      - name: Bind owner dispatch to reviewed current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate bounded transfer
        run: python3 scripts/test-migrate-secrets-to-doppler.py
      - name: Transfer directly to the fixed Doppler inbox
        env:
          MIGRATION_SOURCE: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_MIGRATION_IMPORT_TOKEN }}
          SOURCE_SECRETS: ${{ toJson(secrets) }}
        run: python3 scripts/migrate-secrets-to-doppler.py
