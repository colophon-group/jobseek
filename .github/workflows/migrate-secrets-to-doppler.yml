              "HETZNER_MURMUR_KNOWN_HOSTS": ${{ toJSON(secrets.HETZNER_MURMUR_KNOWN_HOSTS) }},
              "HETZNER_POSTGRES_BACKUP_CIPHER_PASS": ${{ toJSON(secrets.HETZNER_POSTGRES_BACKUP_CIPHER_PASS) }},
              "HETZNER_POSTGRES_HOST": ${{ toJSON(secrets.HETZNER_POSTGRES_HOST) }},
              "HETZNER_SSH_KEY": ${{ toJSON(secrets.HETZNER_SSH_KEY) }},
              "HETZNER_TYPESENSE_HOST": ${{ toJSON(secrets.HETZNER_TYPESENSE_HOST) }},
              "HETZNER_TYPESENSE_KNOWN_HOSTS": ${{ toJSON(secrets.HETZNER_TYPESENSE_KNOWN_HOSTS) }},
              "HETZNER_TYPESENSE_RESTIC_PASSWORD": ${{ toJSON(secrets.HETZNER_TYPESENSE_RESTIC_PASSWORD) }},
              "INDEXNOW_KEY": ${{ toJSON(secrets.INDEXNOW_KEY) }},
              "INDEXNOW_KEY_URL": ${{ toJSON(secrets.INDEXNOW_KEY_URL) }},
              "INDEXNOW_SITE_URL": ${{ toJSON(secrets.INDEXNOW_SITE_URL) }},
              "LIGHTPANDA_B0_CA_CERT_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_CA_CERT_PEM) }},
              "LIGHTPANDA_B0_CA_KEY_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_CA_KEY_PEM) }},
              "LIGHTPANDA_B0_CLIENT_CERT_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_CLIENT_CERT_PEM) }},
              "LIGHTPANDA_B0_CLIENT_KEY_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_CLIENT_KEY_PEM) }},
              "LIGHTPANDA_B0_SERVER_CERT_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_SERVER_CERT_PEM) }},
              "LIGHTPANDA_B0_SERVER_KEY_PEM": ${{ toJSON(secrets.LIGHTPANDA_B0_SERVER_KEY_PEM) }},
              "LIGHTPANDA_CDP_URL": ${{ toJSON(secrets.LIGHTPANDA_CDP_URL) }},
              "LOCAL_DATABASE_URL": ${{ toJSON(secrets.LOCAL_DATABASE_URL) }},
              "MURMUR_TOKEN": ${{ toJSON(secrets.MURMUR_TOKEN) }},
              "NARROWED_WORKER_DATABASE_PASSWORD": ${{ toJSON(secrets.NARROWED_WORKER_DATABASE_PASSWORD) }},
              "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY": ${{ toJSON(secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY) }},
              "NPM_TOKEN": ${{ toJSON(secrets.NPM_TOKEN) }},
              "PROXY_PROVIDER": ${{ toJSON(secrets.PROXY_PROVIDER) }},
              "R2_ACCESS_KEY_ID": ${{ toJSON(secrets.R2_ACCESS_KEY_ID) }},
              "R2_BUCKET": ${{ toJSON(secrets.R2_BUCKET) }},
              "R2_DOMAIN_URL": ${{ toJSON(secrets.R2_DOMAIN_URL) }},
              "R2_ENDPOINT_URL": ${{ toJSON(secrets.R2_ENDPOINT_URL) }},
              "R2_SECRET_ACCESS_KEY": ${{ toJSON(secrets.R2_SECRET_ACCESS_KEY) }},
              "TYPESAFE_AI_TOKEN": ${{ toJSON(secrets.TYPESAFE_AI_TOKEN) }},
              "TYPESENSE_ADMIN_KEY": ${{ toJSON(secrets.TYPESENSE_ADMIN_KEY) }},
