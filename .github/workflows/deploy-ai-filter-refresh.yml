name: Control Narrowed Worker (Hetzner)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Pause or install the standalone worker; verify reads persisted recovery state
        required: true
        default: pause
        type: choice
        options: [pause, activate, verify]
      watchlist_id:
        description: Watchlist UUID for read-only recovery verification
        required: false
        type: string
      revision:
        description: Exact current main SHA with a compatible web queue and migration head
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: jobseek-ai-filter-refresh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Bind owner dispatch to current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate the worker and credential transport
        run: |
          bash -n deploy/ai-filter-refresh/install-host.sh deploy/ai-filter-refresh/deploy-remote.sh deploy/ai-filter-refresh/pause-remote.sh deploy/ai-filter-refresh/pause-host.sh deploy/ai-filter-refresh/verify-remote.sh
          python3 -m unittest discover -s scripts -p 'test_ai_filter_refresh.py'
          systemd-analyze verify deploy/systemd/jobseek-ai-filter-refresh.service deploy/systemd/jobseek-ai-filter-refresh.timer
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: inputs.action == 'activate'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: inputs.action == 'activate'
        with:
          node-version: 24
          cache: pnpm
      - name: Build the standalone worker from the exact revision
        if: inputs.action == 'activate'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec tsx scripts/build-narrowed-worker.ts
      - name: Pull non-sensitive production settings
        if: inputs.action == 'activate'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@62.1.0 project inspect jobseek-web --scope viktor-shcherbakovs-projects --non-interactive
          pnpm dlx vercel@62.1.0 pull --yes --environment production
      - name: Verify migration head and prepare restricted worker credentials
        if: inputs.action == 'activate'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NARROWED_WORKER_DATABASE_PASSWORD: ${{ secrets.NARROWED_WORKER_DATABASE_PASSWORD }}
          TYPESAFE_AI_TOKEN: ${{ secrets.TYPESAFE_AI_TOKEN }}
          AI_FILTER_CACHE_HMAC_SECRET: ${{ secrets.AI_FILTER_CACHE_HMAC_SECRET }}
          NARROWED_RUNTIME_POLICY_JSON: ${{ vars.NARROWED_RUNTIME_POLICY_JSON }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_SEARCH_KEY: ${{ secrets.TYPESENSE_SEARCH_KEY }}
          R2_DOMAIN_URL: ${{ secrets.R2_DOMAIN_URL }}
          NARROWED_PRODUCTION_ENV_FILE: ${{ github.workspace }}/.vercel/.env.production.local
        run: |
          pnpm --dir apps/web db:migrate:verify-head
          pnpm --dir apps/web exec tsx scripts/prepare-narrowed-worker-config.ts "$RUNNER_TEMP/narrowed-worker.env"
      - name: Recheck current main before activation
        if: inputs.action == 'activate'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.revision }}
        run: test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - name: Install and activate the standalone worker over pinned SSH
        if: inputs.action == 'activate'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
          NARROWED_WORKER_ENV_FILE: ${{ runner.temp }}/narrowed-worker.env
          EXPECTED_SHA: ${{ inputs.revision }}
        run: bash deploy/ai-filter-refresh/deploy-remote.sh "$EXPECTED_SHA"
      - name: Pause only the Narrowed worker service and legacy timer over pinned SSH
        if: inputs.action == 'pause'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ inputs.revision }}
        run: bash deploy/ai-filter-refresh/pause-remote.sh "$EXPECTED_SHA"
      - name: Verify saved criteria and recovery through the protected endpoint
        if: inputs.action == 'verify'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ inputs.revision }}
          WATCHLIST_ID: ${{ inputs.watchlist_id }}
        run: bash deploy/ai-filter-refresh/verify-remote.sh "$EXPECTED_SHA" "$WATCHLIST_ID"
      - name: Remove temporary worker credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/narrowed-worker.env"
          rm -f -- .vercel/.env.production.local
