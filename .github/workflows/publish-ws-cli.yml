name: Publish ws-cli to PyPI

on:
  push:
    branches: [main]
    paths:
      - "apps/crawler/VERSION"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC for trusted publishing
      contents: read        # checkout
      attestations: write   # publish attestations
    environment:
      name: pypi
      url: https://pypi.org/p/jobseek-crawler-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install hatchling build

      - name: Build package
        working-directory: apps/crawler/ws-package
        run: python -m build --wheel

      - name: Smoke test built wheel in clean venv
        run: |
          python -m venv /tmp/ws-smoke
          /tmp/ws-smoke/bin/pip install apps/crawler/ws-package/dist/*.whl
          /tmp/ws-smoke/bin/python apps/crawler/ws-package/smoketest.py
          /tmp/ws-smoke/bin/ws --help
          /tmp/ws-smoke/bin/ws --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: apps/crawler/ws-package/dist/
          verbose: true
