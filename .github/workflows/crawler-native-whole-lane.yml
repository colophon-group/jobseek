name: Native ordinary whole-lane comparison

on:
  pull_request:
    paths:
      - apps/crawler/admission/native_lane/**
      - apps/crawler/go/**
      - apps/crawler/contracts/**
      - apps/crawler/src/lua/**
      - apps/crawler/Dockerfile
      - apps/crawler/VERSION
      - apps/crawler/docker-compose.yml
      - pilots/go-lightpanda/**
      - .github/workflows/crawler-native-whole-lane.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-whole-lane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Compare complete lanes (${{ matrix.architecture }}, ${{ matrix.input }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        input: [generated, captured]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      NATIVE_LANE_INPUT_MODE: ${{ matrix.input }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Check comparison fixture
        id: fixture
        working-directory: apps/crawler
        run: |
          uv sync --frozen --group dev
          NATIVE_LANE_INPUT_MODE=generated uv run --frozen pytest admission/native_lane -q
          uv run --frozen ruff check admission/native_lane
          uv run --frozen ruff format --check admission/native_lane
      - name: Build exact runtime and comparator images
        id: images
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          docker build --quiet --target native \
            --build-arg "CRAWLER_SOURCE_REVISION=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "native-lane-candidate:${source_sha}" apps/crawler
          docker build --quiet --target benchmark-browser \
            --build-arg "CRAWLER_SOURCE_REVISION=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "native-lane-control:${source_sha}" apps/crawler
          docker build --quiet --build-context contracts=apps/crawler/contracts \
            --build-context api-sniffer-monitor=apps/crawler/go/api-sniffer-monitor \
            --build-context dom-detail=apps/crawler/go/dom-detail \
            --build-context jsonld-detail=apps/crawler/go/jsonld-detail \
            --build-context publisher-policy=apps/crawler/go/publisher-policy \
            --build-arg "SOURCE_COMMIT=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --target service --tag "native-lane-renderer:${source_sha}" pilots/go-lightpanda
      - name: Compare identical complete work and resource use
        id: measurement
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          umask 077
          source_sha="$(git rev-parse HEAD)"
          native="$(docker image inspect --format '{{.Id}}' "native-lane-candidate:${source_sha}")"
          legacy="$(docker image inspect --format '{{.Id}}' "native-lane-control:${source_sha}")"
          renderer="$(docker image inspect --format '{{.Id}}' "native-lane-renderer:${source_sha}")"
          mkdir -p "${RUNNER_TEMP}/native-whole-lane"
          uv run --frozen python -m admission.native_lane.controller \
            --native-image "$native" --legacy-image "$legacy" \
            --renderer-image "$renderer" --source-sha "$source_sha" \
            --output "${RUNNER_TEMP}/native-whole-lane/report.json"
      - name: Expose bounded comparison report
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          IMAGES_OUTCOME: ${{ steps.images.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          REPORT_PATH: ${{ runner.temp }}/native-whole-lane/report.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_PATH"])
          report = json.loads(path.read_text()) if path.is_file() else {}
          arms = []
          for arm in report.get("arms", []):
              failure = arm.get("failure") or {}
              diagnostic = failure.get("diagnostic") or {}
              output, resource = arm.get("output") or {}, arm.get("resource") or {}
              groups = resource.get("groups") or {}
              arms.append({
                  "lane": arm.get("lane"), "stage": failure.get("stage"),
                  "class": failure.get("class"), "cleanup": arm.get("cleanup"),
                  "exit_code": diagnostic.get("exit_code"),
                  "driver_lines": diagnostic.get("driver_lines"),
                  "error_types": diagnostic.get("error_types"),
                  "progress": diagnostic.get("progress"),
                  "startup_diagnostics": arm.get("startup_diagnostics"),
                  "render_probe": arm.get("render_probe"),
                  "resident_render_probe": arm.get("resident_render_probe"),
                  "certificate_probe": arm.get("certificate_probe"),
                  "pair": arm.get("pair"), "postings": output.get("postings"),
                  "canonical_sha256": output.get("canonical_sha256"),
                  "completion_seconds": arm.get("completion_seconds"),
                  "modeled_eur_per_1000": arm.get("modeled_eur_per_1000_correct_postings"),
                  "resource": {key: resource.get(key) for key in (
                      "duration_seconds", "cpu_seconds", "samples",
                      "sampled_peak_working_memory_bytes", "retained_working_memory_bytes")},
                  "groups": {name: {key: values.get(key) for key in (
                      "mean_cpu_cores", "mean_working_memory_bytes")}
                      for name in ("crawler", "renderer", "postgresql", "typesense", "fixture")
                      if (values := groups.get(name)) is not None},
                  "services": [{key: row.get(key) for key in (
                      "service", "cpu_seconds", "startup_cpu_seconds", "lifetime_cpu_seconds",
                      "lifetime_memory_peak_bytes", "memory_limit_bytes")}
                      for row in resource.get("services", [])],
              })
          summary = {
              "complete": report.get("complete") is True,
              "source_revision": report.get("source_revision"),
              "runtime_contract_sha256": report.get("runtime_contract_sha256"),
              "workload_sha256": report.get("workload_sha256"),
              "canonical_parity": report.get("canonical_parity"),
              "images": {name: {key: image.get(key) for key in ("id", "architecture")}
                  for name in ("native", "legacy", "renderer")
                  if (image := report.get("images", {}).get(name)) is not None},
              "steps": {key: os.environ[key] for key in (
                  "FIXTURE_OUTCOME", "IMAGES_OUTCOME", "MEASUREMENT_OUTCOME")},
              "failure_class": report.get("failure_class"), "arms": arms,
          }
          message = json.dumps(summary, sort_keys=True, separators=(",", ":"))
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          level = "notice" if summary["complete"] else "error"
          print("::" + level + " title=Native whole-lane comparison::" + message)
          PY
      - name: Retain compact numeric comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-whole-lane-${{ matrix.architecture }}-${{ matrix.input }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-whole-lane/report.json
          if-no-files-found: warn
          retention-days: 1
