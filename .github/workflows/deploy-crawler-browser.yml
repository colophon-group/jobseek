name: Deploy Crawler (Hetzner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/**'
      - '!apps/crawler/data/**'
      - '!apps/crawler/traces/**'
      - '!apps/crawler/ws-package/**'
      - '!apps/crawler/*.md'
      - '!apps/crawler/**/*.md'
      # These taxonomies are read and process-cached by live workers, so they
      # require an image rollout even though the remaining CSVs are sync-only.
      - 'apps/crawler/data/industries.csv'
      - 'apps/crawler/data/occupations.csv'
      - 'apps/crawler/data/seniority.csv'
      - 'apps/crawler/data/technologies.csv'
      # Keep the deploy workflow self-triggered so policy changes exercise the
      # immutable-version and production rollout path they control (#5873).
      - '.github/workflows/deploy-crawler-browser.yml'
      - 'scripts/derive-crawler-runtime-contract.mjs'
      - 'scripts/verify-crawler-release-bridge.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: crawler-production-sync
  cancel-in-progress: false

jobs:
  murmur:
    runs-on: ubuntu-latest
    # GitHub permits at most 360 minutes for a hosted-runner job. This job is
    # intentionally separate from image builds so its entire budget is
    # available to cover one running concurrency predecessor plus this push's
    # selected Murmur run.
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
      run_attempt: ${{ steps.wait.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for same-revision murmur-shim deployment
        id: wait
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            apps/crawler/deploy.sh \
            apps/crawler/docker-compose.yml; then
            echo "This revision does not trigger the murmur-shim host workflow" >&2
            exit 0
          fi
          # A GitHub concurrency group has at most one running and one pending
          # run. With cancel-in-progress:false, this push can therefore wait
          # behind one predecessor. Each Murmur run has sequential 20-minute
          # build, 135-minute deploy, and 10-minute promotion bounds. Two such
          # runs consume at most 330 minutes; retain 20 minutes for checkout,
          # run discovery, and scheduling skew inside this dedicated 360-minute
          # job.
          deadline=$((SECONDS + 21000))
          murmur_ready=0
          murmur_run_id=""
          murmur_run_attempt=""
          while (( SECONDS < deadline )); do
            run="$({
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-murmur-shim.yml/runs" \
                -f head_sha="$GITHUB_SHA" \
                -f event=push \
                -f per_page=10
            } | jq -c '.workflow_runs | sort_by(.created_at) | last // empty')"
            if [[ -z "$run" ]]; then
              echo "Waiting for the same-revision murmur-shim workflow to appear" >&2
            elif [[ "$(jq -r '.status' <<<"$run")" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion' <<<"$run")"
              [[ "$conclusion" == "success" ]] || {
                echo "ERROR: same-revision murmur-shim workflow concluded ${conclusion}" >&2
                exit 1
              }
              jq -e \
                --arg sha "$GITHUB_SHA" \
                --arg branch "$GITHUB_REF_NAME" \
                '.head_sha == $sha and
                 .head_branch == $branch and
                 .event == "push" and
                 .path == ".github/workflows/deploy-murmur-shim.yml" and
                 .status == "completed" and
                 .conclusion == "success"' \
                <<<"$run" >/dev/null || {
                  echo "ERROR: malformed or mismatched same-revision Murmur workflow attestation" >&2
                  exit 1
                }
              echo "Same-revision murmur-shim deployment completed successfully" >&2
              murmur_run_id="$(jq -r '.id' <<<"$run")"
              murmur_run_attempt="$(jq -r '.run_attempt' <<<"$run")"
              [[ "$murmur_run_id" =~ ^[1-9][0-9]*$ ]] || {
                echo "ERROR: same-revision Murmur run has an invalid ID" >&2
                exit 1
              }
              [[ "$murmur_run_attempt" =~ ^[1-9][0-9]*$ ]] || {
                echo "ERROR: same-revision Murmur run has an invalid attempt" >&2
                exit 1
              }
              murmur_ready=1
              break
            else
              echo "Waiting for the same-revision murmur-shim deployment to complete" >&2
            fi
            sleep 15
          done
          (( murmur_ready )) || {
            echo "ERROR: timed out waiting for same-revision murmur-shim deployment" >&2
            exit 1
          }
          printf 'run_id=%s\n' "$murmur_run_id" >>"$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$murmur_run_attempt" >>"$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      slim_digest: ${{ steps.build-slim.outputs.digest }}
      browser_digest: ${{ steps.build-browser.outputs.digest }}
      reconciliation_wrapper_sha256: ${{ steps.reconciliation.outputs.wrapper_sha256 }}
      runtime_contract_sha256: ${{ steps.runtime-contract.outputs.runtime_contract_sha256 }}
      data_contract_sha256: ${{ steps.runtime-contract.outputs.data_contract_sha256 }}
      previous_runtime_contract_sha256: ${{ steps.runtime-contract.outputs.previous_runtime_contract_sha256 }}
      previous_data_contract_sha256: ${{ steps.runtime-contract.outputs.previous_data_contract_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive immutable build version
        id: version
        env:
          BASE_SHA: ${{ github.event.before }}
        run: >-
          node scripts/derive-crawler-build-version.mjs
          --base "$BASE_SHA"
          --write-version apps/crawler/VERSION
          --github-output "$GITHUB_OUTPUT"

      - name: Derive reconciliation wrapper contract
        id: reconciliation
        run: |
          set -euo pipefail
          printf 'wrapper_sha256=%s\n' \
            "$(sha256sum deploy/reconciliation/run.sh | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"

      - name: Derive crawler runtime contract
        id: runtime-contract
        env:
          PREVIOUS_REVISION: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node scripts/derive-crawler-runtime-contract.mjs \
            --revision "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
          node scripts/derive-crawler-runtime-contract.mjs \
            --kind data \
            --revision "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
          previous_runtime_contract_sha256="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --revision "$PREVIOUS_REVISION"
          )"
          previous_data_contract_sha256="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --kind data \
              --revision "$PREVIOUS_REVISION"
          )"
          printf 'previous_runtime_contract_sha256=%s\n' \
            "$previous_runtime_contract_sha256" >>"$GITHUB_OUTPUT"
          printf 'previous_data_contract_sha256=%s\n' \
            "$previous_data_contract_sha256" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image (worker, exporter, drain)
        id: build-slim
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/crawler
          target: slim
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobseek-crawler:${{ steps.version.outputs.image_tag }}
          cache-from: type=gha,scope=crawler-slim
          cache-to: type=gha,mode=max,scope=crawler-slim,ignore-error=true

      - name: Build and push browser image (full)
        id: build-browser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/crawler
          target: full
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobseek-crawler-browser:${{ steps.version.outputs.image_tag }}
          cache-from: type=gha,scope=crawler-browser
          cache-to: type=gha,mode=max,scope=crawler-browser,ignore-error=true

      # Dry-run setup-typesense against an ephemeral Typesense before
      # touching prod. Running it twice is the key bit — the second run
      # exercises the patch path on existing collections, which is what
      # silently broke a prod deploy and stopped the crawler. This step
      # gates the SSH deploy on the image's idempotency.
      - name: Smoke-test setup-typesense (idempotency)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jobseek-crawler@${{ steps.build-slim.outputs.digest }}
        run: |
          set -euo pipefail
          # Always tear down on exit, including on early failure, so a
          # leaked container doesn't poison subsequent steps or runs.
          trap 'docker logs ts-smoke 2>&1 | tail -50 || true; docker rm -f ts-smoke 2>/dev/null || true' EXIT

          # Typesense fails to start if --data-dir doesn't exist. Use a
          # tmpfs for a writable, ephemeral data dir without touching the
          # runner filesystem.
          docker run -d --name ts-smoke --network host \
            --tmpfs /data:rw \
            typesense/typesense:27.1@sha256:5c12af89130b8ee0be11541321ba8a3a7c7a538d7c6cd95e0409dc2d75ca6455 \
            --data-dir /data --api-key=smoke

          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8108/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: Typesense did not become healthy within 90s" >&2
            exit 1
          fi
          echo "Typesense ready"

          for run in first second; do
            echo "── setup-typesense smoke run: $run ──"
            docker run --rm --network host \
              -e TYPESENSE_HOST=localhost \
              -e TYPESENSE_PORT=8108 \
              -e TYPESENSE_PROTOCOL=http \
              -e TYPESENSE_OPERATIONS_KEY=smoke \
              "$IMAGE" \
              uv run --no-sync crawler setup-typesense
          done

  deploy:
    needs: [murmur, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR (read-only deploy token)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for same-revision murmur-shim deployment
        id: murmur
        env:
          GH_TOKEN: ${{ github.token }}
          MURMUR_RUN_ID: ${{ needs.murmur.outputs.run_id }}
          MURMUR_RUN_ATTEMPT: ${{ needs.murmur.outputs.run_attempt }}
        run: |
          set -euo pipefail
          murmur_run_id="$MURMUR_RUN_ID"
          murmur_run_attempt="$MURMUR_RUN_ATTEMPT"
          if [[ -z "$murmur_run_id" && -z "$murmur_run_attempt" ]]; then
            echo "This revision has no coupled Murmur release to validate" >&2
            exit 0
          fi
          [[ "$murmur_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: selected same-revision Murmur run has an invalid ID" >&2
            exit 1
          }
          [[ "$murmur_run_attempt" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: selected same-revision Murmur run has an invalid attempt" >&2
            exit 1
          }

          # Download the immutable release record from the exact successful
          # push run selected above. Never resolve the mutable revision tag
          # here: another workflow_dispatch run for the same Git SHA can replace
          # that tag without being the push run whose host deploy we attested.
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          gh run download "$murmur_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "murmur-release-${murmur_run_id}-${murmur_run_attempt}" \
            --dir "$artifact_dir"
          release_record="$artifact_dir/murmur-release.json"
          [[ -f "$release_record" && ! -L "$release_record" ]] || {
            echo "ERROR: exact-run Murmur release record is unavailable or unsafe" >&2
            exit 1
          }
          release_digest="$({
            jq -er \
              --argjson run_id "$murmur_run_id" \
              --argjson run_attempt "$murmur_run_attempt" \
              --arg head_sha "$GITHUB_SHA" '
                select(
                  type == "object" and
                  keys == ["event", "head_sha", "image_digest", "run_attempt", "run_id"] and
                  .run_id == $run_id and
                  .run_attempt == $run_attempt and
                  .head_sha == $head_sha and
                  .event == "push" and
                  (.image_digest | test("^sha256:[0-9a-f]{64}$"))
                ) |
                .image_digest
              ' "$release_record"
          })"
          [[ "$release_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: exact-run Murmur release record is malformed or mismatched" >&2
            exit 1
          }

          # Validate the exact recorded manifest, its OCI provenance, and the
          # one runnable/one provenance-manifest shape before exporting it. A
          # crawler retry downloads the same run-bound record even when host
          # rollback has restored the previous shim release.
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/jobseek-murmur-shim"
          revision_ref="${repository}@${release_digest}"
          manifest_json="$(
            docker buildx imagetools inspect "$revision_ref" \
              --format '{{json .Manifest}}'
          )"
          mapfile -t manifest_digests < <(
            jq -er --arg digest "$release_digest" '
              select(
                .schemaVersion == 2 and
                .mediaType == "application/vnd.oci.image.index.v1+json" and
                .digest == $digest and
                (.manifests | type == "array")
              ) |
              .digest
            ' <<<"$manifest_json"
          )
          [[ "${#manifest_digests[@]}" -eq 1 ]] || {
            echo "ERROR: recorded Murmur release resolved to zero or multiple manifest digests" >&2
            exit 1
          }
          mapfile -t runnable_digests < <(
            jq -er '
              .manifests[] |
              select(
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .platform.os == "linux" and
                .platform.architecture == "amd64" and
                ((.annotations["vnd.docker.reference.type"] // "") !=
                  "attestation-manifest") and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              ) |
              .digest
            ' <<<"$manifest_json"
          )
          [[ "${#runnable_digests[@]}" -eq 1 ]] || {
            echo "ERROR: recorded Murmur release contains zero or multiple linux/amd64 images" >&2
            exit 1
          }
          mapfile -t provenance_digests < <(
            jq -er --arg subject "${runnable_digests[0]}" '
              .manifests[] |
              select(
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] ==
                  "attestation-manifest" and
                .annotations["vnd.docker.reference.digest"] == $subject and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              ) |
              .digest
            ' <<<"$manifest_json"
          )
          [[ "${#provenance_digests[@]}" -eq 1 ]] || {
            echo "ERROR: recorded Murmur release contains zero or multiple SLSA provenance attestations" >&2
            exit 1
          }

          provenance_json="$(
            docker buildx imagetools inspect "$revision_ref" \
              --format '{{json .Provenance}}'
          )"
          jq -e --arg revision "$GITHUB_SHA" '
            type == "object" and
            keys == ["SLSA"] and
            (.SLSA | type == "object") and
            any(
              .SLSA | .. | strings;
              test("(^|[^0-9a-f])" + $revision + "([^0-9a-f]|$)")
            )
          ' <<<"$provenance_json" >/dev/null || {
            echo "ERROR: Murmur provenance does not attest the exact source revision" >&2
            exit 1
          }

          shim_image_ref="${repository}@${release_digest}"
          [[ "$shim_image_ref" =~ ^ghcr\.io/${GITHUB_REPOSITORY_OWNER}/jobseek-murmur-shim@sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: resolved Murmur image reference is malformed" >&2
            exit 1
          }
          printf 'image_ref=%s\n' "$shim_image_ref" >>"$GITHUB_OUTPUT"

      - name: Build exact pre-deploy CSV rollback candidate
        id: previous-data
        env:
          PREVIOUS_REVISION: ${{ github.event.before }}
          EXPECTED_PREVIOUS_RUNTIME_CONTRACT_SHA256: ${{ needs.build.outputs.previous_runtime_contract_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${PREVIOUS_REVISION}^{commit}")" = "$PREVIOUS_REVISION"
          git merge-base --is-ancestor "$PREVIOUS_REVISION" "$GITHUB_SHA"
          candidate_id="${PREVIOUS_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir="csv-publication/${candidate_id}"
          mkdir -p "$candidate_dir"
          previous_runtime_contract_sha256="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --revision "$PREVIOUS_REVISION" \
              --runtime-attestation-out "$candidate_dir/runtime-attestation.env"
          )"
          test "$previous_runtime_contract_sha256" = \
            "$EXPECTED_PREVIOUS_RUNTIME_CONTRACT_SHA256"
          git archive "$PREVIOUS_REVISION" apps/crawler/data |
            tar -C "$candidate_dir" -xf -
          mv "$candidate_dir/apps/crawler/data" "$candidate_dir/data-source"
          rm -rf "$candidate_dir/apps"
          find "$candidate_dir/data-source" -type f ! -name '*.csv' -delete
          find "$candidate_dir/data-source" -depth -type d -empty -delete
          mv "$candidate_dir/data-source" "$candidate_dir/data"
          python3 - "$candidate_dir/data" "$candidate_dir/data-files.sha256" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          rows = sorted(
              (path.relative_to(root).as_posix(), hashlib.sha256(path.read_bytes()).hexdigest())
              for path in root.rglob("*.csv")
              if path.is_file() and not path.is_symlink()
          )
          if not rows:
              raise SystemExit("pre-deploy CSV snapshot is empty")
          output.write_text(
              "".join(f"{digest}  {relative}\n" for relative, digest in rows),
              encoding="utf-8",
          )
          PY
          tar -C "$candidate_dir" -cf "$candidate_dir/csv-snapshot.tar" \
            data data-files.sha256 runtime-attestation.env
          printf 'candidate_id=%s\n' "$candidate_id" >>"$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' \
            "$(sha256sum "$candidate_dir/csv-snapshot.tar" | awk '{print $1}')" \
            >>"$GITHUB_OUTPUT"

      - name: Copy exact pre-deploy CSV rollback candidate
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: csv-publication/${{ steps.previous-data.outputs.candidate_id }}/csv-snapshot.tar
          target: /home/deploy/csv-candidates/${{ steps.previous-data.outputs.candidate_id }}/
          strip_components: 2

      - name: Copy deploy files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: apps/crawler/deploy.sh,apps/crawler/deploy_helpers.sh,apps/crawler/docker-compose.yml,apps/crawler/rollback-pool-budget.override.yml,apps/crawler/alloy.river,apps/crawler/scripts/postgresql-operational-preflight.py
          target: /home/deploy/incoming/
          strip_components: 2

      - name: Copy locked release-evidence helpers
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: scripts/crawler-csv-sync-host.sh,scripts/verify-crawler-release-bridge.py
          target: /home/deploy/incoming/scripts/
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Production Typesense schema alters are synchronous and can scan
          # 3.7M documents on the fixed 2-vCPU node. The action defaults to a
          # much shorter command timeout than the deploy job itself.
          command_timeout: 3h
          envs: OWNER,GHCR_PULL_USERNAME,GHCR_PULL_TOKEN,CRAWLER_IMAGE_TAG,CRAWLER_IMAGE_REF,BROWSER_IMAGE_REF,SHIM_IMAGE_REF,JOBSEEK_DEPLOY_REVISION,JOBSEEK_RUNTIME_CONTRACT_SHA256,JOBSEEK_DATA_CONTRACT_SHA256,JOBSEEK_PREVIOUS_DATA_REVISION,JOBSEEK_PREVIOUS_RUNTIME_CONTRACT_SHA256,JOBSEEK_PREVIOUS_DATA_CONTRACT_SHA256,JOBSEEK_PREVIOUS_DATA_CANDIDATE_ID,JOBSEEK_PREVIOUS_DATA_ARCHIVE_SHA256,JOBSEEK_RECONCILIATION_WRAPPER_SHA256,WEB_DATABASE_URL,LOCAL_DATABASE_URL,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ENDPOINT_URL,R2_DOMAIN_URL,R2_BUCKET,GRAFANA_PROM_URL,GRAFANA_PROM_USERNAME,GRAFANA_PROM_PASSWORD,GRAFANA_LOKI_URL,GRAFANA_LOKI_USERNAME,GRAFANA_LOKI_PASSWORD,TYPESENSE_HOST,TYPESENSE_PORT,TYPESENSE_PROTOCOL,TYPESENSE_OPERATIONS_KEY,PROXY_PROVIDER,WEBSHARE_PROXY_URLS,WEBSHARE_PROXY_URL,MURMUR_TOKEN
          script: bash /home/deploy/incoming/deploy.sh
        env:
          OWNER: ${{ github.repository_owner }}
          # Refresh the host's private-package credentials for every crawler
          # transaction. A token left by another workflow is job-scoped and
          # expires, so it cannot be a durable prerequisite for later deploys.
          GHCR_PULL_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          CRAWLER_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          CRAWLER_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/jobseek-crawler@${{ needs.build.outputs.slim_digest }}
          BROWSER_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/jobseek-crawler-browser@${{ needs.build.outputs.browser_digest }}
          # Empty for ordinary crawler-only revisions, in which case deploy.sh
          # requires the live env/container pair to agree. Coupled Murmur
          # revisions always carry the attested same-head digest explicitly,
          # including on a crawler workflow retry after rollback.
          SHIM_IMAGE_REF: ${{ steps.murmur.outputs.image_ref }}
          JOBSEEK_DEPLOY_REVISION: ${{ github.sha }}
          JOBSEEK_RUNTIME_CONTRACT_SHA256: ${{ needs.build.outputs.runtime_contract_sha256 }}
          JOBSEEK_DATA_CONTRACT_SHA256: ${{ needs.build.outputs.data_contract_sha256 }}
          JOBSEEK_PREVIOUS_DATA_REVISION: ${{ github.event.before }}
          JOBSEEK_PREVIOUS_RUNTIME_CONTRACT_SHA256: ${{ needs.build.outputs.previous_runtime_contract_sha256 }}
          JOBSEEK_PREVIOUS_DATA_CONTRACT_SHA256: ${{ needs.build.outputs.previous_data_contract_sha256 }}
          JOBSEEK_PREVIOUS_DATA_CANDIDATE_ID: ${{ steps.previous-data.outputs.candidate_id }}
          JOBSEEK_PREVIOUS_DATA_ARCHIVE_SHA256: ${{ steps.previous-data.outputs.archive_sha256 }}
          JOBSEEK_RECONCILIATION_WRAPPER_SHA256: ${{ needs.build.outputs.reconciliation_wrapper_sha256 }}
          # Keep the retained web-owned watchlist boundary separately named
          # inside crawler operations. Reuse the existing provider-neutral
          # protected DB secret without exposing it as crawler DATABASE_URL.
          WEB_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          LOCAL_DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_DOMAIN_URL: ${{ secrets.R2_DOMAIN_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USERNAME: ${{ secrets.GRAFANA_PROM_USERNAME }}
          GRAFANA_PROM_PASSWORD: ${{ secrets.GRAFANA_PROM_PASSWORD }}
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USERNAME: ${{ secrets.GRAFANA_LOKI_USERNAME }}
          GRAFANA_LOKI_PASSWORD: ${{ secrets.GRAFANA_LOKI_PASSWORD }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_OPERATIONS_KEY: ${{ secrets.TYPESENSE_OPERATIONS_KEY }}
          # Runtime proxy connection secrets only — see src/shared/proxy.py.
          # WEBSHARE_API_KEY is intentionally operator-only and is never sent
          # to crawler containers. PROXY_PROVIDER=none is the explicit off
          # switch; a selected provider with no usable URL fails closed.
          PROXY_PROVIDER: ${{ secrets.PROXY_PROVIDER }}
          WEBSHARE_PROXY_URLS: ${{ secrets.WEBSHARE_PROXY_URLS }}
          WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
          # IndexNow notifier was retired in #2821 (companies left the
          # index). The GitHub secrets INDEXNOW_KEY/SITE_URL/KEY_URL/
          # INTERVAL are no longer forwarded; deleting them from the
          # secret store is a separate cleanup once the change is rolled
          # out and we're confident we won't revive the loop.
          # Required since H3 (#2775) added the murmur-shim service to
          # the crawler-box compose. deploy.sh validates this var; the
          # shim's `${MURMUR_TOKEN}` env-substitution would otherwise
          # resolve to empty on a full-stack redeploy and the shim
          # would silently accept every request as anonymous.
          MURMUR_TOKEN: ${{ secrets.MURMUR_TOKEN }}

  promote:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote deployed images to latest
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          docker buildx imagetools create \
            -t "ghcr.io/${owner}/jobseek-crawler:latest" \
            "ghcr.io/${owner}/jobseek-crawler@${{ needs.build.outputs.slim_digest }}"
          docker buildx imagetools create \
            -t "ghcr.io/${owner}/jobseek-crawler-browser:latest" \
            "ghcr.io/${owner}/jobseek-crawler-browser@${{ needs.build.outputs.browser_digest }}"
