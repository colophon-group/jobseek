name: Refresh currency rates

on:
  schedule:
    # ECB publishes reference rates on TARGET business days around 16:00 CET.
    # Weekly is enough for salary filters and keeps the local lookup fresh.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-currency-rates
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GITHUB_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            NAME="crawler-refresh-currency-rates-$(date -u +%Y%m%dT%H%M%SZ)"
            RUNTIME_ENV="$(mktemp /run/lock/jobseek-currency-refresh-env.XXXXXX)"
            trap 'rm -f "$RUNTIME_ENV"' EXIT HUP INT TERM
            chmod 0600 "$RUNTIME_ENV"
            mapfile -t matches < <(grep -E '^LOCAL_DATABASE_URL=' /home/deploy/.env || true)
            if [[ ${#matches[@]} -ne 1 || -z "${matches[0]#*=}" ]]; then
              echo "ERROR: required currency refresh variable LOCAL_DATABASE_URL is missing or duplicated" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}" >"$RUNTIME_ENV"
            printf '%s\n' \
              'CRAWLER_DB_ROLE=currency-refresh' \
              'CRAWLER_DB_POOL_MIN=0' \
              'CRAWLER_DB_POOL_MAX=4' \
              'CRAWLER_DB_POOL_IDLE_SECONDS=60' >>"$RUNTIME_ENV"
            tag="$(grep -E '^CRAWLER_IMAGE_TAG=' /home/deploy/.env 2>/dev/null | tail -n1 | cut -d= -f2- || true)"
            tag="${tag:-latest}"
            /usr/local/sbin/jobseek-maintenance oneoff \
              --operation refresh-currency-rates \
              --issue 3576 \
              --revision "$GITHUB_SHA" \
              --budget-seconds 600 \
              --lock-timeout-seconds 600 \
              -- \
              docker run --rm \
              --name "$NAME" \
              --env-file "$RUNTIME_ENV" \
              --network host \
              "ghcr.io/colophon-group/jobseek-crawler:${tag}" \
              uv run --no-sync crawler refresh-currency-rates
