name: Operate Hetzner Web PostgreSQL

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact staged web database operation; copy fences source writes
        required: true
        default: verify
        type: choice
        options: [prepare, rehearse, copy, verify, backup-source, restore-source, recover-repository, activate-backup, open-ingress, prepare-worker-access]
      revision:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: WEB-POSTGRESQL followed by a hyphen and the uppercase action
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.action == 'copy' && 'deploy-web-production' || inputs.action == 'open-ingress' && 'hetzner-ingress-production' || 'jobseek-web-postgresql-production' }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.revision }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_SHA: ${{ github.sha }}
      DISPATCH_REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Reject unauthorized dispatches before requesting backup approval
        run: |
          set -euo pipefail
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          test "$CONFIRMATION" = "WEB-POSTGRESQL-${ACTION^^}"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"

  backup-authorization:
    needs: authorize
    if: inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup-operations
    steps:
      - name: Preserve the existing protected backup operation approval boundary
        run: 'true'

  operate:
    needs: [authorize, backup-authorization]
    if: ${{ always() && needs.authorize.result == 'success' && (needs['backup-authorization'].result == 'success' || needs['backup-authorization'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.revision }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_SHA: ${{ github.sha }}
      DISPATCH_REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Bind owner authorization to the current main revision and operation
        run: |
          set -euo pipefail
          test "$ACTOR" = viktor-shcherb
          test "$TRIGGERING_ACTOR" = viktor-shcherb
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$DISPATCH_SHA"
          test "$CONFIRMATION" = "WEB-POSTGRESQL-${ACTION^^}"
          test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate reviewed deployment tools
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/web-postgresql/database.py deploy/web-postgresql/host.py deploy/web-postgresql/repository.py
          bash -n deploy/web-postgresql/*.sh
          python3 -m unittest discover -s scripts -p 'test_web_postgresql_retirement.py'
      - name: Require a successful full source backup before freezing writes
        if: inputs.action == 'copy'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_TYPESENSE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # A fresh isolated restore is a hard precondition, not a checklist.
          bash deploy/web-postgresql/deploy-remote.sh "$EXPECTED_SHA" restore-source
      - name: Recheck main immediately before the protected operation
        run: test "$(gh api repos/colophon-group/jobseek/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
      - name: Require the deployment runner can use the restricted worker login
        if: inputs.action == 'copy'
        env:
          PGPASSWORD: ${{ secrets.NARROWED_WORKER_DATABASE_PASSWORD }}
        run: bash deploy/web-postgresql/verify-worker-access.sh
      - name: Pause and verify the standalone matching process before source fencing
        if: inputs.action == 'copy'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: bash deploy/ai-filter-refresh/pause-remote.sh "$EXPECTED_SHA"
      - name: Verify the separate TLS instance and the existing host ingress baseline
        if: inputs.action == 'open-ingress'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
        run: bash deploy/web-postgresql/deploy-remote.sh "$EXPECTED_SHA" verify-server
      - name: Apply only the dedicated web database provider boundary
        if: inputs.action == 'open-ingress'
        id: web-ingress
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_CRAWLER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_POSTGRES_HOST: ${{ secrets.HETZNER_POSTGRES_HOST }}
          HETZNER_TYPESENSE_HOST: ${{ secrets.HETZNER_TYPESENSE_HOST }}
        run: python3 deploy/web-postgresql/ingress.py apply --state "$RUNNER_TEMP/web-postgresql-ingress.json"
      - name: Prove external certificate verification and SCRAM login
        if: inputs.action == 'open-ingress'
        env:
          PGHOST: web-postgres.jseek.co
          PGPORT: '5433'
          PGUSER: jobseek_web_owner
          PGPASSWORD: ${{ secrets.WEB_POSTGRES_OWNER_PASSWORD }}
          PGDATABASE: jobseek_web
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
          PGCONNECT_TIMEOUT: '5'
        run: |
          set -euo pipefail
          image=postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          for _attempt in $(seq 1 12); do
            if docker run --rm --network host --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE -e PGSSLROOTCERT -e PGCONNECT_TIMEOUT \
              "$image" psql -X -w -A -t -q -c 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Restore the prior dedicated provider boundary if external verification fails
        if: ${{ failure() && inputs.action == 'open-ingress' }}
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          if test -f "$RUNNER_TEMP/web-postgresql-ingress.json"; then
            python3 deploy/web-postgresql/ingress.py rollback --state "$RUNNER_TEMP/web-postgresql-ingress.json"
          fi
      - name: Execute the bounded operation over pinned SSH
        if: inputs.action != 'open-ingress'
        env:
          TARGET_HOST: ${{ contains(fromJSON('["backup-source","restore-source","recover-repository","activate-backup"]'), inputs.action) && secrets.HETZNER_TYPESENSE_HOST || secrets.HETZNER_POSTGRES_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
          DATABASE_URL_UNPOOLED: ${{ contains(fromJSON('["prepare","activate-backup"]'), inputs.action) && secrets.DATABASE_URL_UNPOOLED || '' }}
          WEB_POSTGRES_OWNER_PASSWORD: ${{ inputs.action == 'prepare' && secrets.WEB_POSTGRES_OWNER_PASSWORD || '' }}
          WEB_POSTGRES_AUDITOR_PASSWORD: ${{ inputs.action == 'prepare' && secrets.WEB_POSTGRES_AUDITOR_PASSWORD || '' }}
          NARROWED_WORKER_DATABASE_PASSWORD: ${{ inputs.action == 'prepare' && secrets.NARROWED_WORKER_DATABASE_PASSWORD || '' }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.action == 'prepare' && secrets.CLOUDFLARE_DNS_API_TOKEN || '' }}
          CRAWLER_PRIVATE_IPV4: ${{ secrets.CRAWLER_PRIVATE_IPV4 }}
          CRAWLER_PUBLIC_IPV4: ${{ secrets.HETZNER_HOST }}
        run: bash deploy/web-postgresql/deploy-remote.sh "$EXPECTED_SHA" "$ACTION"
      - name: Prove restricted worker login from the deployment runner
        if: inputs.action == 'prepare-worker-access'
        env:
          PGPASSWORD: ${{ secrets.NARROWED_WORKER_DATABASE_PASSWORD }}
        run: bash deploy/web-postgresql/verify-worker-access.sh
