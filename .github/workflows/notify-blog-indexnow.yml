name: Retry blog IndexNow submission

# Automatic submissions run after verified promotion in deploy-web-production.
# Manual recovery may submit only the content actually deployed at jseek.co.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  notify:
    name: Submit deployed blog URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Require this checkout to be deployed on production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          production="$(pnpm dlx vercel@59.25.4 api \
            "/v13/deployments/jseek.co?teamId=$VERCEL_ORG_ID" \
            --raw --token="$VERCEL_TOKEN")"
          production_sha="$(jq -r '.gitSource.sha // .meta.githubCommitSha // ""' <<<"$production")"
          if [[ "$production_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "Refusing to submit content from a checkout that is not deployed" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Submit blog post URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm --filter @jobseek/web notify-blog-indexnow
