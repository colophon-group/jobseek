name: Retry blog IndexNow submission

# Manual submission after the exact main revision is active on the Hetzner origin.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  notify:
    name: Submit deployed blog URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Require this checkout to be active on the public origin
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: |
          bash deploy/web-origin/remote.sh verify "$(git rev-parse HEAD)"
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null https://jseek.co/en/sign-in
      - run: pnpm install --frozen-lockfile
      - name: Submit blog post URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm --filter @jobseek/web notify-blog-indexnow
