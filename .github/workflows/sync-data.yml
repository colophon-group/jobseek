name: Sync CSV data

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/data/*.csv'
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact prewarmed main commit to sync (40-character SHA)"
        required: false
        type: string

concurrency:
  # Keep CSV-only publication from replacing a pending full crawler deploy.
  # The host mutation lock still serializes both workflows on Hetzner.
  group: crawler-production-csv-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync production CSV data
    runs-on: ubuntu-latest
    environment: production
    env:
      SYNC_REVISION: ${{ inputs.revision || github.sha }}

    steps:
      # Keep the executable runner bound to the trusted workflow revision.
      # Historical data revisions may predate this runner entirely.
      - name: Check out trusted CSV sync runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/crawler-csv-sync-host.sh
          sparse-checkout-cone-mode: false

      - name: Check out revision-pinned CSV data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: apps/crawler/data
          path: csv-source

      - name: Validate explicitly dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        run: |
          set -euo pipefail
          [[ "$SYNC_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C csv-source rev-parse HEAD)" = "$SYNC_REVISION"
          git -C csv-source fetch --no-tags origin main
          git -C csv-source merge-base --is-ancestor "$SYNC_REVISION" origin/main

      - name: Copy CSV files to Hetzner
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: csv-source/apps/crawler/data/
          target: /home/deploy/csv-overlay/
          strip_components: 4

      - name: Copy locked CSV sync runner to Hetzner
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: scripts/crawler-csv-sync-host.sh
          target: /home/deploy/csv-sync-runner/
          strip_components: 1

      - name: Run sync via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: SYNC_REVISION
          command_timeout: 1h
          script: |
            set -euo pipefail
            /usr/local/sbin/jobseek-maintenance window \
              --operation csv-data-sync \
              --issue 2623 \
              --revision "$SYNC_REVISION" \
              --budget-seconds 1800 \
              --lock-timeout-seconds 900 \
              -- \
              bash /home/deploy/csv-sync-runner/crawler-csv-sync-host.sh "$SYNC_REVISION"
