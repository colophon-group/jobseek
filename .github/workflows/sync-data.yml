name: Sync CSV data

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/data/*.csv'
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact prewarmed main commit to sync (40-character SHA)"
        required: false
        type: string

concurrency:
  # Keep only one data publisher active. Runtime compatibility is coordinated
  # with the full deploy independently through the committed host contract.
  group: crawler-production-csv-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync production CSV data
    runs-on: ubuntu-latest
    environment: production
    env:
      SYNC_REVISION: ${{ inputs.revision || github.sha }}

    steps:
      # Keep the executable runner bound to the trusted workflow revision.
      # Historical data revisions may predate this runner entirely.
      - name: Check out trusted CSV sync runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/crawler-csv-sync-host.sh
            scripts/derive-crawler-runtime-contract.mjs
          sparse-checkout-cone-mode: false

      - name: Check out revision-pinned CSV data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: apps/crawler/data
          path: csv-source

      - name: Validate requested data snapshot
        id: data_snapshot
        run: |
          set -euo pipefail
          [[ "$SYNC_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C csv-source rev-parse HEAD)" = "$SYNC_REVISION"
          git -C csv-source fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git -C csv-source merge-base --is-ancestor "$SYNC_REVISION" origin/main
          target_data_contract="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --kind data \
              --repo csv-source \
              --revision "$SYNC_REVISION"
          )"
          current_main="$(git -C csv-source rev-parse origin/main)"
          current_data_contract="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --kind data \
              --repo csv-source \
              --revision "$current_main"
          )"
          if [[ "$target_data_contract" != "$current_data_contract" ]]; then
            echo "ERROR: requested CSV snapshot is stale relative to current main" >&2
            exit 1
          fi
          printf 'data_contract_sha256=%s\n' "$target_data_contract" >>"$GITHUB_OUTPUT"

      - name: Resolve crawler runtime contract
        id: runtime_contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_REVISION: ${{ github.event.before }}
        run: |
          set -euo pipefail
          target_contract="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --repo csv-source \
              --revision "$SYNC_REVISION"
          )"
          run_sync=true
          if [[ "$EVENT_NAME" == push ]]; then
            if [[ ! "$BEFORE_REVISION" =~ ^[a-f0-9]{40}$ ]] || \
              [[ "$BEFORE_REVISION" == 0000000000000000000000000000000000000000 ]]
            then
              run_sync=false
            else
              before_contract="$(
                node scripts/derive-crawler-runtime-contract.mjs \
                  --repo csv-source \
                  --revision "$BEFORE_REVISION"
              )"
              if [[ "$before_contract" != "$target_contract" ]]; then
                run_sync=false
              fi
            fi
          fi
          if [[ "$run_sync" == false ]]; then
            echo "Full crawler deploy owns CSV publication for this runtime-changing push" >&2
          fi
          printf 'runtime_contract_sha256=%s\n' "$target_contract" >>"$GITHUB_OUTPUT"
          printf 'run_sync=%s\n' "$run_sync" >>"$GITHUB_OUTPUT"

      - name: Build immutable CSV candidate
        if: steps.runtime_contract.outputs.run_sync == 'true'
        id: candidate
        run: |
          set -euo pipefail
          candidate_id="${SYNC_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir="csv-publication/${candidate_id}"
          mkdir -p "$candidate_dir/data"
          (
            cd csv-source/apps/crawler/data
            find . -type f -name '*.csv' -print0 | LC_ALL=C sort -z |
              tar --null -T - -cf -
          ) | tar -C "$candidate_dir/data" -xf -
          python3 - "$candidate_dir/data" "$candidate_dir/data-files.sha256" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          rows = sorted(
              (path.relative_to(root).as_posix(), hashlib.sha256(path.read_bytes()).hexdigest())
              for path in root.rglob("*.csv")
              if path.is_file() and not path.is_symlink()
          )
          if not rows:
              raise SystemExit("CSV snapshot is empty")
          output.write_text(
              "".join(f"{digest}  {relative}\n" for relative, digest in rows),
              encoding="utf-8",
          )
          PY
          tar -C "$candidate_dir" -cf "$candidate_dir/csv-snapshot.tar" \
            data data-files.sha256
          archive_sha256="$(sha256sum "$candidate_dir/csv-snapshot.tar" | awk '{print $1}')"
          printf 'candidate_id=%s\n' "$candidate_id" >>"$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$archive_sha256" >>"$GITHUB_OUTPUT"

      - name: Copy immutable CSV candidate to Hetzner
        if: steps.runtime_contract.outputs.run_sync == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: csv-publication/${{ steps.candidate.outputs.candidate_id }}/csv-snapshot.tar
          target: /home/deploy/csv-candidates/${{ steps.candidate.outputs.candidate_id }}/
          strip_components: 2

      - name: Copy locked CSV sync runner to Hetzner
        if: steps.runtime_contract.outputs.run_sync == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: scripts/crawler-csv-sync-host.sh
          target: /home/deploy/csv-sync-runner/
          strip_components: 1

      - name: Revalidate publishable CSV snapshot
        if: steps.runtime_contract.outputs.run_sync == 'true'
        env:
          TARGET_DATA_CONTRACT_SHA256: ${{ steps.data_snapshot.outputs.data_contract_sha256 }}
        run: |
          set -euo pipefail
          git -C csv-source fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          current_main="$(git -C csv-source rev-parse origin/main)"
          current_data_contract="$(
            node scripts/derive-crawler-runtime-contract.mjs \
              --kind data \
              --repo csv-source \
              --revision "$current_main"
          )"
          if [[ "$current_data_contract" != "$TARGET_DATA_CONTRACT_SHA256" ]]; then
            echo "ERROR: current main CSV snapshot advanced before publication" >&2
            exit 1
          fi

      - name: Run sync via SSH
        if: steps.runtime_contract.outputs.run_sync == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: SYNC_REVISION,SYNC_RUNTIME_CONTRACT_SHA256,SYNC_DATA_CONTRACT_SHA256,SYNC_CANDIDATE_ID,SYNC_ARCHIVE_SHA256
          # 50 minutes waiting for the compatible release, then up to 25
          # minutes for the mutation lock and 30 minutes for the sync itself.
          command_timeout: 2h
          script: |
            set -euo pipefail
            deadline=$((SECONDS + 3000))
            attempt=0
            while (( SECONDS < deadline )); do
              attempt=$((attempt + 1))
              set +e
              bash /home/deploy/csv-sync-runner/crawler-csv-sync-host.sh \
                "$SYNC_REVISION" "$SYNC_RUNTIME_CONTRACT_SHA256" \
                "$SYNC_DATA_CONTRACT_SHA256" "$SYNC_CANDIDATE_ID" \
                "$SYNC_ARCHIVE_SHA256" \
                --check-runtime
              status=$?
              set -e
              if [[ "$status" -eq 75 ]]; then
                echo "Waiting for compatible crawler deployment (attempt ${attempt})" >&2
                sleep 15
                continue
              fi
              [[ "$status" -eq 0 ]] || exit "$status"

              set +e
              /usr/local/sbin/jobseek-maintenance window \
                --operation csv-data-sync \
                --issue 2623 \
                --revision "$SYNC_REVISION" \
                --budget-seconds 1800 \
                --lock-timeout-seconds 1500 \
                -- \
                bash /home/deploy/csv-sync-runner/crawler-csv-sync-host.sh \
                  "$SYNC_REVISION" "$SYNC_RUNTIME_CONTRACT_SHA256" \
                  "$SYNC_DATA_CONTRACT_SHA256" "$SYNC_CANDIDATE_ID" \
                  "$SYNC_ARCHIVE_SHA256"
              status=$?
              set -e
              if [[ "$status" -eq 0 ]]; then
                exit 0
              fi
              if [[ "$status" -ne 75 ]]; then
                exit "$status"
              fi
              echo "Crawler generation changed before sync lock; retrying" >&2
              sleep 15
            done
            echo "ERROR: compatible crawler deployment did not commit before timeout" >&2
            exit 1
        env:
          SYNC_DATA_CONTRACT_SHA256: ${{ steps.data_snapshot.outputs.data_contract_sha256 }}
          SYNC_CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          SYNC_ARCHIVE_SHA256: ${{ steps.candidate.outputs.archive_sha256 }}
          # Keep the execution contract tied to the immutable triggering
          # revision. If a later full deploy already committed these exact
          # CSVs, the host helper recognizes the data contract and no-ops.
          SYNC_RUNTIME_CONTRACT_SHA256: ${{ steps.runtime_contract.outputs.runtime_contract_sha256 }}
