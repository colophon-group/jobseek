name: Sync CSV data

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/data/*.csv'
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact prewarmed main commit to sync (40-character SHA)"
        required: false
        type: string

concurrency:
  group: crawler-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync production CSV data
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: apps/crawler/data

      - name: Validate explicitly dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        env:
          SYNC_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$SYNC_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SYNC_REVISION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SYNC_REVISION" origin/main

      - name: Copy CSV files to Hetzner
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: apps/crawler/data/
          target: /home/deploy/csv-overlay/
          strip_components: 3

      - name: Run sync via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GITHUB_SHA
          command_timeout: 1h
          script: |
            set -euo pipefail
            NAME="crawler-csv-data-sync-$(date -u +%Y%m%dT%H%M%SZ)"
            RUNTIME_ENV="$(mktemp /run/lock/jobseek-csv-sync-env.XXXXXX)"
            trap 'rm -f "$RUNTIME_ENV"' EXIT HUP INT TERM
            chmod 0600 "$RUNTIME_ENV"
            required_env=(
              LOCAL_DATABASE_URL
              WEB_DATABASE_URL
              TYPESENSE_HOST
              TYPESENSE_PORT
              TYPESENSE_PROTOCOL
              TYPESENSE_OPERATIONS_KEY
            )
            for key in "${required_env[@]}"; do
              mapfile -t matches < <(grep -E "^${key}=" /home/deploy/.env || true)
              if [[ ${#matches[@]} -ne 1 || -z "${matches[0]#*=}" ]]; then
                echo "ERROR: required CSV sync variable ${key} is missing or duplicated" >&2
                exit 1
              fi
              printf '%s\n' "${matches[0]}" >>"$RUNTIME_ENV"
            done
            printf '%s\n' \
              'CRAWLER_DB_ROLE=csv-sync' \
              'CRAWLER_DB_POOL_MIN=0' \
              'CRAWLER_DB_POOL_MAX=4' \
              'CRAWLER_DB_POOL_IDLE_SECONDS=60' >>"$RUNTIME_ENV"
            tag="$(grep -E '^CRAWLER_IMAGE_TAG=' /home/deploy/.env 2>/dev/null | tail -n1 | cut -d= -f2- || true)"
            tag="${tag:-latest}"
            /usr/local/sbin/jobseek-maintenance oneoff \
              --operation csv-data-sync \
              --issue 2623 \
              --revision "$GITHUB_SHA" \
              --budget-seconds 1800 \
              --lock-timeout-seconds 900 \
              -- \
              docker run --rm \
              --name "$NAME" \
              --env-file "$RUNTIME_ENV" \
              --network host \
              -v /home/deploy/csv-overlay:/app/data \
              "ghcr.io/colophon-group/jobseek-crawler:${tag}" \
              uv run --no-sync crawler sync
