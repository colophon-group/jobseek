name: Lightpanda Renderer

on:
  pull_request:
    paths:
      - "apps/lightpanda/**"
      - "apps/crawler/contracts/go.mod"
      - "apps/crawler/contracts/go.sum"
      - "apps/crawler/contracts/v1/gen/go/**"
      - "apps/crawler/contracts/v1/lightpandaadapter/**"
      - "apps/crawler/contracts/v1/dayforcesession/**"
      - "apps/crawler/contracts/v1/feedsession/**"
      - "apps/crawler/contracts/v1/apireplay/**"
      - "apps/crawler/contracts/v1/documentactions/**"
      - "apps/crawler/contracts/v1/lightpandaclient/**"
      - "apps/crawler/go/api-sniffer-monitor/**"
      - "apps/crawler/go/dom-detail/**"
      - "apps/crawler/go/jsonld-detail/**"
      - "apps/crawler/go/publisher-policy/**"
      - "apps/crawler/contracts/v1/lightpanda-service.md"
      - "apps/crawler/src/lightpanda/routing.py"
      - "apps/crawler/src/lightpanda_queue.py"
      - "apps/crawler/tests/test_lightpanda_renderer_deployment.py"
      - "deploy/lightpanda-renderer/**"
      - ".github/workflows/deploy-lightpanda-renderer.yml"
      - ".github/workflows/lightpanda-renderer.yml"
  workflow_dispatch:
    inputs:
      qualify_dayforce_live:
        description: "Read-only qualification of current public Dayforce boards"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lightpanda-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Lightpanda Renderer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/lightpanda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/lightpanda/go.mod
          cache-dependency-path: apps/lightpanda/go.sum

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Test, race, vet, and formatting
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go mod tidy -diff
          test -z "$(gofmt -l .)"

      - name: Qualify native host deployment tools
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          artifacts="$(mktemp -d "$RUNNER_TEMP/native-deploy-tools.XXXXXX")"
          bash scripts/build-deploy-tools.sh "$source_sha" "$artifacts/scripts"
          source scripts/native-deploy-tools.sh
          initialize_native_deploy_tools "$artifacts/scripts" "$source_sha"
          env -i "$NATIVE_DEPLOY_TOOLS" --build-info
          (
            cd go/deploy-tools
            go test -race ./...
            go vet ./...
            go mod tidy -diff
            test -z "$(gofmt -l .)"
          )

      - name: Verify durable binary source contract
        run: python3 -m unittest test_release_pin.py

      - name: Exercise checksum-pinned Lightpanda snapshot
        run: docker build --build-context contracts=../../apps/crawler/contracts --build-context api-sniffer-monitor=../../apps/crawler/go/api-sniffer-monitor --build-context dom-detail=../../apps/crawler/go/dom-detail --build-context jsonld-detail=../../apps/crawler/go/jsonld-detail --build-context publisher-policy=../../apps/crawler/go/publisher-policy --platform ${{ matrix.platform }} --target integration-test --tag jobseek-lightpanda-integration:${{ matrix.arch }}-${{ github.run_id }} .

      - name: Build bounded runtime image
        run: docker build --build-context contracts=../../apps/crawler/contracts --build-context api-sniffer-monitor=../../apps/crawler/go/api-sniffer-monitor --build-context dom-detail=../../apps/crawler/go/dom-detail --build-context jsonld-detail=../../apps/crawler/go/jsonld-detail --build-context publisher-policy=../../apps/crawler/go/publisher-policy --platform ${{ matrix.platform }} --target runtime --tag jobseek-lightpanda-runtime:${{ matrix.arch }}-${{ github.run_id }} .

      - name: Qualify public Dayforce registry with installed Lightpanda
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_dayforce_live && matrix.arch == 'amd64'
        timeout-minutes: 17
        env:
          QUALIFICATION_IMAGE: jobseek-lightpanda-integration:${{ matrix.arch }}-${{ github.run_id }}
        run: |
          docker run --rm --init --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --cpus 1 --memory 1g --memory-swap 1g --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/crawler/data/boards.csv,target=/qualification/boards.csv,readonly" \
            --env LIGHTPANDA_DAYFORCE_LIVE_REGISTRY=/qualification/boards.csv \
            "$QUALIFICATION_IMAGE" /usr/local/bin/go-lightpanda.test \
            -test.run '^TestLightpandaDayforceLiveRegistryQualification$' -test.count=1 -test.v -test.timeout=16m

      - name: Build production mTLS service image
        run: docker build --build-context contracts=../../apps/crawler/contracts --build-context api-sniffer-monitor=../../apps/crawler/go/api-sniffer-monitor --build-context dom-detail=../../apps/crawler/go/dom-detail --build-context jsonld-detail=../../apps/crawler/go/jsonld-detail --build-context publisher-policy=../../apps/crawler/go/publisher-policy --build-arg SOURCE_COMMIT=${{ github.sha }} --platform ${{ matrix.platform }} --target service --tag jobseek-lightpanda-service:${{ matrix.arch }}-${{ github.run_id }} .

      - name: Prove native service child identity boundary
        env:
          SERVICE_IMAGE: jobseek-lightpanda-service:${{ matrix.arch }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          isolation_root="$(mktemp -d)"
          cleanup() {
            sudo unlink -- "$isolation_root/server-key.pem" 2>/dev/null || true
            rmdir -- "$isolation_root"
          }
          trap cleanup EXIT
          printf 'identity-probe-only\n' >"$isolation_root/server-key.pem"
          sudo chown 10001:10001 "$isolation_root/server-key.pem"
          sudo chmod 0400 "$isolation_root/server-key.pem"
          docker run --rm \
            --init \
            --network none \
            --read-only \
            --user 0:0 \
            --cap-drop ALL \
            --cap-add KILL \
            --cap-add SETGID \
            --cap-add SETUID \
            --security-opt no-new-privileges:true \
            --cpus 1 \
            --memory 1g \
            --memory-swap 1g \
            --pids-limit 64 \
            --ulimit nofile=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10002,gid=10002,mode=0700 \
            --mount "type=bind,source=$isolation_root/server-key.pem,target=/run/credentials/server-key.pem,readonly" \
            "$SERVICE_IMAGE" \
            --runtime-v1-child-isolation-check /run/credentials/server-key.pem
