name: Deploy web origin on Hetzner

on:
  workflow_dispatch:
    inputs:
      action:
        description: Stage, activate, or connect the exact current main revision
        required: true
        type: choice
        options: [stage, activate, tunnel]
      revision:
        description: Exact current main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.revision }}
    steps:
      - name: Require the dispatched revision to remain current main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Validate the reviewed host deployment surface
        run: |
          bash -n deploy/web-origin/*.sh
          for file in deploy/web-origin/*.mjs; do node --check "$file"; done

      - name: Load protected web runtime configuration
        if: inputs.action != 'tunnel'
        env:
          WEB_ORIGIN_RUNTIME_JSON: ${{ secrets.WEB_ORIGIN_RUNTIME_JSON }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$WEB_ORIGIN_RUNTIME_JSON"
          test -n "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY"
          umask 077
          node - <<'JS'
          const fs = require('node:fs');
          const config = JSON.parse(process.env.WEB_ORIGIN_RUNTIME_JSON);
          config.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY = process.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY;
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/web-origin-runtime.json`, JSON.stringify(config), { mode: 0o600 });
          JS
          node deploy/web-origin/validate-config.mjs "$RUNNER_TEMP/web-origin-runtime.json"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.action == 'stage'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: inputs.action == 'stage'
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install locked dependencies
        if: inputs.action == 'stage'
        run: pnpm install --frozen-lockfile

      - name: Require production database at the checked-out migration head
        if: inputs.action == 'stage'
        working-directory: apps/web
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate:verify-head

      - name: Build the standalone web artifact
        if: inputs.action == 'stage'
        run: node deploy/web-origin/with-env.mjs "$RUNNER_TEMP/web-origin-runtime.json" pnpm --filter @jobseek/web build

      - name: Package only the built runtime and public assets
        if: inputs.action == 'stage'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-origin-package/apps/web/.next"
          cp -a apps/web/.next/standalone/. "$RUNNER_TEMP/web-origin-package/"
          cp -a apps/web/.next/static "$RUNNER_TEMP/web-origin-package/apps/web/.next/static"
          cp -a apps/web/public "$RUNNER_TEMP/web-origin-package/apps/web/public"
          test -s "$RUNNER_TEMP/web-origin-package/apps/web/server.js"
          tar -C "$RUNNER_TEMP/web-origin-package" -czf "$RUNNER_TEMP/web-origin-release.tar.gz" .

      - name: Recheck current main before changing the host
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_SHA"

      - name: Stage and smoke the candidate on loopback
        if: inputs.action == 'stage'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
          WEB_ORIGIN_ARCHIVE: ${{ runner.temp }}/web-origin-release.tar.gz
          WEB_ORIGIN_RUNTIME_JSON: ${{ runner.temp }}/web-origin-runtime.json
        run: bash deploy/web-origin/remote.sh stage "$EXPECTED_SHA"

      - name: Recheck current main immediately before activation
        if: inputs.action == 'activate'
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_SHA"

      - name: Activate only the already healthy candidate
        if: inputs.action == 'activate'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
        run: bash deploy/web-origin/remote.sh activate "$EXPECTED_SHA"

      - name: Connect the healthy production origin to Cloudflare
        if: inputs.action == 'tunnel'
        env:
          TARGET_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_CRAWLER_KNOWN_HOSTS }}
          WEB_ORIGIN_TUNNEL_TOKEN: ${{ secrets.WEB_ORIGIN_TUNNEL_TOKEN }}
        run: bash deploy/web-origin/remote.sh tunnel "$EXPECTED_SHA"

      - name: Remove runner-local runtime material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/web-origin-runtime.json"
