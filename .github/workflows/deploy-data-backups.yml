name: Deploy Data Backups (Hetzner)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/backups/**'
      - 'deploy/systemd/jobseek-postgresql-backup.*'
      - 'deploy/systemd/jobseek-postgresql-backup-repository.service'
      - 'deploy/systemd/jobseek-postgresql-emergency-headroom.service'
      - 'deploy/systemd/jobseek-typesense-backup.*'
      - 'deploy/systemd/jobseek-web-postgresql-backup.*'
      - 'scripts/jobseek-data-backup.py'
      - 'docs/16-hetzner-maintenance.md'
      - 'docs/19-data-backup-recovery.md'
      - '.github/workflows/deploy-data-backups.yml'
      - '.github/workflows/operate-web-postgresql-backup.yml'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: hetzner-data-backup-production-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [postgresql, typesense, web-postgresql]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Resolve the latest relevant backup deployment revision
        id: deployment-revision
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          deploy_paths=(
            'deploy/backups/**'
            'deploy/systemd/jobseek-postgresql-backup.*'
            'deploy/systemd/jobseek-postgresql-backup-repository.service'
            'deploy/systemd/jobseek-postgresql-emergency-headroom.service'
            'deploy/systemd/jobseek-typesense-backup.*'
            'deploy/systemd/jobseek-web-postgresql-backup.*'
            'scripts/jobseek-data-backup.py'
            'docs/16-hetzner-maintenance.md'
            'docs/19-data-backup-recovery.md'
            '.github/workflows/deploy-data-backups.yml'
            '.github/workflows/operate-web-postgresql-backup.yml'
          )
          deploy_sha="$(git log -1 --format=%H "$CHECKOUT_SHA" -- "${deploy_paths[@]}")"
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$deploy_sha" "$CHECKOUT_SHA"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Validate backup deployment artifacts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/jobseek-data-backup.py
          python3 -m py_compile deploy/backups/postgresql/configure-retention.py
          python3 -m py_compile deploy/backups/web-postgresql/operations.py
          bash -n deploy/backups/install-host.sh
          bash -n deploy/backups/install-host-from-stdin.sh
          bash -n deploy/backups/deploy-remote.sh
          bash -n deploy/backups/postgresql/migrate-container.sh
          bash -n deploy/backups/postgresql/mount-repository.sh
          bash -n deploy/backups/postgresql/restore-drill.sh
          bash -n deploy/backups/postgresql/smoke-repository.sh
          bash -n deploy/backups/typesense/restore-drill.sh
          bash -n deploy/backups/typesense/credential-rotation.sh
          bash -n deploy/backups/postgresql/emergency-headroom.sh
          bash -n deploy/backups/web-postgresql/protect-client-image.sh
          bash -n deploy/backups/web-postgresql/restore-drill.sh
          cd apps/crawler
          uv run --frozen pytest tests/test_data_backup.py tests/test_typesense_backup_deployment.py tests/test_typesense_backup_credential_rotation.py tests/test_pgbackrest_retention.py tests/test_postgresql_emergency_headroom.py tests/test_web_postgresql_backup_image_gc.py -q

      - name: Copy and install over host-key-pinned native OpenSSH
        env:
          # Environment-scoped secrets are unavailable while GitHub expands
          # the job matrix, so resolve them only after production is attached.
          TARGET_HOST: ${{ matrix.service == 'postgresql' && secrets.HETZNER_POSTGRES_HOST || secrets.HETZNER_TYPESENSE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_BACKUP_KNOWN_HOSTS }}
          BACKUP_SERVICE: ${{ matrix.service }}
          DEPLOY_SHA: ${{ steps.deployment-revision.outputs.deploy_sha }}
          JOBSEEK_TYPESENSE_BACKUP_KEY: ${{ matrix.service == 'typesense' && secrets.TYPESENSE_BACKUP_KEY || '' }}
          JOBSEEK_WEB_DATABASE_URL: ${{ matrix.service == 'web-postgresql' && secrets.DATABASE_URL_UNPOOLED || '' }}
        run: bash deploy/backups/deploy-remote.sh "$BACKUP_SERVICE" "$DEPLOY_SHA"
