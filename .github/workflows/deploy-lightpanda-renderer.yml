name: Deploy dormant Lightpanda renderer

on:
  pull_request:
    paths:
      - "deploy/lightpanda-renderer/**"
      - "pilots/go-lightpanda/**"
      - "apps/crawler/contracts/v1/**"
      - "apps/crawler/tests/test_lightpanda_renderer_deployment.py"
      - ".github/workflows/deploy-lightpanda-renderer.yml"
      - ".github/workflows/go-lightpanda-pilot.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_REPOSITORY: ghcr.io/colophon-group/jobseek-lightpanda-renderer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Validate dormant deployment contract
        run: |
          set -euo pipefail
          bash -n deploy/lightpanda-renderer/deploy-remote.sh
          bash -n deploy/lightpanda-renderer/install-host.sh
          bash -n deploy/lightpanda-renderer/ci-smoke.sh
          python3 -m py_compile \
            deploy/lightpanda-renderer/verify.py \
            deploy/lightpanda-renderer/validate_pki.py
          cd apps/crawler
          uv run --frozen ruff check \
            ../../deploy/lightpanda-renderer/verify.py \
            ../../deploy/lightpanda-renderer/validate_pki.py \
            tests/test_lightpanda_renderer_deployment.py
          uv run --frozen ruff format --check \
            ../../deploy/lightpanda-renderer/verify.py \
            ../../deploy/lightpanda-renderer/validate_pki.py \
            tests/test_lightpanda_renderer_deployment.py
          uv run --frozen pyright \
            ../../deploy/lightpanda-renderer/verify.py \
            ../../deploy/lightpanda-renderer/validate_pki.py
          uv run --frozen pytest tests/test_lightpanda_renderer_deployment.py -q

  build:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attest source revision
        id: source
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_commit=%s\n' "$source_commit" >>"$GITHUB_OUTPUT"

      - name: Build real ARM64 service image for pull request
        working-directory: pilots/go-lightpanda
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          docker build \
            --build-context contracts=../../apps/crawler/contracts \
            --build-arg "SOURCE_COMMIT=$SOURCE_COMMIT" \
            --platform linux/arm64 \
            --target service \
            --tag jobseek-lightpanda-renderer:pr \
            .
          test "$(docker image inspect --format '{{.Architecture}}' jobseek-lightpanda-renderer:pr)" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels \"org.jobseek.lightpanda.source-commit\"}}' jobseek-lightpanda-renderer:pr)" = "$SOURCE_COMMIT"
          cd ../..
          bash deploy/lightpanda-renderer/ci-smoke.sh \
            jobseek-lightpanda-renderer:pr "$SOURCE_COMMIT"

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Refuse non-main production dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main

      - name: Check out exact main for production dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Attest source revision
        id: source
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$remote_main" == "$source_commit" ]] || {
            echo "checked-out revision is no longer exact main" >&2
            exit 1
          }
          printf 'source_commit=%s\n' "$source_commit" >>"$GITHUB_OUTPUT"
          printf 'image_identity=%s:sha-%s\n' "$IMAGE_REPOSITORY" "$source_commit" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact ARM64 service image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: pilots/go-lightpanda
          file: pilots/go-lightpanda/Dockerfile
          build-contexts: |
            contracts=apps/crawler/contracts
          platforms: linux/arm64
          target: service
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.source_commit }}
          push: true
          tags: ${{ steps.source.outputs.image_identity }}
          labels: |
            org.jobseek.lightpanda.source-commit=${{ steps.source.outputs.source_commit }}
          cache-from: type=gha,scope=lightpanda-renderer-arm64
          cache-to: type=gha,mode=max,scope=lightpanda-renderer-arm64,ignore-error=true

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      packages: read
    # This legacy-named group is the cross-workflow mutation authority for the
    # shared Murmur host. PR validation and image builds do not take this lock.
    concurrency:
      group: deploy-murmur-shim
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Reattest exact main and immutable image
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test "$remote_main" = "$EXPECTED_SOURCE_COMMIT"

      - name: Deploy one dormant no-egress renderer
        env:
          TARGET_HOST: ${{ secrets.HETZNER_MURMUR_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_MURMUR_KNOWN_HOSTS }}
          GHCR_PULL_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          LIGHTPANDA_B0_CA_CERT_PEM: ${{ secrets.LIGHTPANDA_B0_CA_CERT_PEM }}
          LIGHTPANDA_B0_SERVER_CERT_PEM: ${{ secrets.LIGHTPANDA_B0_SERVER_CERT_PEM }}
          LIGHTPANDA_B0_SERVER_KEY_PEM: ${{ secrets.LIGHTPANDA_B0_SERVER_KEY_PEM }}
          LIGHTPANDA_B0_CLIENT_CERT_PEM: ${{ secrets.LIGHTPANDA_B0_CLIENT_CERT_PEM }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          JOBSEEK_LIGHTPANDA_CI_FAILURE_MODE: disabled
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          bash deploy/lightpanda-renderer/deploy-remote.sh "$SOURCE_COMMIT" "$image_ref"

      - name: Record sanitized dormant release identity
        env:
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg image_digest "$IMAGE_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version: 1, source_commit: $source_commit, image_digest: $image_digest, run_id: $run_id, run_attempt: $run_attempt, mode: "dormant-no-egress"}' \
            >lightpanda-renderer-release.json

      - name: Retain sanitized release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightpanda-renderer-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: lightpanda-renderer-release.json
          if-no-files-found: error
          retention-days: 14
