name: Native lane canonical diagnosis

on:
  pull_request:
    paths:
      - pilots/native-lane-diagnostics/**
      - .github/workflows/native-lane-canonical-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-lane-canonical-diagnosis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose canonical fields (arm64, generated)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NATIVE_LANE_INPUT_MODE: generated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Verify fixture and bounded fingerprint behavior
        working-directory: apps/crawler
        run: |
          uv sync --frozen --group dev
          uv run --frozen python -m unittest discover -s ../../pilots/native-lane-diagnostics -p 'test_*.py'
          uv run --frozen ruff check ../../pilots/native-lane-diagnostics
          uv run --frozen ruff format --check ../../pilots/native-lane-diagnostics
          uv run --frozen pytest admission/native_lane -q

      - name: Build exact candidate and comparator images
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          docker build --quiet --target native \
            --build-arg "CRAWLER_SOURCE_REVISION=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "native-lane-candidate:${source_sha}" apps/crawler
          docker build --quiet --target benchmark-browser \
            --build-arg "CRAWLER_SOURCE_REVISION=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "native-lane-control:${source_sha}" apps/crawler
          docker build --quiet --build-context contracts=apps/crawler/contracts \
            --build-context api-sniffer-monitor=apps/crawler/go/api-sniffer-monitor \
            --build-context dom-detail=apps/crawler/go/dom-detail \
            --build-context jsonld-detail=apps/crawler/go/jsonld-detail \
            --build-context publisher-policy=apps/crawler/go/publisher-policy \
            --build-arg "SOURCE_COMMIT=${source_sha}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --target service --tag "native-lane-renderer:${source_sha}" pilots/go-lightpanda

      - name: Diagnose six isolated arms without relaxing parity
        working-directory: apps/crawler
        run: |
          set -euo pipefail
          umask 077
          source_sha="$(git rev-parse HEAD)"
          native="$(docker image inspect --format '{{.Id}}' "native-lane-candidate:${source_sha}")"
          legacy="$(docker image inspect --format '{{.Id}}' "native-lane-control:${source_sha}")"
          renderer="$(docker image inspect --format '{{.Id}}' "native-lane-renderer:${source_sha}")"
          mkdir -p "${RUNNER_TEMP}/canonical-diagnosis"
          uv run --frozen python ../../pilots/native-lane-diagnostics/diagnose.py \
            --native-image "$native" --legacy-image "$legacy" \
            --renderer-image "$renderer" --source-sha "$source_sha" \
            --output "${RUNNER_TEMP}/canonical-diagnosis/report.json"

      - name: Expose only bounded field fingerprints
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/canonical-diagnosis/report.json
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('pilots/native-lane-diagnostics').resolve()))
          from diagnose import summarize
          path = Path(os.environ['REPORT_PATH'])
          report = json.loads(path.read_text()) if path.is_file() else {}
          summary = summarize(report.get('arms', []))
          summary.update(complete=report.get('complete') is True,
                         canonical_parity=report.get('canonical_parity'),
                         source_revision=report.get('source_revision'),
                         failure_class=report.get('failure_class'),
                         diagnostic_only=True)
          encoded = json.dumps(summary, sort_keys=True, separators=(',', ':'))
          print('NATIVE_LANE_CANONICAL_DIAGNOSTICS=' + encoded)
          escaped = encoded.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Canonical field diagnosis::' + escaped)
          PY

      - name: Retain compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-diagnosis/report.json
          if-no-files-found: warn
          retention-days: 1
