# Prometheus alert rules for the jobseek crawler.
#
# Source of truth for the alerts described in #2703 and #5926. The
# deploy-hetzner-observability workflow transactionally syncs these groups to
# Grafana Cloud Mimir after all three host collectors pass deployment.
# Manual validation/sync uses the same repo-owned client:
#
#   cd apps/crawler
#   uv run python ../../scripts/sync-grafana-rules.py --dry-run
#
# Severity convention:
#   - severity=critical -> active availability or data-durability risk
#   - severity=high     -> urgent degradation or lost safety control
#   - severity=medium   -> actionable but bounded operational debt
#
# Production alert state is consumed by two routes. Every critical alert has
# `page=production` for the independent Grafana Cloud email receiver, while
# `route=codex-daily` remains on every alert so the daily Hetzner Codex review
# can deduplicate context into GitHub issues. The always-firing deadman route
# repeats daily and the scheduled synthetic test exercises firing + recovery.
#
# Each alert's `for:` is sized to debounce deploy-time flapping.
# `runbook` annotations link to the operator playbook for the failure
# class. See docs/14-error-review-routine.md for the broader incident
# response routine.

groups:
  - name: jobseek_hetzner_fleet
    interval: 30s
    rules:

      # --- PAGE ----------------------------------------------------

      # Catches the failure mode that took the box dark for 15h on
      # 2026-04-25: Alloy itself stopped, so no metrics reached
      # Grafana Cloud at all. The `up{}` series is synthesized by the
      # scraper, so its absence directly maps to "scrape pipeline
      # broken" — which is exactly what we want to page on.
      - alert: NoMetricsFromCrawler
        expr: absent_over_time(up{job="crawler"}[2m])
        for: 1m
        labels:
          severity: critical
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "No metrics from any crawler scrape target"
          description: |
            No `up{job="crawler"}` samples for three minutes. Either Alloy has
            stopped on the worker box, all containers exited, or
            remote_write to Grafana Cloud is failing. SSH to the box
            and check `docker ps`.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # Exact expected-host expressions are deliberate: a grouped expression
      # cannot retain a label for a time series that has disappeared.
      - alert: CrawlerHostMetricsMissing
        expr: absent_over_time(up{job="integrations/unix",instance="jobseek-crawler-browser",host_role="crawler"}[2m])
        for: 1m
        labels:
          severity: critical
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Crawler host metrics are missing"
          description: "The crawler host-level Alloy stream has been absent for three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: PostgresqlHostMetricsMissing
        expr: absent_over_time(up{job="integrations/unix",instance="jobseek-postgresql",host_role="postgresql"}[2m])
        for: 1m
        labels:
          severity: critical
          service: postgresql
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL host metrics are missing"
          description: "The PostgreSQL host-level Alloy stream has been absent for three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: TypesenseHostMetricsMissing
        expr: absent_over_time(up{job="integrations/unix",instance="jobseek-typesense",host_role="typesense"}[2m])
        for: 1m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense host metrics are missing"
          description: "The Typesense host-level Alloy stream has been absent for three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: HostObservabilitySamplerStale
        expr: time() - jobseek_host_observability_last_collect_unixtime > 180
        for: 30s
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Host sampler stale on {{ $labels.instance }}"
          description: "The root-owned read-only sampler has not produced a fresh textfile for more than three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: HostObservabilityProbeFailed
        expr: jobseek_host_observability_probe_success == 0
        for: 3m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Host probe {{ $labels.probe }} failed on {{ $labels.instance }}"
          description: "A required read-only host/service probe has failed for three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: RequiredHostUnitInactive
        expr: jobseek_host_unit_active == 0
        for: 5m
        labels:
          severity: high
          service: fleet-runtime
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Required unit {{ $labels.unit }} is inactive on {{ $labels.instance }}"
          description: "A required Docker, backup, tunnel, or Codex scheduling unit has remained inactive for five minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: RequiredContainerUnavailable
        expr: jobseek_container_running == 0
        for: 3m
        labels:
          severity: critical
          service: fleet-runtime
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Required container {{ $labels.container }} is unavailable on {{ $labels.instance }}"
          description: "A required crawler, PostgreSQL, Typesense, or Redis container has remained stopped for three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # Hard-outage prevention. Postgres halts when its data volume
      # fills (see project_postgres_machine memory). Crawler box also
      # holds Redis state on `/` and the Typesense data dir; both
      # warrant a hard alert before they become unrecoverable.
      - alert: DiskNearFull
        expr: |
          node_filesystem_avail_bytes{job="integrations/unix",mountpoint=~"/|/mnt/.*"}
            / node_filesystem_size_bytes{job="integrations/unix",mountpoint=~"/|/mnt/.*"}
            < 0.10
        for: 3m
        labels:
          severity: critical
          service: fleet-storage
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Disk <10% free on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: |
            Filesystem `{{ $labels.mountpoint }}` on `{{ $labels.instance }}`
            is below 10% available. Postgres halts when its data dir
            fills; the crawler box stops claiming work when Redis can't
            persist. Investigate before the next deploy.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#disk-triage

      - alert: InodesNearFull
        expr: |
          node_filesystem_files_free{job="integrations/unix",fstype!~"tmpfs|overlay"}
            / node_filesystem_files{job="integrations/unix",fstype!~"tmpfs|overlay"}
            < 0.10
        for: 3m
        labels:
          severity: critical
          service: fleet-storage
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Inodes <10% free on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "The filesystem is close to inode exhaustion even if byte capacity remains."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#disk-triage

      - alert: DataBackupFailed
        expr: jobseek_backup_last_attempt_success == 0
        for: 3m
        labels:
          severity: critical
          service: data-backup
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.service }} backup failed on {{ $labels.instance }}"
          description: "The latest application-data backup attempt failed. The native repository is now the only recovery path; investigate immediately and preserve existing artifacts."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates

      - alert: DataBackupStale
        expr: |
          (time() - jobseek_backup_last_success_unixtime{service="web-postgresql"} > 9 * 60 * 60)
          or
          (time() - jobseek_backup_last_success_unixtime{service!="web-postgresql"} > 36 * 60 * 60)
        for: 3m
        labels:
          severity: critical
          service: data-backup
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.service }} backup is stale on {{ $labels.instance }}"
          description: "No successful application-data backup has completed inside its recovery window (9 hours for web PostgreSQL; 36 hours for daily data services)."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates

      - alert: PostgreSQLUnavailable
        expr: jobseek_postgresql_ready == 0
        for: 2m
        labels:
          severity: critical
          service: postgresql
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL readiness failed"
          description: "The local PostgreSQL server is not accepting connections."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: PostgreSQLConnectionsHigh
        expr: jobseek_postgresql_connections / jobseek_postgresql_max_connections > 0.80
        for: 15m
        labels:
          severity: high
          service: postgresql
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "PostgreSQL connections exceed 80%"
          description: "Connection use is approaching max_connections and can block crawler/export operations."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: PostgreSQLSharedMemoryPressure
        expr: |
          jobseek_postgresql_shared_memory_configured_bytes < 1073741824
            or
          jobseek_postgresql_shared_memory_capacity_bytes < 1073741824
            or
          jobseek_postgresql_shared_memory_available_bytes
            / jobseek_postgresql_shared_memory_capacity_bytes < 0.15
        for: 3m
        labels:
          severity: critical
          service: postgresql
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL shared-memory contract is unsafe"
          description: |
            The PostgreSQL container has regressed below the required 1 GiB
            `/dev/shm` limit or less than 15% of that capacity remains. Parallel
            queries can fail with ENOSPC while the host filesystem is healthy.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#postgresql-shared-memory

      - alert: PostgreSQLArchiveFailure
        expr: increase(jobseek_postgresql_archive_failed_total[1h]) > 0
        for: 3m
        labels:
          severity: critical
          service: postgresql
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL WAL archive failure"
          description: "pg_stat_archiver recorded a new WAL archive failure in the last hour."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates

      - alert: TypesenseUnavailable
        expr: jobseek_typesense_healthy == 0
        for: 2m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense health check failed"
          description: "The local Typesense health endpoint no longer reports ok."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: TypesenseTunnelUnavailable
        expr: jobseek_host_unit_active{host_role="typesense",unit="cloudflared.service"} == 0
        for: 3m
        labels:
          severity: critical
          service: typesense-tunnel
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense Cloudflare tunnel is inactive"
          description: "The public Typesense read path is unavailable even if the local process is healthy."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      - alert: HostRebootRequired
        expr: jobseek_host_reboot_required == 1
        for: 24h
        labels:
          severity: medium
          service: fleet-maintenance
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Reboot remains required on {{ $labels.instance }}"
          description: "The host has required a reboot for at least 24 hours; schedule it through the maintenance runbook."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

  - name: jobseek_typesense_reliability
    interval: 30s
    rules:

      - alert: TypesenseNofileLimitUnsafe
        expr: |
          jobseek_typesense_nofile_soft_limit < 65536
            or jobseek_typesense_nofile_hard_limit < 65536
        for: 2m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense file-descriptor limit is below the managed floor"
          description: "The live Typesense process has regressed below the required 65,536 soft/hard nofile limit."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseFileDescriptorPressure
        expr: |
          jobseek_typesense_open_file_descriptors
            / jobseek_typesense_nofile_soft_limit > 0.75
        for: 5m
        labels:
          severity: high
          service: typesense
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Typesense file-descriptor use exceeds 75%"
          description: "Open files/sockets are approaching the process limit that previously caused Raft snapshot failure."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseThreadPoolSaturated
        expr: jobseek_typesense_threadpool_queue_depth > 32
        for: 2m
        labels:
          severity: high
          service: typesense
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Typesense request thread pool is saturated"
          description: "The five-minute log window reports more than two full 16-thread pools of queued work."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseSlowRequests
        expr: jobseek_typesense_slow_request_max_milliseconds > 10000
        for: 2m
        labels:
          severity: high
          service: typesense
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Typesense requests exceed ten seconds"
          description: "The five-minute log window contains a request slower than ten seconds, an early saturation signal."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseDescriptorExhausted
        expr: jobseek_typesense_recent_log_events{event="descriptor_exhaustion"} > 0
        for: 1m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense exhausted its file descriptors"
          description: "Typesense logged `Too many open files` during the last five minutes. Preserve first-cause logs before restarting."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseLeaderless
        expr: jobseek_typesense_recent_log_events{event="leaderless"} > 0
        for: 1m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense Raft node has no leader"
          description: "The single-node Raft group reported no leader or state ERROR during the last five minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

      - alert: TypesenseSnapshotFailure
        expr: jobseek_typesense_recent_log_events{event="snapshot_failure"} > 0
        for: 1m
        labels:
          severity: critical
          service: typesense
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Typesense Raft snapshot failed"
          description: "Typesense logged a snapshot writer or timed-snapshot failure during the last five minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#typesense-readiness-and-raft-recovery

  - name: jobseek_postgresql_capacity
    interval: 30s
    rules:

      - alert: PostgreSQLDataVolumeHeadroomLow
        expr: |
          (
            max(
              node_filesystem_avail_bytes{
                job="integrations/unix",
                host_role="postgresql",
                fstype="xfs",
                mountpoint=~"/mnt/.*"
              }
            )
              /
            max(
              node_filesystem_size_bytes{
                job="integrations/unix",
                host_role="postgresql",
                fstype="xfs",
                mountpoint=~"/mnt/.*"
              }
            )
              < 0.25
          )
            or
          (
            max(
              predict_linear(
                jobseek_postgresql_database_bytes{host_role="postgresql"}[24h],
                30 * 24 * 60 * 60
              )
            )
              - max(jobseek_postgresql_database_bytes{host_role="postgresql"})
              >
            max(
              node_filesystem_avail_bytes{
                job="integrations/unix",
                host_role="postgresql",
                fstype="xfs",
                mountpoint=~"/mnt/.*"
              }
            )
          )
        for: 6h
        labels:
          severity: high
          service: postgresql
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "PostgreSQL data Volume has insufficient durable headroom"
          description: |
            The attached XFS data Volume has remained below 25% free, or the
            retained database-size trend projects that database growth will
            consume all current filesystem headroom within 30 days. Verify the
            backup and growth evidence before expanding the Volume; do not
            delete descriptions or raise a threshold to hide the forecast.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#postgresql-capacity-and-checkpoint-pressure

      - alert: PostgreSQLCheckpointPressure
        expr: |
          max(
            increase(
              jobseek_postgresql_checkpoints_requested_total{
                host_role="postgresql"
              }[6h]
            )
          )
            >
          max(
            increase(
              jobseek_postgresql_checkpoints_timed_total{
                host_role="postgresql"
              }[6h]
            )
          )
            and
          max(
            increase(
              jobseek_postgresql_checkpoints_requested_total{
                host_role="postgresql"
              }[6h]
            )
          ) >= 4
        for: 30m
        labels:
          severity: high
          service: postgresql
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Requested checkpoints dominate PostgreSQL again"
          description: |
            WAL pressure has forced at least four checkpoints in six hours and
            requested checkpoints outnumber timed checkpoints. Inspect WAL
            generation, archive health, checkpoint write/sync time, and the
            data Volume before changing max_wal_size or checkpoint timing.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#postgresql-capacity-and-checkpoint-pressure

      - alert: PostgreSQLBackupRepositoryHeadroomLow
        expr: |
          (
            max(
              node_filesystem_avail_bytes{
                job="integrations/unix",
                host_role="postgresql",
                fstype="cifs",
                mountpoint=~"/mnt/.*"
              }
            )
              /
            max(
              node_filesystem_size_bytes{
                job="integrations/unix",
                host_role="postgresql",
                fstype="cifs",
                mountpoint=~"/mnt/.*"
              }
            )
              < 0.35
          )
            or
          (
            min(
              predict_linear(
                node_filesystem_avail_bytes{
                  job="integrations/unix",
                  host_role="postgresql",
                  fstype="cifs",
                  mountpoint=~"/mnt/.*"
                }[6h],
                7 * 24 * 60 * 60
              )
            ) < 0
          )
        for: 3m
        labels:
          severity: critical
          service: postgresql-backup
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL backup repository is consuming its safety margin"
          description: |
            The encrypted repository is below 35% free or its six-hour trend
            projects exhaustion within seven days. Verify that bounded archive
            retention is expiring obsolete WAL before the data Volume fills.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#postgresql-backup-operation

      - alert: PostgreSQLEmergencyHeadroomMissing
        expr: |
          jobseek_postgresql_emergency_reserve_bytes
            < jobseek_postgresql_emergency_reserve_target_bytes
        for: 3m
        labels:
          severity: critical
          service: postgresql
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "PostgreSQL recovery reserve is missing or under-allocated"
          description: |
            The attached XFS data Volume no longer contains the allocated 2 GiB
            emergency reserve required to recover archiving and crash replay
            safely during a capacity incident.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#postgresql-emergency-headroom

  - name: jobseek_telemetry_delivery
    interval: 30s
    rules:

      - alert: AlloyCollectorUnready
        expr: jobseek_alloy_ready == 0
        for: 2m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.collector }} Alloy is unready on {{ $labels.instance }}"
          description: "The independent root sampler cannot reach this Alloy collector's loopback readiness endpoint."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyRemoteWriteRejected
        expr: jobseek_alloy_remote_write_rejections_recent > 0
        for: 2m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Grafana rejected {{ $labels.collector }} Alloy writes on {{ $labels.instance }}"
          description: "Alloy logged at least one HTTP 429 remote-write response in the rolling ten-minute sampler window."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyRemoteWriteStale
        expr: time() - jobseek_alloy_remote_write_highest_sent_timestamp_seconds > 180
        for: 30s
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.collector }} Alloy remote write is stale on {{ $labels.instance }}"
          description: "The collector has not confirmed sending a Prometheus sample for more than three minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyRemoteWriteBacklog
        expr: jobseek_alloy_remote_write_samples_pending > 3000
        for: 3m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.collector }} Alloy queue is near capacity on {{ $labels.instance }}"
          description: "More than 3,000 samples are pending in the bounded 4,000-sample remote-write queue."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyRemoteWriteSamplesLost
        expr: increase(jobseek_alloy_remote_write_samples_failed_total[10m]) + increase(jobseek_alloy_remote_write_samples_dropped_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.collector }} Alloy lost metrics on {{ $labels.instance }}"
          description: "The collector recorded failed or dropped Prometheus samples during the last ten minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyLokiEntriesDropped
        expr: increase(jobseek_alloy_loki_dropped_entries_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.collector }} Alloy dropped logs on {{ $labels.instance }}"
          description: "The collector recorded dropped Loki entries during the last ten minutes."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: AlloyMemoryPressure
        expr: jobseek_alloy_resident_memory_bytes > 471859200
        for: 5m
        labels:
          severity: high
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "{{ $labels.collector }} Alloy memory is near its hard limit on {{ $labels.instance }}"
          description: "Alloy resident memory has exceeded 450 MiB for five minutes against a 512 MiB hard limit."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: ComposeAlloyRestartOrOOM
        expr: jobseek_container_oom_killed{container="deploy-alloy-1"} == 1 or changes(jobseek_container_restart_count{container="deploy-alloy-1"}[15m]) > 0
        for: 2m
        labels:
          severity: critical
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Crawler Compose Alloy restarted or was OOM-killed"
          description: "The independent host sampler observed an Alloy OOM flag or a restart-count change."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets

      - alert: TelemetrySeriesBudgetHigh
        expr: count({job=~".+"}) > 12000
        for: 10m
        labels:
          severity: high
          service: fleet-observability
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Grafana active-series budget exceeds 80%"
          description: "The tenant is above 12,000 active series against its 15,000-series limit; identify the growing job before writes are rejected."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#telemetry-delivery-budgets
  - name: jobseek_crawler_reliability
    interval: 30s
    rules:

      # Redis runs with `--maxmemory 1gb --maxmemory-policy noeviction`
      # (apps/crawler/docker-compose.yml). Pressure → write stalls,
      # which silently drops queue work. Redis exporter is added to
      # alloy.river in the same PR as this alert.
      - alert: RedisMemoryPressure
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 3m
        labels:
          severity: critical
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Redis memory >90% on crawler box"
          description: |
            Redis memory usage above 90% of `maxmemory` for >5m.
            Policy is `noeviction`, so writes will stall when full.
            Investigate queue backlog; consider `crawler sync` to
            reseed if state is stale, or scale `maxmemory` up.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # Catches the failure mode from #3169: a worker container is
      # alive (so `up{job="crawler"}` stays 1 and NoMetricsFromCrawler
      # does NOT fire) but its claim/dispatch loop is stuck — a
      # Playwright-internal deadlock, an unawaited scraper hang, or a
      # similar process-level wedge. `worker_heartbeat_ts` is updated
      # at the top of every loop iteration in
      # `src/workers/pipeline.py`; healthy workers tick every few
      # seconds. 10 minutes is conservative — it sits well above
      # normal monitor-run latency, so a single long board doesn't
      # page. Tighten if it turns out to be too quiet.
      #
      # `max by (worker_id)` collapses across `instance` so a worker
      # restart on a different container doesn't double-page; the
      # worker_id label is the stable identity within a container.
      - alert: WorkerStuck
        expr: time() - max by (worker_id) (crawler_worker_heartbeat_timestamp_seconds) > 600
        for: 3m
        labels:
          severity: critical
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Crawler worker {{ $labels.worker_id }} heartbeat stale for >10 min"
          description: |
            Worker {{ $labels.worker_id }} hasn't updated heartbeat in
            >10 minutes. Process may be stuck in a scraper deadlock,
            Playwright internal hang, or similar. Container is likely
            'up' but doing no work. SSH to the crawler box and inspect;
            restart container if needed.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # Catches the failure mode from #3167: an ephemeral cron run
      # (refresh-typesense every 4h, plus operator-triggered
      # backfill-typesense) stops succeeding silently. The wrapping
      # GitHub Actions workflow may also start failing for an
      # unrelated reason, suppressing the workflow-failure email.
      # `crawler_cron_last_run_ts` is pushed to Pushgateway at the
      # end of every run by `src/cron_metrics.py`; the series
      # persists between runs (Pushgateway PUT semantics) so its
      # last value goes stale when the cron stops reporting.
      # >6h since last report covers the worst case (4h cadence +
      # a missed cycle), and the 1h `for:` debounces a single late
      # run that's still in flight on a slow runner.
      #
      # NOTE: this alert is silently inactive until
      # `CRAWLER_PUSHGATEWAY_URL` is wired into the runtime env of
      # the cron container (see PR body for the operator follow-up).
      # Without it, `_push_metrics` is a no-op and the series is
      # never created. `absent()` would page on that missing state,
      # but until the Pushgateway is reachable that would be noise —
      # so this alert relies on the series existing once, then
      # going stale.
      - alert: CronJobMissing
        expr: time() - max by (cron_job) (crawler_cron_last_run_ts) > 6 * 60 * 60
        for: 1h
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Cron job {{ $labels.cron_job }} hasn't reported in >6h"
          description: |
            `crawler_cron_last_run_ts{cron_job="{{ $labels.cron_job }}"}`
            is more than 6 hours stale. The scheduled run stopped
            completing — either the GitHub Actions workflow is
            failing, the SSH dispatch to the Hetzner host failed,
            the container started but its body raised before reaching
            `cron.complete`, or Pushgateway is unreachable from the
            cron runtime. Watchlist counts and Typesense facet
            totals go stale fleet-wide while this is down.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # --- EMAIL ---------------------------------------------------

      # Companion to CronJobMissing. The cron is reporting on
      # schedule but the most recent run failed (the body raised
      # inside `async with cron_run(...)`). Email severity (not
      # page) because the next scheduled cycle will retry; only a
      # sustained streak warrants on-call attention, which
      # CronJobMissing catches by the 6h staleness threshold once
      # consecutive failures stop emitting fresh `last_run_ts`
      # samples... except they don't — `_push_metrics` is called
      # in BOTH the success and failure branches, so `last_run_ts`
      # advances even on failure. That's deliberate: it separates
      # "this job is dead" (CronJobMissing) from "this job is
      # running but broken" (CronJobFailing).
      #
      # 10m `for:` debounces single transient failures (Supabase
      # blip, Typesense restart) — the next run usually recovers.
      - alert: CronJobFailing
        expr: crawler_cron_last_run_status == 0
        for: 10m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Cron job {{ $labels.cron_job }} reported failure on last run"
          description: |
            `crawler_cron_last_run_status{cron_job="{{ $labels.cron_job }}"}`
            is 0, meaning the most recent run raised an exception
            inside `cron_run()`. The next scheduled cycle will
            retry — if this clears, no action needed. If it
            persists, the underlying body is broken (Typesense
            outage, schema mismatch, Postgres unreachable from the
            cron container, etc.). Loki carries the failure
            details under `event="cron.complete"` with
            `status="failure"`.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

      # Dead-letter entries mean the inflight reaper gave up after
      # repeated expired leases for the same task. This is usually a
      # poison task, worker crash loop, or lease TTL mismatch. Email
      # severity because the fleet can keep processing other work, but
      # the parked task will never self-heal without operator review.
      - alert: DeadletterQueueNotEmpty
        expr: max by (wtype) (crawler_inflight_deadletter_depth) > 0
        for: 1h
        labels:
          severity: medium
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler dead-letter queue {{ $labels.wtype }} is non-empty"
          description: |
            `crawler_inflight_deadletter_depth{wtype="{{ $labels.wtype }}"}`
            has been nonzero for more than 1 hour. The inflight reaper
            moved one or more tasks to `deadletter:{{ $labels.wtype }}`
            after repeated expired leases. Inspect the task descriptors
            before removing anything from Redis.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#inflight-leases-and-dead-letter-recovery

      # Catches "exporter container alive but stuck on a Supabase
      # write" — a partial-failure mode that does not trigger
      # NoMetricsFromCrawler. Threshold is 10 expected flush cycles
      # at the natural cadence (<60s p95), with a 5m debounce for
      # transient network blips.
      - alert: ExporterStale
        expr: time() - crawler_exporter_last_flush_ts{instance="exporter"} > 900
        for: 5m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Exporter has not flushed in >15m"
          description: |
            `crawler_exporter_last_flush_ts` is more than 15 minutes
            stale. The exporter container is up (otherwise
            NoMetricsFromCrawler would fire) but its flush loop is
            stuck — usually a Supabase write backoff or a Typesense
            outage. Check `docker logs deploy-exporter-1` and the
            Export Lag panel.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md

      # The exporter never waits for a zero-writer gap. A sustained old cutoff
      # means a marked posting-writer transaction is holding back freshness.
      - alert: CdcWriterCutoffDelayed
        expr: max_over_time(crawler_exporter_cdc_cutoff_delay_seconds{instance="exporter"}[5m]) > 120
        for: 1m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "CDC writer floor is delaying export by >120s"
          description: |
            The exporter is progressing with a conservative cutoff more than
            120 seconds behind the database clock. Inspect
            `crawler_exporter_cdc_active_writers`, `pg_stat_activity`, and the
            `cdc_snapshot_cutoff.delayed` event before terminating anything.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#commit-safe-posting-cdc

      # A lock that disappeared between the dynamic pg_locks/activity scans is
      # safe and counted separately. This alert is reserved for a marker that
      # remains held without an attributable transaction start; the exporter
      # fails that tick closed rather than advancing either cursor.
      - alert: CdcWriterIdentityUnavailable
        expr: increase(crawler_exporter_cdc_unknown_writers_total{instance="exporter"}[15m]) > 0
        for: 1m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "A CDC writer lock has no attributable transaction start"
          description: |
            The exporter kept both cursors pinned because a shared CDC writer
            marker remained held after recheck without a visible transaction
            start. Inspect `pg_locks`, `pg_stat_activity`, prepared
            transactions, and `cdc_snapshot_cutoff.unknown_writer`; do not
            terminate a backend until its owner and rollback consequence are
            understood.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#commit-safe-posting-cdc

      # Reconciliation evidence is persisted in authoritative PostgreSQL and
      # scraped by the PostgreSQL host collector, so exporter recreation can
      # neither reset the schedule nor erase the last outcome.
      - alert: CrossStoreReconciliationSchemaMissing
        expr: jobseek_cross_store_reconciliation_schema_ready != 1
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "The durable reconciliation schema is unavailable"
          description: "The PostgreSQL host is healthy but the reconciliation state table is absent; verify the crawler Alembic deployment before running repairs."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#cross-store-reconciliation

      - alert: CrossStoreReconciliationFailed
        expr: |
          jobseek_cross_store_reconciliation_last_attempt_unixtime > 0
            and on (target)
          jobseek_cross_store_reconciliation_last_attempt_success == 0
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.target }} reconciliation failed"
          description: |
            The last bounded reconciliation attempt failed and retained its
            durable partition cursor for a fail-closed retry. Inspect the
            systemd service journal and the persisted target outcome.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#cross-store-reconciliation

      - alert: CrossStoreReconciliationRevisionUnavailable
        expr: |
          absent(jobseek_cross_store_reconciliation_deployed_revision_available)
          or
          jobseek_cross_store_reconciliation_deployed_revision_available != 1
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "The crawler host cannot read its deployed reconciliation revision"
          description: "The immutable reconciliation wrapper revision is missing, corrupt, or inaccessible to the deploy service account; hourly parity checks cannot start."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#cross-store-reconciliation-timer

      - alert: CrossStoreReconciliationAttemptStale
        expr: |
          jobseek_cross_store_reconciliation_last_attempt_unixtime == 0
          or
          time() - jobseek_cross_store_reconciliation_last_attempt_unixtime > 9000
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.target }} reconciliation has not attempted an hourly slice"
          description: "No reconciliation attempt has completed within the 2.5-hour timer, jitter, lock-wait, and runtime budget. Inspect the crawler-host timer and deployment revision before changing durable cursors."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#cross-store-reconciliation-timer

      - alert: CrossStoreReconciliationStale
        expr: |
          (
            jobseek_cross_store_reconciliation_last_success_unixtime > 0
              and on (target)
            time() - jobseek_cross_store_reconciliation_last_success_unixtime > 108000
          )
          or
          (
            jobseek_cross_store_reconciliation_last_success_unixtime == 0
              and on (target)
            jobseek_cross_store_reconciliation_cycle_started_unixtime > 0
              and on (target)
            time() - jobseek_cross_store_reconciliation_cycle_started_unixtime > 108000
          )
          or
          (
            jobseek_cross_store_reconciliation_last_attempt_unixtime == 0
              and on ()
            jobseek_cross_store_reconciliation_schema_ready == 1
          )
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.target }} reconciliation has no fresh full-cycle success"
          description: "No complete verified reconciliation cycle has succeeded within the 30-hour freshness budget."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#cross-store-reconciliation

      - alert: CrossStoreReconciliationDrift
        expr: jobseek_cross_store_reconciliation_last_unresolved > 0
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "{{ $labels.target }} reconciliation retains unresolved drift"
          description: "A deterministic partition found downstream active-state or document-set drift that was not verified as repaired."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#cross-store-reconciliation

      - alert: CrossStoreReconciliationRunStuck
        expr: jobseek_cross_store_reconciliation_stuck_runs > 0
        for: 3m
        labels:
          severity: critical
          service: cross-store-reconciliation
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "A reconciliation run has remained unfinished for over two hours"
          description: "The durable run ledger contains a stale running row; inspect the host timer, container, and database advisory lock before clearing anything."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md#cross-store-reconciliation

      # Catches steady-state degradation: WAF blocking a major board
      # source, Postgres going read-only, etc. >50% failure rate is
      # rare in normal operation; legitimate noisy boards top out
      # around 20%. Long debounce (30m) so single bad batches don't
      # page.
      - alert: TaskFailureRateHigh
        expr: |
          sum(rate(crawler_tasks_total{status="failed"}[15m]))
            / clamp_min(sum(rate(crawler_tasks_total[15m])), 0.001)
            > 0.5
        for: 30m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler task failure rate >50% for 30m"
          description: |
            More than half of all crawler tasks are failing.
            Common causes: WAF block on a high-volume board (Akamai/
            DataDome), Postgres connection saturation, or a
            recently-merged scraper that broke a major ATS. See the
            Task Throughput panels and the daily error-review report.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/14-error-review-routine.md

      # Shared-origin protection (#3195, #5353, #5706, #5707, #5717). The
      # breaker opens after three failed crawler runs against the same real
      # outbound hostname within ten minutes and defers sibling boards and
      # postings for thirty minutes. Alert once per host incident.
      - alert: UpstreamHostCircuitOpen
        expr: sum(increase(crawler_tasks_total{status=~"host_circuit_(open|half_open)"}[10m])) > 0
        for: 5m
        labels:
          severity: medium
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler upstream-host circuit is open"
          description: |
            Monitor or scrape work is being deferred before network I/O
            because several tasks failed against a shared origin. Inspect the
            `pipeline.*.host_circuit_*` Loki events for bounded per-origin
            attribution; Prometheus intentionally keeps only fleet outcomes.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/03-crawler-architecture.md

      # Catches the failure mode from the 2026-04-26 NHS spike (#2722):
      # a paginating monitor silently truncates and tombstones live
      # postings via _MARK_GONE_BY_TIMESTAMP. Two conditions must both
      # hold:
      #
      # 1. RATIO: fleet 30m gone rate exceeds 3× the rolling 7-day
      #    median of itself. Subquery `[7d:30m]` evaluates the inner
      #    expression every 30m for the last 7 days, then
      #    quantile_over_time(0.5, ...) picks the median (more robust
      #    to single-cycle outliers polluting the baseline than mean).
      #
      # 2. FLOOR: absolute rate above 5 events/sec averaged over the
      #    same 30m window. Without this, the alert pages 3–7×/day on
      #    quiet weekends — fleet-wide ``gone`` is bursty (cron-cadenced
      #    sweeps), and on a quiet baseline 3× median is easy to cross
      #    on a small board's normal turnover. The floor was chosen
      #    above the observed normal-day p95 (~3–4/s); the NHS spike
      #    peaked above 30/s, well clear of the floor. Verified by
      #    backtest in PR review (#2726).
      #
      # Note the metric carries the ``_total`` suffix at the
      # Prometheus exposition layer (prometheus_client convention),
      # so the query name is ``crawler_monitor_jobs_discovered_total``
      # even though the constructor argument is the same.
      #
      # Fleet-level only — the counter does not carry a ``board_id``
      # label (cardinality concern with ~3000 boards). Per-board
      # alerting is a Loki-LogQL follow-up; the
      # ``batch.monitor.success`` log line includes board_id and gone
      # count and can be aggregated there.
      - alert: DelistingRateSpike
        expr: |
          (
            sum(rate(crawler_monitor_jobs_discovered_total{action="gone"}[30m]))
              >
            3 *
            quantile_over_time(0.5,
              sum(rate(crawler_monitor_jobs_discovered_total{action="gone"}[30m]))[7d:30m]
            )
          )
          and
          sum(rate(crawler_monitor_jobs_discovered_total{action="gone"}[30m])) > 5
        for: 3m
        labels:
          severity: critical
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Crawler rolling 30m delisting rate is >3× its 7d median"
          description: |
            Fleet-wide
            ``crawler_monitor_jobs_discovered_total{action="gone"}`` rate
            is above 3× the 7-day rolling median *and* above 5/s for
            three minutes. The 2026-04-26 NHS spike (#2722) is the
            failure mode this catches: a paginating monitor silently
            truncates URL discovery and ``_MARK_GONE_BY_TIMESTAMP``
            tombstones live postings.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/14-error-review-routine.md

      # The PREVENTIVE signal counterpart to DelistingRateSpike. When
      # the resilience guards from #2723/#2724 catch a truncation, the
      # delisting itself is suppressed (so DelistingRateSpike won't
      # fire). This alert observes the suppression itself, so we
      # notice the underlying monitor bug even when the guards are
      # doing their job.
      #
      # NOTE: ``crawler_monitor_gone_skipped_total`` is introduced by
      # PR #2729. Until that ships the metric series doesn't exist
      # and PromQL returns an empty vector — this alert is silently
      # no-op. After #2729 lands it becomes active automatically; no
      # alert-config change needed.
      #
      # Email severity (not page) because the guards already prevented
      # the user-visible damage; this is "investigate within business
      # hours". Threshold of 5 skips/hour for 1h debounces single
      # noisy boards. Bump down if it turns out to be too quiet.
      - alert: GoneDetectionGuardsFiring
        expr: sum(increase(crawler_monitor_gone_skipped_total[1h])) > 5
        for: 1h
        labels:
          severity: medium
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Gone-detection guards skipping mark-gone — investigate"
          description: |
            The drop guard (#2723) and/or blast-radius cap (#2724) have
            skipped ``_MARK_GONE_BY_TIMESTAMP`` more than 5 times in the
            last hour. The guards prevented mass false delistings, but
            the underlying monitor bug — usually a paginating monitor
            silently truncating (#2722) — needs fixing.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/14-error-review-routine.md

  - name: jobseek_crawler_board_quarantine
    interval: 30s
    rules:
      - alert: CrawlerPhantomActivePostings
        expr: jobseek_crawler_phantom_active_postings > 0
        for: 15m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "Terminal crawler boards still own active postings"
          description: >-
            {{ $value }} locally active postings are owned by disabled or
            confirmed-gone boards. Classify configured boards first, then run
            the bounded phantom-posting sweep and verify Typesense convergence.
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#phantom-active-posting-sweep

      - alert: CrawlerBoardQuarantineSchemaMissing
        expr: jobseek_crawler_board_quarantine_schema_ready == 0
        for: 15m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler board quarantine schema is missing"
          description: "The host sampler cannot observe recoverable board quarantine state after the deployment grace period."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#board-quarantine-recovery

      - alert: CrawlerBoardQuarantineHasActivePostings
        expr: jobseek_crawler_quarantine_active_postings > 0
        for: 30m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Quarantined crawler boards still own active postings"
          description: "{{ $value }} locally active postings are owned by quarantined boards. Recover the live source before the verified-dead phantom sweep."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#board-quarantine-recovery

      - alert: CrawlerBoardQuarantineStale
        expr: jobseek_crawler_quarantine_oldest_seconds > 7 * 24 * 60 * 60
        for: 30m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "A crawler board has remained quarantined for more than seven days"
          description: "The oldest recoverable board quarantine is {{ $value }} seconds old; classify the integration instead of allowing terminal drift."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#board-quarantine-recovery

      - alert: CrawlerBoardQuarantineRecoveryStalled
        expr: |
          jobseek_crawler_quarantined_boards > 0
            and on()
          increase(jobseek_crawler_board_recoveries_total[24h]) == 0
        for: 6h
        labels:
          severity: medium
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler quarantine has no recoveries in 24 hours"
          description: "Configured boards remain quarantined and the durable recovery counter has not advanced."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#board-quarantine-recovery

      - alert: CrawlerBoardGoneSchemaMissing
        expr: jobseek_crawler_board_gone_schema_ready == 0
        for: 15m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Crawler provider-gone confirmation schema is missing"
          description: "The host sampler cannot observe spaced provider-gone confirmations or automatic recoveries after the deployment grace period."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#provider-gone-confirmation-and-recovery

      - alert: CrawlerBoardGonePendingStale
        expr: |
          jobseek_crawler_gone_pending_oldest_seconds > 24 * 60 * 60
            and on()
          increase(jobseek_crawler_board_gone_recoveries_total[24h]) == 0
        for: 30m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "A provider-gone confirmation has been pending for more than 24 hours"
          description: "The oldest pending confirmation is {{ $value }} seconds old and no board has self-recovered in 24 hours; inspect Redis scheduling and the provider-native endpoint."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#provider-gone-confirmation-and-recovery

      - alert: CrawlerBoardGoneTransitionSpike
        expr: increase(jobseek_crawler_board_gone_transitions_total[1h]) > 10
        for: 10m
        labels:
          severity: high
          service: crawler
          owner: codex-error-review
          route: codex-daily
        annotations:
          summary: "Provider-gone terminal transitions spiked"
          description: "More than ten configured boards reached terminal gone after spaced confirmations in one hour; check for a provider/CDN incident before accepting the delist wave."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#provider-gone-confirmation-and-recovery

  - name: jobseek_operator_handoffs
    interval: 30s
    rules:
      - alert: CodexDailyErrorReviewFailed
        expr: |
          jobseek_codex_daily_error_review_last_attempt_unixtime > 0
            and on (instance)
          jobseek_codex_daily_error_review_last_attempt_success == 0
            and on (instance)
          jobseek_codex_daily_error_review_run_in_progress == 0
        for: 3m
        labels:
          severity: critical
          service: codex-error-review
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "The daily Codex error review failed"
          description: "The crawler-host routine completed unsuccessfully. Independent paging remains active; inspect the unit journal and preserve its redacted evidence bundle."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#independent-production-paging

      - alert: CodexDailyErrorReviewStale
        expr: |
          jobseek_codex_daily_error_review_last_success_unixtime == 0
          or
          time() - jobseek_codex_daily_error_review_last_success_unixtime > 36 * 60 * 60
        for: 3m
        labels:
          severity: critical
          service: codex-error-review
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "The daily Codex error review has no fresh success"
          description: "No successful daily review has completed within 36 hours. Grafana Cloud paging is independent of the routine and must remain the primary urgent handoff."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#independent-production-paging

      - alert: CodexDailyErrorReviewRunStuck
        expr: |
          jobseek_codex_daily_error_review_run_in_progress == 1
            and on (instance)
          time() - jobseek_codex_daily_error_review_last_attempt_unixtime > 3 * 60 * 60
        for: 3m
        labels:
          severity: critical
          service: codex-error-review
          owner: codex-error-review
          route: codex-daily
          page: production
        annotations:
          summary: "The daily Codex error review is stuck"
          description: "The routine has remained in progress beyond its normal runtime budget. Inspect lock ownership and the unit journal without disabling independent paging."
          runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#independent-production-paging
