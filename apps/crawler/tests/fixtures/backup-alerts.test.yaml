rule_files:
  - ../../alerts.yaml

evaluation_interval: 1m

tests:
  - name: active running timer does not raise a unit alert
    interval: 1m
    input_series:
      - series: 'jobseek_host_unit_active{instance="jobseek-crawler-browser",host_role="crawler",unit="jobseek-docker-gc.timer"}'
        values: '1x7'
      - series: 'jobseek_host_timer_scheduled{instance="jobseek-crawler-browser",host_role="crawler",unit="jobseek-docker-gc.timer"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: RequiredHostUnitInactive
        exp_alerts: []

  - name: inactive timer produces one deduplicated unit alert
    interval: 1m
    input_series:
      - series: 'jobseek_host_unit_active{instance="jobseek-crawler-browser",host_role="crawler",unit="jobseek-docker-gc.timer"}'
        values: '0x7'
      - series: 'jobseek_host_timer_scheduled{instance="jobseek-crawler-browser",host_role="crawler",unit="jobseek-docker-gc.timer"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: RequiredHostUnitInactive
        exp_alerts:
          - exp_labels:
              host_role: crawler
              instance: jobseek-crawler-browser
              owner: codex-error-review
              route: codex-daily
              service: fleet-runtime
              severity: high
              unit: jobseek-docker-gc.timer
            exp_annotations:
              summary: Required unit jobseek-docker-gc.timer is inactive or unscheduled on jobseek-crawler-browser
              description: A required service has remained inactive, or a required timer has remained elapsed or otherwise unscheduled, for five minutes.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

  - name: active but elapsed host timer is actionable
    interval: 1m
    input_series:
      - series: 'jobseek_host_timer_scheduled{instance="jobseek-crawler-browser",host_role="crawler",unit="jobseek-docker-gc.timer"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: RequiredHostUnitInactive
        exp_alerts:
          - exp_labels:
              host_role: crawler
              instance: jobseek-crawler-browser
              owner: codex-error-review
              route: codex-daily
              service: fleet-runtime
              severity: high
              unit: jobseek-docker-gc.timer
            exp_annotations:
              summary: Required unit jobseek-docker-gc.timer is inactive or unscheduled on jobseek-crawler-browser
              description: A required service has remained inactive, or a required timer has remained elapsed or otherwise unscheduled, for five minutes.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

  - name: crawler scrape availability counts zero-valued targets
    interval: 1m
    input_series:
      - series: 'up{job="crawler",instance="worker-1"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="worker-2"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="worker-3"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="browser-1"}'
        values: '0x5'
      - series: 'up{job="crawler",instance="exporter"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="drain"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: NoMetricsFromCrawler
        exp_alerts:
          - exp_labels:
              owner: codex-error-review
              page: production
              route: codex-daily
              service: crawler
              severity: critical
            exp_annotations:
              summary: One or more crawler scrape targets are unavailable
              description: |
                Fewer than six expected `up{job="crawler"}` targets remained
                healthy for three minutes. Either Alloy has stopped on the worker
                box, one or more containers exited or stopped exposing metrics, or
                remote_write to Grafana Cloud is failing. SSH to the box
                and check `docker ps`.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

  - name: crawler scrape availability stays quiet with all six targets healthy
    interval: 1m
    input_series:
      - series: 'up{job="crawler",instance="worker-1"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="worker-2"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="worker-3"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="browser-1"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="exporter"}'
        values: '1x5'
      - series: 'up{job="crawler",instance="drain"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: NoMetricsFromCrawler
        exp_alerts: []

  - name: crawler scrape availability ignores one transient failed scrape
    interval: 30s
    input_series:
      - series: 'up{job="crawler",instance="worker-1"}'
        values: '1 1 0 1x6'
      - series: 'up{job="crawler",instance="worker-2"}'
        values: '1x9'
      - series: 'up{job="crawler",instance="worker-3"}'
        values: '1x9'
      - series: 'up{job="crawler",instance="browser-1"}'
        values: '1x9'
      - series: 'up{job="crawler",instance="exporter"}'
        values: '1x9'
      - series: 'up{job="crawler",instance="drain"}'
        values: '1x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: NoMetricsFromCrawler
        exp_alerts: []

  - name: crawler scrape availability catches complete absence
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: NoMetricsFromCrawler
        exp_alerts:
          - exp_labels:
              owner: codex-error-review
              page: production
              route: codex-daily
              service: crawler
              severity: critical
            exp_annotations:
              summary: One or more crawler scrape targets are unavailable
              description: |
                Fewer than six expected `up{job="crawler"}` targets remained
                healthy for three minutes. Either Alloy has stopped on the worker
                box, one or more containers exited or stopped exposing metrics, or
                remote_write to Grafana Cloud is failing. SSH to the box
                and check `docker ps`.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/16-hetzner-maintenance.md#fleet-observability

  - name: two backup services on one host retain distinct alert identities
    interval: 1m
    input_series:
      - series: 'jobseek_backup_last_attempt_success{instance="jobseek-typesense",host_role="typesense",service="typesense"}'
        values: '0x5'
      - series: 'jobseek_backup_last_attempt_success{instance="jobseek-typesense",host_role="typesense",service="web-postgresql"}'
        values: '0x5'
      - series: 'jobseek_backup_last_success_unixtime{instance="jobseek-typesense",host_role="typesense",service="typesense"}'
        values: '-200000x5'
      - series: 'jobseek_backup_last_success_unixtime{instance="jobseek-typesense",host_role="typesense",service="web-postgresql"}'
        values: '-200000x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: DataBackupFailed
        exp_alerts:
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: typesense
              severity: critical
            exp_annotations:
              summary: typesense backup failed on jobseek-typesense
              description: The latest application-data backup attempt failed. The native repository is now the only recovery path; investigate immediately and preserve existing artifacts.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: web-postgresql
              severity: critical
            exp_annotations:
              summary: web-postgresql backup failed on jobseek-typesense
              description: The latest application-data backup attempt failed. The native repository is now the only recovery path; investigate immediately and preserve existing artifacts.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
      - eval_time: 4m
        alertname: DataBackupStale
        exp_alerts:
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: typesense
              severity: critical
            exp_annotations:
              summary: typesense backup is stale on jobseek-typesense
              description: No successful application-data backup has completed inside its recovery window (9 hours for web PostgreSQL; 36 hours for daily data services).
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: web-postgresql
              severity: critical
            exp_annotations:
              summary: web-postgresql backup is stale on jobseek-typesense
              description: No successful application-data backup has completed inside its recovery window (9 hours for web PostgreSQL; 36 hours for daily data services).
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
