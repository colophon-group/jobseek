rule_files:
  - ../../alerts.yaml

evaluation_interval: 1m

tests:
  - name: two backup services on one host retain distinct alert identities
    interval: 1m
    input_series:
      - series: 'jobseek_backup_last_attempt_success{instance="jobseek-typesense",host_role="typesense",service="typesense"}'
        values: '0x5'
      - series: 'jobseek_backup_last_attempt_success{instance="jobseek-typesense",host_role="typesense",service="web-postgresql"}'
        values: '0x5'
      - series: 'jobseek_backup_last_success_unixtime{instance="jobseek-typesense",host_role="typesense",service="typesense"}'
        values: '-200000x5'
      - series: 'jobseek_backup_last_success_unixtime{instance="jobseek-typesense",host_role="typesense",service="web-postgresql"}'
        values: '-200000x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: DataBackupFailed
        exp_alerts:
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: typesense
              severity: critical
            exp_annotations:
              summary: typesense backup failed on jobseek-typesense
              description: The latest application-data backup attempt failed. The native repository is now the only recovery path; investigate immediately and preserve existing artifacts.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: web-postgresql
              severity: critical
            exp_annotations:
              summary: web-postgresql backup failed on jobseek-typesense
              description: The latest application-data backup attempt failed. The native repository is now the only recovery path; investigate immediately and preserve existing artifacts.
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
      - eval_time: 4m
        alertname: DataBackupStale
        exp_alerts:
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: typesense
              severity: critical
            exp_annotations:
              summary: typesense backup is stale on jobseek-typesense
              description: No successful application-data backup has completed inside its recovery window (9 hours for web PostgreSQL; 36 hours for daily data services).
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
          - exp_labels:
              component: data-backup
              host_role: typesense
              instance: jobseek-typesense
              owner: codex-error-review
              page: production
              route: codex-daily
              service: web-postgresql
              severity: critical
            exp_annotations:
              summary: web-postgresql backup is stale on jobseek-typesense
              description: No successful application-data backup has completed inside its recovery window (9 hours for web PostgreSQL; 36 hours for daily data services).
              runbook: https://github.com/colophon-group/jobseek/blob/main/docs/19-data-backup-recovery.md#failure-and-removal-gates
