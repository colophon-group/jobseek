[project]
name = "jobseek-crawler"
dynamic = ["version"]
description = "Job listing monitor and extraction crawler"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "boto3>=1.43.71",
    "click>=8.4.2",
    "httpx>=0.28",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.2.2",
    "polars>=1.43.2",
    "jmespath>=1.0",
    "upstash-redis>=1.7.0",
    "Pillow>=12.3.0",
    "cairosvg>=2.9.0",
    "defusedxml>=0.7.1",
    "playwright>=1.62.0",
    "fast-langdetect>=1.0.1",
    "prometheus-client>=0.26.0",
    "protobuf>=6.33.0,<7",
    "redis>=8.1.0",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.12",
    "selectolax>=0.4.11",
    "pypdf>=6.15.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "jinja2>=3.1",
    "huggingface-hub>=1.27.0",
    "cryptography>=50.0.0",
    "typesense>=0.21",
    "beautifulsoup4>=4.15.0",
    "jsonschema>=4.23",
    "tzdata>=2026.3",
]

[project.scripts]
crawler = "src.cli:main"
ws = "src.workspace.cli:main"
labeller = "src.labeller.cli:main"

[project.optional-dependencies]
enrich = ["openai>=2.53.0", "anthropic>=0.122.0", "google-genai>=2.17.0"]

[dependency-groups]
dev = [
    "grpcio-tools==1.76.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.3",
    "fakeredis[lua]>=2.37.0",
    "pyright>=1.1.411",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/runtime_contract/v1/runtime_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
