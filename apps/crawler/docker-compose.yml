# docker-compose.yml — Hetzner crawler deployment (worker machine)
#
# All containers use network_mode: host (no bridge network).
# Postgres runs on a separate dedicated machine.
# Redis runs locally on the worker machine.

x-common-env: &common-env
  LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL}         # Hetzner Postgres machine
  REDIS_URL: redis://localhost:6379/0
  WORKER_ID_PREFIX: hetzner
  LOG_LEVEL: INFO
  CRAWLER_DB_POOL_IDLE_SECONDS: "60"
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
  R2_DOMAIN_URL: ${R2_DOMAIN_URL}
  R2_BUCKET: ${R2_BUCKET}
  TYPESENSE_HOST: ${TYPESENSE_HOST}
  TYPESENSE_PORT: ${TYPESENSE_PORT}
  TYPESENSE_PROTOCOL: ${TYPESENSE_PROTOCOL}
  TYPESENSE_OPERATIONS_KEY: ${TYPESENSE_OPERATIONS_KEY}
  # Proxy provider — applies to boards with ``"proxy": true`` in their
  # monitor_config / scraper_config (see src/shared/proxy.py).
  PROXY_PROVIDER: ${PROXY_PROVIDER:-none}
  WEBSHARE_PROXY_URLS: "${WEBSHARE_PROXY_URLS:-[]}"
  WEBSHARE_PROXY_URL: ${WEBSHARE_PROXY_URL:-}

services:
  # -- Redis -------------------------------------------------------
  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    network_mode: host
    # Sized for the steady-state scrape backlog, not the initial reseed.
    # ~550k keys at 2026-04-23 used ~373 MB (73% of the old 512 MB cap),
    # nearly triggering noeviction-stalled writes. 1 GB gives headroom
    # while the pipeline drains stale per-domain queues (#2526) and the
    # SuccessFactors URL-canonicalization fix (#2524) cuts cardinality.
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --bind 127.0.0.1
    volumes:
      - redis-data:/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # -- Workers (3x HTTP, each on its own metrics port) -------------
  # Each worker has 1 CPU / 1 GiB. Keep discovery at the code default and
  # cap monitors at five; paginating monitors must stream bounded batches.
  worker-1:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    # Give the cli.py SIGTERM handler time to close the Postgres pool
    # under load. Default 10s is too tight; 30s is conservative.
    stop_grace_period: 30s
    command: uv run --no-sync crawler run
    environment:
      <<: *common-env
      METRICS_PORT: "9095"
      DISCOVERY_CONCURRENCY: "20"
      MONITOR_CONCURRENCY: "5"
      CRAWLER_DB_ROLE: worker-1
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "8"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9095/\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0

  worker-2:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s  # see worker-1 — gives Postgres pool time to drain
    command: uv run --no-sync crawler run
    environment:
      <<: *common-env
      METRICS_PORT: "9096"
      DISCOVERY_CONCURRENCY: "20"
      MONITOR_CONCURRENCY: "5"
      CRAWLER_DB_ROLE: worker-2
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "8"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9096/\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0

  worker-3:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s  # see worker-1 — gives Postgres pool time to drain
    command: uv run --no-sync crawler run
    environment:
      <<: *common-env
      METRICS_PORT: "9097"
      DISCOVERY_CONCURRENCY: "20"
      MONITOR_CONCURRENCY: "5"
      CRAWLER_DB_ROLE: worker-3
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "8"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9097/\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0

  # -- Exporter ----------------------------------------------------
  exporter:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s  # uniform with workers — gives Postgres pool time to drain
    command: uv run --no-sync crawler export
    environment:
      <<: *common-env
      METRICS_PORT: "9093"
      CRAWLER_DB_ROLE: exporter
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "4"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m

  # -- R2 Drain ----------------------------------------------------
  drain:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s  # uniform with workers — gives in-flight R2 PUTs time to complete
    command: uv run --no-sync crawler drain
    environment:
      <<: *common-env
      METRICS_PORT: "9094"
      CRAWLER_DB_ROLE: drain
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "6"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m

  # IndexNow notifier removed in #2821. Companies are no longer indexed
  # (`/company/{slug}` is `noindex,follow` and the URLs are out of the
  # sitemap), so there is no remaining set of URLs to push to Bing /
  # Yandex / Seznam / Naver / Yep. `crawler notify-indexnow` and
  # `apps/crawler/src/indexnow.py` are kept in the codebase but no
  # longer scheduled — they short-circuit on `INDEXNOW_KEY` unset.

  # -- Browser -----------------------------------------------------
  browser-1:
    image: ${BROWSER_IMAGE_REF:?BROWSER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s  # see worker-1 — gives Postgres pool time to drain
    command: uv run --no-sync crawler run-browser
    environment:
      <<: *common-env
      METRICS_PORT: "9098"
      DISCOVERY_CONCURRENCY: "7"
      MONITOR_CONCURRENCY: "4"
      CRAWLER_DB_ROLE: browser-1
      CRAWLER_DB_POOL_MIN: "1"
      CRAWLER_DB_POOL_MAX: "6"
      # Bound the lifetime of each long-lived Playwright Node driver. Recycle
      # only between claims; in-flight browser tasks are never interrupted.
      BROWSER_PLAYWRIGHT_RECYCLE_SECONDS: "21600"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9098/\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 6g
    pids_limit: 4096
    cpus: 3.0

  # -- Networkless Lightpanda claimant configuration proof --------
  # This process has no queue or database authority in dark mode. It validates
  # the immutable client identity and future route, publishes a local marker,
  # and waits for SIGTERM without importing the claimant or opening a socket.
  lightpanda-claimant:
    image: ${CRAWLER_IMAGE_REF:?CRAWLER_IMAGE_REF must be an immutable GHCR digest}
    init: true
    restart: unless-stopped
    network_mode: none
    stop_grace_period: 15s
    command: ["/app/.venv/bin/lightpanda-claimant"]
    user: "10001:10001"
    read_only: true
    cgroup: private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LIGHTPANDA_B0_CLAIMANT_MODE: dark
      LIGHTPANDA_B0_SERVICE_HOST: 10.0.0.5
      LIGHTPANDA_B0_CA_CERTIFICATE: /run/credentials/lightpanda-b0/ca.pem
      LIGHTPANDA_B0_CLIENT_CERTIFICATE: /run/credentials/lightpanda-b0/client.pem
      LIGHTPANDA_B0_CLIENT_PRIVATE_KEY: /run/credentials/lightpanda-b0/client-key.pem
      LIGHTPANDA_B0_CA_SHA256_FILE: /run/credentials/lightpanda-b0/ca.sha256
      LIGHTPANDA_B0_SERVER_LEAF_SHA256_FILE: /run/credentials/lightpanda-b0/server-leaf.sha256
      LIGHTPANDA_B0_SERVER_SPKI_SHA256_FILE: /run/credentials/lightpanda-b0/server-spki.sha256
      LIGHTPANDA_B0_QUEUE_NAMESPACE: production-b0
      LIGHTPANDA_B0_SHARD_ID: lightpanda-b0
      LIGHTPANDA_B0_ROUTING_EPOCH: "1"
      CRAWLER_DB_POOL_MIN: "0"
      CRAWLER_DB_POOL_MAX: "1"
    volumes:
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/ca.pem
        target: /run/credentials/lightpanda-b0/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/client.pem
        target: /run/credentials/lightpanda-b0/client.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/client-key.pem
        target: /run/credentials/lightpanda-b0/client-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/ca.sha256
        target: /run/credentials/lightpanda-b0/ca.sha256
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/server-leaf.sha256
        target: /run/credentials/lightpanda-b0/server-leaf.sha256
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIGHTPANDA_B0_CREDENTIAL_DIR:?claimant credential generation is required}/server-spki.sha256
        target: /run/credentials/lightpanda-b0/server-spki.sha256
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/jobseek:rw,noexec,nosuid,nodev,size=64k,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "/app/.venv/bin/lightpanda-claimant", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.25
    pids_limit: 32
    ulimits:
      nofile:
        soft: 64
        hard: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # -- Grafana Alloy (metrics + log collector) --------------------
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./alloy.river:/etc/alloy/config.river:ro
      - alloy-data:/data-alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      # Leave half the cgroup for the remote-write WAL, mapped files, runtime,
      # and Docker log tailing. GOMEMLIMIT is a soft Go heap target, not the
      # container's hard limit.
      GOMEMLIMIT: 256MiB
      PROM_URL: ${GRAFANA_PROM_URL}
      PROM_USERNAME: ${GRAFANA_PROM_USERNAME}
      PROM_PASSWORD: ${GRAFANA_PROM_PASSWORD}
      LOKI_URL: ${GRAFANA_LOKI_URL}
      LOKI_USERNAME: ${GRAFANA_LOKI_USERNAME}
      LOKI_PASSWORD: ${GRAFANA_LOKI_PASSWORD}
    command: run --storage.path=/data-alloy --server.http.listen-addr=127.0.0.1:12346 /etc/alloy/config.river
    mem_limit: 512m
    cpus: 0.5

volumes:
  redis-data:
  alloy-data:
    external: true
    name: "${COMPOSE_PROJECT_NAME}_alloy-data"
